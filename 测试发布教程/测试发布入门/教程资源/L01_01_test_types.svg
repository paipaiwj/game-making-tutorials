<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">测试类型：四种都要做</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">功能 / 性能 / 多人 / 边界 —— 覆盖世界能出问题的所有方向</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="190" x="31" y="100" /><ellipse cx="126" cy="132" fill="#4ea1ff" opacity="0.6" rx="18" ry="18" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="126" y="174">功能测试</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="126" y="202">按钮能按吗？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="126" y="220">逻辑对不对？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="126" y="238">答案是预期吗？</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="190" x="247" y="100" /><ellipse cx="342" cy="132" fill="#6bcf7f" opacity="0.6" rx="18" ry="18" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="342" y="174">性能测试</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="342" y="202">帧数稳不稳？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="342" y="220">会不会卡顿？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="342" y="238">内存涨不涨？</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="190" x="463" y="100" /><ellipse cx="558" cy="132" fill="#ff9e4e" opacity="0.6" rx="18" ry="18" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="558" y="174">多人测试</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="558" y="202">两人状态同步吗？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="558" y="220">权限正确吗？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="558" y="238">拔线后正常吗？</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="190" x="679" y="100" /><ellipse cx="774" cy="132" fill="#c084fc" opacity="0.6" rx="18" ry="18" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="774" y="174">边界测试</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="774" y="202">狂点按钮？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="774" y="220">中途加入？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="774" y="238">极端数值？</text><rect fill="#1a1a1a" height="100" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="300" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="130" y="330">别只测「能玩」</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="358">能玩 ≠ 没问题：功能正确只是及格线，性能/多人/边界才是 VRChat 世界里翻车重灾区</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="382">测试不是发布前的临时任务，而是每次改完代码都要做一遍的日常</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="450">原则：先自测 → 再朋友测 → 最后公开 —— 越多人测，问题暴露得越早</text></svg>