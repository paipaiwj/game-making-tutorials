<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="440px" version="1.1" viewBox="0 0 900 440" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="440" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">版本更新：改完就重新上传</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">VRChat 世界更新是「覆盖式」的 —— 没有版本号概念，重新 Publish 即可</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="190" x="31" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="126" y="128">1. 修改内容</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="126" y="156">改代码 / 改场景</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="126" y="176">想清楚再动手</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="223" x2="245" y1="180" y2="180" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="190" x="247" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="342" y="128">2. Build &amp; Test</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="342" y="156">本地验证新改动</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="342" y="176">没测过不要传</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="439" x2="461" y1="180" y2="180" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="190" x="463" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="558" y="128">3. 重新 Publish</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="558" y="156">同一世界 ID</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="558" y="176">内容被覆盖</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2.5" x1="655" x2="677" y1="180" y2="180" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="190" x="679" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="774" y="128">4. 进世界验证</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="774" y="156">自己先进去确认</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="774" y="176">新内容真的生效</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-dasharray="[6, 4]" stroke-width="2" x1="690" x2="170" y1="268" y2="268" /><rect fill="#1e1e1e" height="22" rx="11" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="160" x="350" y="258" /><text fill="#bbbbbb" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="430" y="275">下次修改 → 再来一轮</text><rect fill="#1a1a1a" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="310" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="330">覆盖式更新的后果：旧版本不存在！上传失败或漏传 = 世界还是旧内容</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="358">老玩家在更新前进入的世界仍是旧版（会话不重载），新进的人才是新版 —— 别以为重启就更新</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="420">想安全改回旧版：上传前把工程备份好，或用 git 记录每次发布点</text></svg>