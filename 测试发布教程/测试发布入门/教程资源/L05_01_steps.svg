<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="512px" version="1.1" viewBox="0 0 900 512" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="512" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">实战：完整发布一个世界</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">按顺序走完这 6 步，从「刚做完」到「全世界可玩」</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="270" x="15" y="96" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="150" y="128">1. 备份工程</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="150" y="160">复制工程文件夹</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="150" y="180">或 git 提交存档</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="287" x2="313" y1="181" y2="181" /><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="270" x="15" y="290" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="150" y="322">2. 性能检查</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="150" y="354">Stats 面板</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="150" y="374">性能报告全绿</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="287" x2="313" y1="375" y2="375" /><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="270" x="15" y="484" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="150" y="516">3. Build &amp; Test</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="150" y="548">单人进世界</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="150" y="568">自测所有功能</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="287" x2="313" y1="569" y2="569" /><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="270" x="315" y="96" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="450" y="128">4. 双开多人测试</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="160">复制 VRChat 快捷方式</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="180">加 -multi 参数</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="270" x="315" y="290" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="450" y="322">5. 上传发布</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="354">填信息 → Publish</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="374">等进度完成</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="270" x="315" y="484" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="450" y="516">6. 进世界验证</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="548">自己重新进世界</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="568">确认新内容生效</text><rect fill="#1a1a1a" height="36" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="470" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="494">顺序不能乱：不备份就上传，翻车了连回滚都没得回</text></svg>