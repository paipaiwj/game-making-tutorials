<svg baseProfile="full" height="440px" version="1.1" viewBox="0 0 900 440" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="440" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">上传发布：把世界交给全 VRChat</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">SDK 控制面板里走完三步，你的世界就出现在世界的公开列表里</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="190" x="31" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="126" y="128">1. 填写信息</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="126" y="156">世界名称 / 描述</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="126" y="176">上传预览图</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="223" x2="245" y1="180" y2="180" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="190" x="247" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="342" y="128">2. Build &amp; Test</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="342" y="156">最后再本地验证一次</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="342" y="176">（这次一定要测）</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="439" x2="461" y1="180" y2="180" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="190" x="463" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="558" y="128">3. 点击 Publish</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="558" y="156">构建并上传</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="558" y="176">等待进度完成</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2.5" x1="655" x2="677" y1="180" y2="180" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="190" x="679" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="774" y="128">4. 完成</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="774" y="156">得到世界 ID</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="774" y="176">别人可搜索进入</text><rect fill="#1a1a1a" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="300" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="330">首次发布必须要有「已通过的预览图」，名称和描述写清楚别人才能搜到</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="358">发布后世界立即上线，任何人搜索名字都能进来 —— 所以发布前务必完成全部测试</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="420">菜单位置：VRChat SDK → Show Control Panel → Content Manager → 你的世界</text></svg>