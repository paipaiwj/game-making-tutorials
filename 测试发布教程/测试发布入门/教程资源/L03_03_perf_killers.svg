<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">常见性能杀手清单</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">世界卡顿 90% 来自这几样 —— 先用它们排查，再考虑其他</text><rect fill="#2b2b2b" height="42" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="170" x="60" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="117">实时光源</text><rect fill="#1a1a1a" height="42" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="480" x="245" y="90" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="260" y="109">每个实时灯都是额外着色开销</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="260" y="126">静态场景用烘焙光照替代</text><ellipse cx="792" cy="112" fill="#ff9e4e" opacity="0.25" rx="24" ry="15" stroke="none" stroke-width="1.0" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="792" y="116">高</text><rect fill="#2b2b2b" height="42" rx="8" ry="6" stroke="#ff6b6b" stroke-width="2" width="170" x="60" y="140" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="167">粒子系统</text><rect fill="#1a1a1a" height="42" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="480" x="245" y="140" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="260" y="159">粒子多 + 生命长 = 同时活跃量大</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="260" y="176">限制数量与发射率</text><ellipse cx="792" cy="162" fill="#ff6b6b" opacity="0.25" rx="24" ry="15" stroke="none" stroke-width="1.0" /><text fill="#ff6b6b" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="792" y="166">高</text><rect fill="#2b2b2b" height="42" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="170" x="60" y="190" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="217">材质数量</text><rect fill="#1a1a1a" height="42" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="480" x="245" y="190" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="260" y="209">材质越多 Draw Call 越多</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="260" y="226">同类物体共用材质</text><ellipse cx="792" cy="212" fill="#4ea1ff" opacity="0.25" rx="24" ry="15" stroke="none" stroke-width="1.0" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="792" y="216">高</text><rect fill="#2b2b2b" height="42" rx="8" ry="6" stroke="#6bcf7f" stroke-width="2" width="170" x="60" y="240" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="267">贴图太大</text><rect fill="#1a1a1a" height="42" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="480" x="245" y="240" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="260" y="259">4K 贴图是内存杀手</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="260" y="276">远处物体用 512/1024</text><ellipse cx="792" cy="262" fill="#6bcf7f" opacity="0.25" rx="24" ry="15" stroke="none" stroke-width="1.0" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="792" y="266">中</text><rect fill="#2b2b2b" height="42" rx="8" ry="6" stroke="#c084fc" stroke-width="2" width="170" x="60" y="290" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="317">网格过细</text><rect fill="#1a1a1a" height="42" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="480" x="245" y="290" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="260" y="309">几万个面的模型毫无必要</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="260" y="326">按距离做 LOD 简化</text><ellipse cx="792" cy="312" fill="#c084fc" opacity="0.25" rx="24" ry="15" stroke="none" stroke-width="1.0" /><text fill="#c084fc" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="792" y="316">中</text><rect fill="#2b2b2b" height="42" rx="8" ry="6" stroke="#ffcc66" stroke-width="2" width="170" x="60" y="340" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="367">透明物体</text><rect fill="#1a1a1a" height="42" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="480" x="245" y="340" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="260" y="359">透明 = 排序开销，越多越卡</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="260" y="376">非必要不用透明</text><ellipse cx="792" cy="362" fill="#ffcc66" opacity="0.25" rx="24" ry="15" stroke="none" stroke-width="1.0" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="792" y="366">中</text><rect fill="#1a1a1a" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="392" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="423">性能细节见《渲染入门》第 4 篇 —— 排查顺序：粒子 → 材质 → 实时光 → 贴图</text></svg>