<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">常见问题对照表</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="60" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="92">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="245" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="330" y="92">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="560" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="645" y="92">解决办法</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="104" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="138">上传失败 / 报错</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="104" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="138">网络问题或 SDK 版本过旧</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="104" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="138">重试；更新 SDK 到最新版本</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="174" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="208">没有发布权限</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="174" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="208">VRChat 账号没完成设置</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="174" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="208">检查账号邮箱验证/内容创建者设置</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="244" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="278">世界太大传不上</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="244" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="278">工程里有超大贴图/模型</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="244" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="278">压缩贴图、清理未用资源后再传</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="314" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="348">别人说我世界卡</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="314" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="348">性能报告或实测数据差</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="314" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="348">看 Stats + 性能报告，逐个砍性能杀手</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="384" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="418">更新没生效</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="384" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="418">老会话不重载 / 忘了重传</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="384" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="418">重新进世界；确认重新 Publish 成功</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="454" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="488">预览图不对</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="454" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="488">图没上传或还在审核</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="454" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="488">重新上传预览图并等审核通过</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="544">调试心法：先看 Console 报错，再看 Stats 数据，最后才问别人 —— 90% 的问题自己能查到</text></svg>