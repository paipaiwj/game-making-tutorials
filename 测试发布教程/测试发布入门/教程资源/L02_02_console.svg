<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">Console 窗口：错误都写在这里</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">Unity 把所有日志、警告、错误集中显示 —— 报错第一件事就是看它</text><rect fill="#131313" height="300" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="430" x="60" y="100" /><rect fill="#222222" height="30" rx="8" ry="6" stroke="none" stroke-width="1.5" width="430" x="60" y="100" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="start" x="76" y="120">Console</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="74" y="144">Clear | Collapse | Clear on Play</text><text fill="#6ecfff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="74" y="170">[Info] Scene loaded: MyWorld</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="74" y="196">[Warning] Material not found</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="74" y="222">[Warning] 音频组件未赋值</text><text fill="#ff6b6b" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="start" x="74" y="248">[Error] NullReferenceException</text><text fill="#ff8f8f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="74" y="274">  at GameComponent.Update</text><text fill="#6ecfff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="74" y="300">[Info] Debug.Log 测试输出</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="540" y="100">怎么读这个窗口</text><rect fill="#2b2b2b" height="40" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="350" x="530" y="128" /><ellipse cx="540" cy="148" fill="#6ecfff" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#6ecfff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="554" y="145">Info（蓝）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="554" y="161">正常运行信息，可忽略或当调试输出</text><rect fill="#2b2b2b" height="40" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="350" x="530" y="180" /><ellipse cx="540" cy="200" fill="#ffcc66" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="554" y="197">Warning（黄）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="554" y="213">可能有隐患，如材质丢失、组件没赋值</text><rect fill="#2b2b2b" height="40" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="350" x="530" y="232" /><ellipse cx="540" cy="252" fill="#ff6b6b" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#ff6b6b" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="554" y="249">Error（红）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="554" y="265">代码出错了，点开看堆栈定位</text><rect fill="#2b2b2b" height="40" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="350" x="530" y="284" /><ellipse cx="540" cy="304" fill="#4ea1ff" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="554" y="301">点行数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="554" y="317">跳转到出错的代码文件那一行</text><rect fill="#1a1a1a" height="46" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="380" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="402">红色 Error 通常伴随「世界没反应」：先看 Console 再瞎猜，多数 bug 是「某个引用没连」</text></svg>