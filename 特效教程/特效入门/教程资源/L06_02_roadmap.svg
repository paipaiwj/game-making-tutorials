<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker></defs><rect fill="#1e1e1e" height="400" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">特效学习路线图</text><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="160" x="-20" y="120" /><ellipse cx="60" cy="148" fill="#4ea1ff" opacity="0.4" rx="22" ry="22" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="60" y="180">入门</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="60" y="202">理解粒子系统</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="60" y="222">创建第一个特效</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="140" x2="180" y1="185" y2="185" /><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="160" x="200" y="120" /><ellipse cx="280" cy="148" fill="#6bcf7f" opacity="0.4" rx="22" ry="22" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="280" y="180">核心模块</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="202">掌握 Main/Emission/</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="222">Shape 三大模块</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="360" x2="400" y1="185" y2="185" /><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="160" x="420" y="120" /><ellipse cx="500" cy="148" fill="#ff9e4e" opacity="0.4" rx="22" ry="22" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="500" y="180">视觉打磨</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="500" y="202">Color/Size over</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="500" y="222">Lifetime 动态变化</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="580" x2="620" y1="185" y2="185" /><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="160" x="640" y="120" /><ellipse cx="720" cy="148" fill="#c084fc" opacity="0.4" rx="22" ry="22" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="720" y="180">实战</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="202">组合多个系统</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="222">制作完整特效</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="450" y="285">进阶方向</text><ellipse cx="100" cy="315" fill="#4ea1ff" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="120" y="319">学习 Sub Emitter（子发射器）— 粒子消亡时生成新粒子</text><ellipse cx="100" cy="339" fill="#4ea1ff" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="120" y="343">学习 Noise 模块 — 给粒子添加随机扰动</text><ellipse cx="100" cy="363" fill="#4ea1ff" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="120" y="367">学习 Triggers 模块 — 粒子碰撞触发事件</text><ellipse cx="100" cy="387" fill="#4ea1ff" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="120" y="391">学习 Custom Data — 在 Shader 中读取粒子自定义数据</text></svg>