<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600px" version="1.1" viewBox="0 0 900 600" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker></defs><rect fill="#1e1e1e" height="600" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">Particle System 组件结构</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="60" y="80">GameObject</text><rect fill="#2b2b2b" height="400" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="220" x="40" y="90" /><rect fill="#1a1a1a" height="35" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="55" y="105" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="70" y="127">Transform</text><rect fill="#4ea1ff" height="35" opacity="0.2" rx="4" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="190" x="55" y="150" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="70" y="172">Particle System</text><rect fill="#1a1a1a" height="30" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="55" y="200" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="70" y="220">Main</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="180" y="220">主模块</text><rect fill="#1a1a1a" height="30" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="55" y="236" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="70" y="256">Emission</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="180" y="256">发射</text><rect fill="#1a1a1a" height="30" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="55" y="272" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="70" y="292">Shape</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="180" y="292">形状</text><rect fill="#1a1a1a" height="30" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="55" y="308" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="70" y="328">Velocity over Lifetime</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="180" y="328">速度</text><rect fill="#1a1a1a" height="30" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="55" y="344" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="70" y="364">Color over Lifetime</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="180" y="364">颜色</text><rect fill="#1a1a1a" height="30" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="55" y="380" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="70" y="400">Size over Lifetime</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="180" y="400">大小</text><rect fill="#1a1a1a" height="30" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="55" y="416" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="70" y="436">Renderer</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="180" y="436">渲染</text><rect fill="#2b2b2b" height="180" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="560" x="310" y="90" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="start" x="330" y="120">核心概念</text><ellipse cx="340" cy="150" fill="#4ea1ff" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="355" y="154">粒子 = 一个个小图片（Quad），以极高速度生成、运动、消失</text><ellipse cx="340" cy="178" fill="#4ea1ff" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="355" y="182">粒子系统 = 控制这些粒子的「导演」：在哪里生、怎么飞、长什么样</text><ellipse cx="340" cy="206" fill="#4ea1ff" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="355" y="210">模块化设计 = 每个模块独立控制一个方面，勾选即启用</text><ellipse cx="340" cy="234" fill="#4ea1ff" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="355" y="238">一个 GameObject 可以有多个 Particle System 协同工作</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="330" y="300">粒子生命周期</text><rect fill="#1a1a1a" height="160" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="560" x="310" y="320" /><line stroke="#4ea1ff" stroke-width="2" x1="340" x2="840" y1="380" y2="380" /><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="830" x2="855" y1="380" y2="380" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="340" y="370">出生</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="510" y="370">运动+变化</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="790" y="370">消亡</text><ellipse cx="370" cy="380" fill="#4ea1ff" opacity="1.0" rx="6" ry="6" stroke="none" stroke-width="1.0" /><ellipse cx="470" cy="380" fill="#4ea1ff" opacity="0.8200000000000001" rx="12" ry="12" stroke="none" stroke-width="1.0" /><ellipse cx="570" cy="380" fill="#4ea1ff" opacity="0.64" rx="18" ry="18" stroke="none" stroke-width="1.0" /><ellipse cx="670" cy="380" fill="#4ea1ff" opacity="0.45999999999999996" rx="24" ry="24" stroke="none" stroke-width="1.0" /><ellipse cx="770" cy="380" fill="#4ea1ff" opacity="0.28" rx="30" ry="30" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="370" y="420">Duration（持续时间）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="510" y="420">Start Lifetime</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="510" y="438">每个粒子的存活时间</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="710" y="420">循环 / 一次性</text></svg>