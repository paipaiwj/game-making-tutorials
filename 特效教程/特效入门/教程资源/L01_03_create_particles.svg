<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker></defs><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">创建第一个粒子系统</text><rect fill="#2b2b2b" height="160" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="195" x="40" y="70" /><ellipse cx="65" cy="95" fill="#4ea1ff" opacity="1.0" rx="16" ry="16" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="65" y="100">1</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="90" y="98">Hierarchy 右键</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="135">Effects → Particle System</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="1.5" x1="235" x2="255" y1="150" y2="150" /><rect fill="#2b2b2b" height="160" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="195" x="255" y="70" /><ellipse cx="280" cy="95" fill="#4ea1ff" opacity="1.0" rx="16" ry="16" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="280" y="100">2</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="305" y="98">选中粒子物体</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="271" y="135">查看 Inspector</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="1.5" x1="450" x2="470" y1="150" y2="150" /><rect fill="#2b2b2b" height="160" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="195" x="470" y="70" /><ellipse cx="495" cy="95" fill="#4ea1ff" opacity="1.0" rx="16" ry="16" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="495" y="100">3</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="520" y="98">展开 Main 模块</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="486" y="135">设置 Duration=5, Looping=勾上</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="1.5" x1="665" x2="685" y1="150" y2="150" /><rect fill="#2b2b2b" height="160" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="195" x="685" y="70" /><ellipse cx="710" cy="95" fill="#4ea1ff" opacity="1.0" rx="16" ry="16" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="710" y="100">4</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="735" y="98">调整 Start Speed</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="701" y="135">设为 3，粒子飞得更快</text><rect fill="#1a1a1a" height="100" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="820" x="40" y="260" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="70" y="290">点击 Play 后你应该看到：</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="70" y="320">场景中出现了向上飘散的白色小方块 — 这就是你的第一个粒子特效！</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="70" y="342">默认材质是 Default-Particle，白色方块是默认的粒子形状</text></svg>