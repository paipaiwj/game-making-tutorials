<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">粒子系统性能优化</text><rect fill="#2b2b2b" height="50" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1" width="840" x="30" y="70" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="55" y="88">Max Particles</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="220" y="88">限制最大粒子数</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="500" y="88">默认 1000，按需降低</text><rect fill="#6bcf7f" height="20" opacity="0.2" rx="4" ry="6" stroke="none" stroke-width="1.5" width="40" x="770" y="85" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="790" y="98">推荐</text><rect fill="#2b2b2b" height="50" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1" width="840" x="30" y="132" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="55" y="150">贴图尺寸</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="220" y="150">粒子贴图 ≤ 256×256</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="500" y="150">越小越好，视觉差别不大</text><rect fill="#6bcf7f" height="20" opacity="0.2" rx="4" ry="6" stroke="none" stroke-width="1.5" width="40" x="770" y="147" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="790" y="160">推荐</text><rect fill="#2b2b2b" height="50" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1" width="840" x="30" y="194" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="55" y="212">Simulation Speed</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="220" y="212">模拟速度</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="500" y="212">0.5 = 慢动作，省粒子</text><rect fill="#4ea1ff" height="20" opacity="0.2" rx="4" ry="6" stroke="none" stroke-width="1.5" width="40" x="770" y="209" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="790" y="222">可选</text><rect fill="#2b2b2b" height="50" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1" width="840" x="30" y="256" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="55" y="274">Culling Mode</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="220" y="274">剔除模式</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="500" y="274">离远自动暂停，必开</text><rect fill="#6bcf7f" height="20" opacity="0.2" rx="4" ry="6" stroke="none" stroke-width="1.5" width="40" x="770" y="271" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="790" y="284">推荐</text><rect fill="#2b2b2b" height="50" rx="6" ry="6" stroke="#ffcc66" stroke-width="1" width="840" x="30" y="318" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="55" y="336">Prewarm</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="220" y="336">预热</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="500" y="336">仅在需要开场特效时开</text><rect fill="#ffcc66" height="20" opacity="0.2" rx="4" ry="6" stroke="none" stroke-width="1.5" width="40" x="770" y="333" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="790" y="346">可选</text><rect fill="#1a2a1a" height="30" opacity="0.5" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1" width="840" x="30" y="380" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="399">在 Game 视图的 Stats 面板中可以查看粒子数 — 保持它在合理范围内</text></svg>