<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">Color over Lifetime &amp; Size over Lifetime</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="58">让粒子在生命周期中动态变化</text><rect fill="#2b2b2b" height="170" rx="8" ry="6" stroke="#f472b6" stroke-width="1.5" width="400" x="30" y="85" /><text fill="#f472b6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="50" y="115">Color over Lifetime</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="50" y="138">粒子颜色随时间渐变</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="50" y="160">使用 Gradient 编辑器：</text><rect fill="#ffffff" height="24" rx="0" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="85" x="60" y="178" /><rect fill="#ffcc00" height="24" rx="0" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="85" x="145" y="178" /><rect fill="#ff6600" height="24" rx="0" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="85" x="230" y="178" /><rect fill="#330000" height="24" rx="0" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="85" x="315" y="178" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="60" y="216">0%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="145" y="216">25%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="230" y="216">50%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="315" y="216">100%</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="230" y="240">白→黄→橙→暗红（火焰渐变）</text><rect fill="#2b2b2b" height="170" rx="8" ry="6" stroke="#60a5fa" stroke-width="1.5" width="410" x="460" y="85" /><text fill="#60a5fa" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="480" y="115">Size over Lifetime</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="480" y="138">粒子大小随时间变化</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="480" y="160">使用 Curve 曲线编辑器：</text><rect fill="#1a1a1a" height="60" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="370" x="480" y="178" /><line stroke="#6e6e6e" stroke-width="0.5" x1="490" x2="490" y1="230" y2="188" /><line stroke="#6e6e6e" stroke-width="0.5" x1="490" x2="840" y1="230" y2="230" /><line stroke="#60a5fa" stroke-width="2" x1="490" x2="560" y1="225" y2="200" /><line stroke="#60a5fa" stroke-width="2" x1="560" x2="680" y1="200" y2="195" /><line stroke="#60a5fa" stroke-width="2" x1="680" x2="840" y1="195" y2="230" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="830" y="250">time</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="500" y="182">size</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="665" y="252">从小到大再缩小（爆发效果）</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="50" y="290">经典组合公式</text><rect fill="#1a1a1a" height="145" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="840" x="30" y="310" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="50" y="335">火焰</text><text fill="#f472b6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="50" y="358">Color: 白→黄→红→透明</text><text fill="#60a5fa" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="50" y="376">Size: 大到小</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="50" y="394">Cone + 大量粒子</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="255" y="335">魔法光球</text><text fill="#f472b6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="255" y="358">Color: 亮蓝→紫→淡出</text><text fill="#60a5fa" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="255" y="376">Size: 小到大</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="255" y="394">Sphere + Burst</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="460" y="335">烟雾</text><text fill="#f472b6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="460" y="358">Color: 灰→淡灰→透明</text><text fill="#60a5fa" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="460" y="376">Size: 小到大</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="460" y="394">Sphere + 低速</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="665" y="335">星光闪烁</text><text fill="#f472b6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="665" y="358">Color: 白→黄→透明</text><text fill="#60a5fa" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="665" y="376">Size: 随机大小</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="665" y="394">Sphere + 小量</text></svg>