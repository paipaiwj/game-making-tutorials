<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 900 520" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="520" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">Emission（发射）与 Shape（形状）</text><rect fill="#2b2b2b" height="200" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="400" x="30" y="65" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="start" x="50" y="95">Emission 模块</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="50" y="118">控制「每秒产生多少粒子」</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="60" y="140">Rate over Time</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="60" y="158">每秒发射 N 个粒子（持续流）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="end" x="380" y="158">默认 10</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="60" y="180">Rate over Distance</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="60" y="198">每移动 N 单位发射粒子（拖尾用）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="end" x="380" y="198">默认 0</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="60" y="220">Bursts</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="60" y="238">在特定时间点爆发 N 个粒子（爆炸用）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="end" x="380" y="238">点击 + 添加</text><rect fill="#2b2b2b" height="200" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="410" x="460" y="65" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="start" x="480" y="95">Shape 模块</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="480" y="118">控制「粒子从什么形状的区域发射出来」</text><ellipse cx="490" cy="144" fill="#ff9e4e" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="505" y="150">Sphere</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="590" y="150">球形发射 — 最常用</text><ellipse cx="490" cy="174" fill="#ff9e4e" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="505" y="180">Cone</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="590" y="180">锥形发射 — 喷火/魔法</text><ellipse cx="490" cy="204" fill="#ff9e4e" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="505" y="210">Box</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="590" y="210">盒形发射 — 方形区域</text><ellipse cx="490" cy="234" fill="#ff9e4e" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="505" y="240">Circle</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="590" y="240">圆形发射 — 地面光环</text><ellipse cx="490" cy="264" fill="#ff9e4e" opacity="1.0" rx="4" ry="4" stroke="none" stroke-width="1.0" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="505" y="270">Mesh</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="590" y="270">从模型表面发射</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="50" y="295">组合示例</text><rect fill="#1a1a1a" height="185" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="840" x="30" y="315" /><rect fill="#2b2b2b" height="145" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1" width="180" x="50" y="335" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="140" y="360">火焰</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="140" y="385">Cone + Rate 50</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="140" y="410">锥形向上喷大量粒子</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="middle" x="140" y="440">Shape + Emission</text><rect fill="#2b2b2b" height="145" rx="6" ry="6" stroke="#ff9e4e" stroke-width="1" width="180" x="250" y="335" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="340" y="360">爆炸</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="340" y="385">Sphere + Burst 100</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="340" y="410">球形一次性爆发</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="middle" x="340" y="440">Shape + Emission</text><rect fill="#2b2b2b" height="145" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1" width="180" x="450" y="335" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="540" y="360">雨</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="540" y="385">Box(宽扁) + Rate 200</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="540" y="410">大范围持续下落</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="middle" x="540" y="440">Shape + Emission</text><rect fill="#2b2b2b" height="145" rx="6" ry="6" stroke="#c084fc" stroke-width="1" width="180" x="650" y="335" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="740" y="360">拖尾</text><text fill="#c084fc" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="740" y="385">Circle + Rate/Distance</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="740" y="410">随移动发射粒子</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="middle" x="740" y="440">Shape + Emission</text></svg>