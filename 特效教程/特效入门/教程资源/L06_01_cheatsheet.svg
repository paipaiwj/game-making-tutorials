<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600px" version="1.1" viewBox="0 0 920 600" width="920px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="600" width="920" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="460" y="32">Unity 粒子特效速查表</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="30" y="65">核心模块速查</text><rect fill="#2b2b2b" height="28" rx="0" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="160" x="30" y="75" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="38" y="94">模块</text><rect fill="#2b2b2b" height="28" rx="0" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="220" x="200" y="75" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="208" y="94">关键参数</text><rect fill="#2b2b2b" height="28" rx="0" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="120" x="430" y="75" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="438" y="94">常用值</text><rect fill="#2b2b2b" height="28" rx="0" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="320" x="560" y="75" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="568" y="94">说明</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="160" x="30" y="107" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="38" y="125">Main</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="220" x="200" y="107" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="208" y="125">Duration / Looping / Start Lifetime</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="120" x="430" y="107" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="438" y="125">5 / 勾上 / 2</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="320" x="560" y="107" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="568" y="125">粒子系统持续时间和每个粒子存活时间</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="160" x="30" y="137" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="38" y="155">Emission</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="220" x="200" y="137" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="208" y="155">Rate over Time / Bursts</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="120" x="430" y="137" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="438" y="155">20 / 按需</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="320" x="560" y="137" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="568" y="155">每秒粒子数；爆发用于爆炸等一次性效果</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="160" x="30" y="167" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="38" y="185">Shape</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="220" x="200" y="167" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="208" y="185">Shape / Radius / Angle</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="120" x="430" y="167" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="438" y="185">Cone / 1 / 15°</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="320" x="560" y="167" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="568" y="185">粒子发射的形状和范围</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="160" x="30" y="197" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="38" y="215">Color over Lifetime</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="220" x="200" y="197" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="208" y="215">Color (Gradient)</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="120" x="430" y="197" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="438" y="215">白→橙→红→透明</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="320" x="560" y="197" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="568" y="215">粒子颜色随时间渐变</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="160" x="30" y="227" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="38" y="245">Size over Lifetime</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="220" x="200" y="227" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="208" y="245">Size (Curve)</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="120" x="430" y="227" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="438" y="245">从大到小</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="320" x="560" y="227" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="568" y="245">粒子大小随时间变化曲线</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="160" x="30" y="257" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="38" y="275">Velocity over Lifetime</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="220" x="200" y="257" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="208" y="275">Linear X/Y/Z</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="120" x="430" y="257" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="438" y="275">Y: 2 (上升)</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="320" x="560" y="257" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="568" y="275">粒子飞行中的速度变化</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="160" x="30" y="287" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="38" y="305">Renderer</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="220" x="200" y="287" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="208" y="305">Render Mode / Material</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="120" x="430" y="287" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="438" y="305">Billboard / Default-Particle</text><rect fill="#1a1a1a" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="320" x="560" y="287" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="568" y="305">粒子如何渲染，材质决定外观</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="160" x="30" y="317" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="38" y="335">Noise</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="220" x="200" y="317" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="208" y="335">Strength / Frequency</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="120" x="430" y="317" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="438" y="335">1 / 0.5</text><rect fill="#2b2b2b" height="26" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="320" x="560" y="317" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="568" y="335">给粒子运动添加随机扰动（风、飘动）</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="30" y="360">常见问题</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="45" y="393">粒子不显示？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="220" y="393">检查 Duration &gt; 0, Looping 是否勾上，Play 是否按下</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="45" y="425">粒子是粉色的？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="220" y="425">材质丢失 — 给 Renderer 模块指定一个材质</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="45" y="457">粒子不动？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="220" y="457">Start Speed = 0，需要设置大于 0 的值</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="45" y="489">粒子太小看不到？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="220" y="489">Start Size 默认是 1，调大到 3-5 试试</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="45" y="521">VRChat 中粒子不跟随？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="220" y="521">粒子系统必须放在有 Transform 的 GameObject 上</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="45" y="553">性能太差？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="220" y="553">降低 Max Particles 和 Rate，减小贴图尺寸</text></svg>