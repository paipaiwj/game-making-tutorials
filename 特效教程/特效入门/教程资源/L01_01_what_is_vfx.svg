<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 900 500" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="500" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="36">游戏特效是什么？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="66">VFX（Visual Effects）是游戏中增强视觉表现力的动态元素</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="180" x="60" y="110" /><ellipse cx="150" cy="146" fill="#4ea1ff" opacity="0.6" rx="20" ry="20" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="150" y="184">粒子特效</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="150" y="210">火焰、烟雾、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="150" y="228">爆炸、魔法</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="180" x="260" y="110" /><ellipse cx="350" cy="146" fill="#6bcf7f" opacity="0.6" rx="20" ry="20" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="350" y="184">轨迹特效</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="350" y="210">刀光、拖尾、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="350" y="228">光束、弹道</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="180" x="460" y="110" /><ellipse cx="550" cy="146" fill="#ff9e4e" opacity="0.6" rx="20" ry="20" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="550" y="184">环境特效</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="550" y="210">雨雪、落叶、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="550" y="228">灰尘、光晕</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="180" x="660" y="110" /><ellipse cx="750" cy="146" fill="#c084fc" opacity="0.6" rx="20" ry="20" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="750" y="184">UI特效</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="750" y="210">按钮光效、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="750" y="228">转场动画</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="460">Unity 中最核心的特效工具：Shuriken Particle System（粒子系统）</text></svg>