<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="380px" version="1.1" viewBox="0 0 900 380" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="380" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">常用粒子贴图类型</text><rect fill="#2b2b2b" height="240" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="160" x="20" y="70" /><ellipse cx="100" cy="110" fill="#4ea1ff" opacity="0.3" rx="35" ry="35" stroke="none" stroke-width="1.0" /><ellipse cx="100" cy="110" fill="#4ea1ff" opacity="0.6" rx="20" ry="20" stroke="none" stroke-width="1.0" /><ellipse cx="100" cy="110" fill="#fff" opacity="1.0" rx="8" ry="8" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="100" y="155">圆形光点</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="100" y="180">最通用 — 魔法球、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="100" y="200">光点、火花</text><rect fill="#2b2b2b" height="240" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="160" x="195" y="70" /><ellipse cx="275" cy="110" fill="#6bcf7f" opacity="0.24" rx="35" ry="35" stroke="none" stroke-width="1.0" /><ellipse cx="275" cy="110" fill="#6bcf7f" opacity="0.48" rx="20" ry="20" stroke="none" stroke-width="1.0" /><ellipse cx="275" cy="110" fill="#fff" opacity="0.8" rx="8" ry="8" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="275" y="155">环形</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="275" y="180">冲击波、光环、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="275" y="200">护盾</text><rect fill="#2b2b2b" height="240" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="160" x="370" y="70" /><ellipse cx="450" cy="110" fill="#ff9e4e" opacity="0.27" rx="35" ry="35" stroke="none" stroke-width="1.0" /><ellipse cx="450" cy="110" fill="#ff9e4e" opacity="0.54" rx="20" ry="20" stroke="none" stroke-width="1.0" /><ellipse cx="450" cy="110" fill="#fff" opacity="0.9" rx="8" ry="8" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="450" y="155">放射线</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="180">光束、激光、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="200">能量射线</text><rect fill="#2b2b2b" height="240" rx="8" ry="6" stroke="#9aa0a6" stroke-width="1.5" width="160" x="545" y="70" /><ellipse cx="625" cy="110" fill="#9aa0a6" opacity="0.18" rx="35" ry="35" stroke="none" stroke-width="1.0" /><ellipse cx="625" cy="110" fill="#9aa0a6" opacity="0.36" rx="20" ry="20" stroke="none" stroke-width="1.0" /><ellipse cx="625" cy="110" fill="#fff" opacity="0.6" rx="8" ry="8" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="625" y="155">烟雾/云</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="625" y="180">烟雾、尘土、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="625" y="200">蒸汽</text><rect fill="#2b2b2b" height="240" rx="8" ry="6" stroke="#f472b6" stroke-width="1.5" width="160" x="720" y="70" /><ellipse cx="800" cy="110" fill="#f472b6" opacity="0.27" rx="35" ry="35" stroke="none" stroke-width="1.0" /><ellipse cx="800" cy="110" fill="#f472b6" opacity="0.54" rx="20" ry="20" stroke="none" stroke-width="1.0" /><ellipse cx="800" cy="110" fill="#fff" opacity="0.9" rx="8" ry="8" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="800" y="155">星形</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="800" y="180">闪光、星星、</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="800" y="200">魔法光点</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="350">贴图可在 Unity Asset Store 或粒子特效包中找到，也可以用 Photoshop/GIMP 自制</text></svg>