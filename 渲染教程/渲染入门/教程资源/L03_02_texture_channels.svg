<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">一张贴图 = 一个通道，各管一件事</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="98" y="88">Base Map 颜色贴图</text><rect fill="#1a1a1a" height="90" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="130" x="33" y="100" /><rect fill="#3a6ea5" height="82" rx="4" width="122" x="37" y="104" /><ellipse cx="61" cy="128" fill="#a5d3ff" opacity="0.8" rx="9" ry="9" stroke="none" stroke-width="1.0" /><ellipse cx="103" cy="128" fill="#a5d3ff" opacity="0.8" rx="9" ry="9" stroke="none" stroke-width="1.0" /><ellipse cx="61" cy="160" fill="#a5d3ff" opacity="0.8" rx="9" ry="9" stroke="none" stroke-width="1.0" /><ellipse cx="103" cy="160" fill="#a5d3ff" opacity="0.8" rx="9" ry="9" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="98" y="206">彩色图</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="98" y="220">物体固有色与细节</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="274" y="88">Normal Map 法线贴图</text><rect fill="#1a1a1a" height="90" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="130" x="209" y="100" /><line stroke="#b07cff" stroke-width="3" x1="235" x2="251" y1="130" y2="130" /><line stroke="#b07cff" stroke-width="3" x1="263" x2="279" y1="148" y2="148" /><line stroke="#b07cff" stroke-width="3" x1="291" x2="307" y1="130" y2="130" /><line stroke="#6b5a8a" stroke-width="2" x1="229" x2="319" y1="164" y2="164" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="274" y="206">紫色凹凸图</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="274" y="220">模拟凹凸，省模型面数</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="450" y="88">Metallic Map 金属度</text><rect fill="#1a1a1a" height="90" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="130" x="385" y="100" /><rect fill="#d8d8d8" height="41" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="122" x="389" y="104" /><rect fill="#2a2a2a" height="41" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="122" x="389" y="145" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="206">黑白：白=金属</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="220">哪部分是金属</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="626" y="88">Smoothness 光滑度</text><rect fill="#1a1a1a" height="90" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="130" x="561" y="100" /><rect fill="#ffffff" height="41" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="122" x="565" y="104" /><rect fill="#555555" height="41" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="122" x="565" y="145" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="626" y="206">黑白：白=光滑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="626" y="220">哪部分光滑/粗糙</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="802" y="88">Emission 自发光</text><rect fill="#1a1a1a" height="90" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="130" x="737" y="100" /><rect fill="#101010" height="82" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="122" x="741" y="104" /><ellipse cx="767" cy="130" fill="#ffcf5e" opacity="0.9" rx="12" ry="12" stroke="none" stroke-width="1.0" /><ellipse cx="803" cy="148" fill="#ffcf5e" opacity="0.9" rx="12" ry="12" stroke="none" stroke-width="1.0" /><ellipse cx="837" cy="132" fill="#ffcf5e" opacity="0.9" rx="12" ry="12" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="802" y="206">亮部=发光</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="802" y="220">自己发光的部分</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="280" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="90" y="310">Unity 材质面板与贴图的关系</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="344">① 把图片拖进 Project 窗口导入 → 它就是一张 Texture</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="374">② 在材质 Inspector 里，把 Texture 拖到对应插槽（Base Map / Normal Map…）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="404">③ 贴图没做特殊压缩时：图越大越占显存，VRChat 上限 4096×4096</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="434">④ 不写 Shader 也能调好看：先学会这 4 个滑块（颜色/金属度/光滑度/自发光）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-style="italic" font-weight="normal" text-anchor="start" x="90" y="468">提示：Smoothness 和 Metallic 常共用一张「Mask 图」，不同通道存不同信息</text></svg>