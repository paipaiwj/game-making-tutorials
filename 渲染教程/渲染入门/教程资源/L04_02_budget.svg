<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 900 520" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="520" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">渲染性能预算：四个数字盯住就行</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="60" y="110">Draw Calls（渲染批次）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="60" y="132">每帧 CPU 提交的渲染命令数
越少越好：共享材质 / 合批</text><rect fill="#1a1a1a" height="26" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="380" y="98" /><rect fill="#4ea1ff" height="26" opacity="0.85" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="142" x="380" y="98" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="475" y="136">25%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="570" y="136">50%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="665" y="136">75%</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="start" x="776" y="116">建议：≤100</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="60" y="215">材质数量</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="60" y="237">每个材质 = 一份状态切换
相同材质多个物体可合批</text><rect fill="#1a1a1a" height="26" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="380" y="203" /><rect fill="#6bcf7f" height="26" opacity="0.85" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="380" y="203" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="475" y="241">25%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="570" y="241">50%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="665" y="241">75%</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="start" x="776" y="221">建议：≤50</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="60" y="320">贴图内存</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="60" y="342">4096×4096 ≈ 64MB 显存
一般物体 1024/2048 足够</text><rect fill="#1a1a1a" height="26" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="380" y="308" /><rect fill="#ff9e4e" height="26" opacity="0.85" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="380" y="308" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="475" y="346">25%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="570" y="346">50%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="665" y="346">75%</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="start" x="776" y="326">建议：总内存小</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="60" y="425">实时光源</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="60" y="447">每个点/聚光灯都要每帧计算
烘焙光照 + 1 个太阳光最省</text><rect fill="#1a1a1a" height="26" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="380" y="413" /><rect fill="#c084fc" height="26" opacity="0.85" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="152" x="380" y="413" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="475" y="451">25%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="570" y="451">50%</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="665" y="451">75%</text><text fill="#c084fc" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="start" x="776" y="431">建议：1~2 个</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="60" y="498">工具：Window → Rendering → Rendering Debugger（查看 Draw Calls）</text></svg>