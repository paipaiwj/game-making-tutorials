<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#c084fc" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#3a3a3a" /></marker></defs><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">一帧画面是怎么画出来的</text><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="160" x="60" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="140" y="118">CPU · 场景逻辑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="140" y="148">Unity 更新逻辑、动画</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="140" y="166">收集可见物体、准备渲染数据</text><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="160" x="300" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="380" y="118">CPU · 提交命令</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="380" y="148">一次「提交」= 1 个</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="380" y="166">Draw Call（渲染调用）</text><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="160" x="540" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="620" y="118">GPU · 执行渲染</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="148">按流水线画出这一帧</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="166">（上一图的那 4 步）</text><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="160" x="760" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="840" y="118">屏幕 · 显示画面</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="840" y="148">画面送到显示器</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="840" y="166">然后开始画下一帧</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="220" x2="244" y1="165" y2="165" /><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="460" x2="484" y1="165" y2="165" /><line marker-end="url(#arrowhead)" stroke="#c084fc" stroke-width="2" x1="700" x2="724" y1="165" y2="165" /><line marker-end="url(#arrowhead)" opacity="0.6" stroke="#3a3a3a" stroke-width="2" x1="840" x2="60" y1="252" y2="252" /><rect fill="#222222" height="26" rx="13" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="164" x="328" y="239" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="410" y="257">下一帧循环</text><rect fill="#1a1a1a" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="290" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="100" y="318">帧率 = 每秒画的帧数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="100" y="344">60 FPS = 每帧 16.6 毫秒内画完  |  90 FPS ≈ 11 毫秒  |  120 FPS ≈ 8.3 毫秒</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="100" y="368">Draw Call 越少、渲染越轻 → 帧时间越短 → 帧率越高（VRChat 目标：90 FPS）</text></svg>