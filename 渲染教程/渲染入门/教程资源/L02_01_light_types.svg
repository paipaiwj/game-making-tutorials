t-anchor="middle" x="129" y="108">平行光 Directional</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="129" y="136">太阳：无限远、平行光线</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="129" y="154">全场景同一方向，几乎无成本</text><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="190" x="248" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="343" y="108">点光源 Point</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="343" y="136">灯泡：从一点向四周发散</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="343" y="154">有半径，数量多会卡</text><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="190" x="462" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="557" y="108">聚光灯 Spot</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="557" y="136">手电筒：锥形光束</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="557" y="154">适合做区域强调光</text><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="190" x="676" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="771" y="108"