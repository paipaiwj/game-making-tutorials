<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 900 520" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="520" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">烘焙光照 vs 实时光照</text><rect fill="#2b2b2b" height="330" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="370" x="60" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="245" y="110">实时光照 Realtime</text><ellipse cx="90" cy="148" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="105" y="152">运行时即时计算</text><ellipse cx="90" cy="190" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="105" y="194">灯光可移动、物体可动</text><ellipse cx="90" cy="232" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="105" y="236">VRChat 中多人可见动态效果</text><ellipse cx="90" cy="274" fill="#ffcc66" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="105" y="278">光源数量少（1~2 个点光即可）</text><ellipse cx="90" cy="316" fill="#ffcc66" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="105" y="320">每个实时光源都增加 GPU 开销</text><rect fill="#2b2b2b" height="330" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="370" x="470" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="655" y="110">烘焙光照 Baked</text><ellipse cx="500" cy="148" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="515" y="152">光照信息预先算好，存进光照贴图</text><ellipse cx="500" cy="190" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="515" y="194">运行时零计算，世界更流畅</text><ellipse cx="500" cy="232" fill="#ffcc66" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="515" y="236">只有静态物体能用</text><ellipse cx="500" cy="274" fill="#ffcc66" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="515" y="278">动态物体（捡起物）不在烘焙里</text><ellipse cx="500" cy="316" fill="#ffcc66" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="515" y="320">改灯光要重新烘焙，时间按分钟算</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="450" y="450">光照贴图示意（Lightmap：记录光影明暗的贴图）</text><rect fill="rgb(50,67,142)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="340" y="465" /><rect fill="rgb(122,163,255)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="340" y="487" /><rect fill="rgb(60,80,171)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="366" y="465" /><rect fill="rgb(132,176,255)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="366" y="487" /><rect fill="rgb(70,94,201)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="392" y="465" /><rect fill="rgb(142,190,255)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="392" y="487" /><rect fill="rgb(81,108,230)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="418" y="465" /><rect fill="rgb(50,67,142)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="418" y="487" /><rect fill="rgb(91,122,255)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="444" y="465" /><rect fill="rgb(60,80,171)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="444" y="487" /><rect fill="rgb(101,135,255)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="470" y="465" /><rect fill="rgb(70,94,201)" height="21" stroke="#3a3a3a" stroke-width="0.5" width="25" x="470" y="487" /></svg>