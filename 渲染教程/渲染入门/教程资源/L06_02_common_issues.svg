<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 900 540" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="540" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">常见问题对照表</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="60" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="150" y="92">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="255" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="345" y="92">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="570" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="660" y="92">解决办法</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="104" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="150" y="142">粉色/紫黑物体</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="255" y="104" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="132">Shader 不兼容 URP 或缺失</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="150">（VRChat 里最常见）</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="570" y="104" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="132">换用 URP Shader</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="150">重设材质 Shader</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="186" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="150" y="224">物体全黑</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="255" y="186" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="214">没有光照 / 法线反了</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="232">光线被遮住</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="570" y="186" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="214">加 Directional Light</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="232">检查模型法线</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="268" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="150" y="306">画面过曝发白</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="255" y="268" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="296">灯光太强 / Emission 太高</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="314">HDR 溢出</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="570" y="268" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="296">调低灯光 Intensity</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="314">Emission 降到 1~3</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="350" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="150" y="388">边缘锯齿/闪烁</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="255" y="350" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="378">贴图太小 / 抗锯齿关闭</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="396">两层面重叠 Z-fighting</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="570" y="350" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="378">贴图 1024+ / 开抗锯齿</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="396">分开面或拉开距离</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="432" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="150" y="470">渲染慢 / 掉帧</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="255" y="432" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="460">Draw Call 多 / 贴图太大</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="405" y="478">实时光源太多</text><rect fill="#2b2b2b" height="72" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="570" y="432" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="460">共享材质 / 压贴图</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="478">烘焙光照</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="520">遇到问题先猜「渲染」而不是「代码」：粉色 = Shader，全黑 = 光照，锯齿 = 贴图/抗锯齿</text></svg>