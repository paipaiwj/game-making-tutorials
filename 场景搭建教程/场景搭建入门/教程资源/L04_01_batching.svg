<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6e6e6e" /></marker></defs><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">合批 Batching：把多次绘制合并成一次</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">Draw Call = CPU 通知 GPU 画一次的命令 —— 命令越少越流畅</text><text fill="#ff8888" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="245" y="105">三个不同材质</text><polygon fill="#7a4a4a" points="110,135 126,123 196,123 180,135" stroke="#a06a6a" stroke-width="1.2" /><rect fill="#8a5a5a" height="50" rx="6" ry="6" stroke="#a06a6a" stroke-width="1.5" width="70" x="110" y="135" /><polygon fill="#6a4242" points="180,135 196,123 196,173 180,185" stroke="#a06a6a" stroke-width="1.2" /><polygon fill="#4a6a7a" points="215,135 231,123 301,123 285,135" stroke="#6a8a9a" stroke-width="1.2" /><rect fill="#5a7a8a" height="50" rx="6" ry="6" stroke="#6a8a9a" stroke-width="1.5" width="70" x="215" y="135" /><polygon fill="#42586a" points="285,135 301,123 301,173 285,185" stroke="#6a8a9a" stroke-width="1.2" /><polygon fill="#6a6a4a" points="320,135 336,123 406,123 390,135" stroke="#8a8a6a" stroke-width="1.2" /><rect fill="#7a7a5a" height="50" rx="6" ry="6" stroke="#8a8a6a" stroke-width="1.5" width="70" x="320" y="135" /><polygon fill="#5a5a42" points="390,135 406,123 406,173 390,185" stroke="#8a8a6a" stroke-width="1.2" /><rect fill="#1a1a1a" height="46" rx="8" ry="6" stroke="#ff8888" stroke-width="1.5" width="370" x="60" y="210" /><text fill="#ff8888" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="245" y="238">GPU 收到 3 次绘制指令</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="655" y="105">三个共享同一材质</text><polygon fill="#4a6a7a" points="520,135 536,123 606,123 590,135" stroke="#6a8a9a" stroke-width="1.2" /><rect fill="#5a7a8a" height="50" rx="6" ry="6" stroke="#6a8a9a" stroke-width="1.5" width="70" x="520" y="135" /><polygon fill="#42586a" points="590,135 606,123 606,173 590,185" stroke="#6a8a9a" stroke-width="1.2" /><polygon fill="#4a6a7a" points="625,135 641,123 711,123 695,135" stroke="#6a8a9a" stroke-width="1.2" /><rect fill="#5a7a8a" height="50" rx="6" ry="6" stroke="#6a8a9a" stroke-width="1.5" width="70" x="625" y="135" /><polygon fill="#42586a" points="695,135 711,123 711,173 695,185" stroke="#6a8a9a" stroke-width="1.2" /><polygon fill="#4a6a7a" points="730,135 746,123 816,123 800,135" stroke="#6a8a9a" stroke-width="1.2" /><rect fill="#5a7a8a" height="50" rx="6" ry="6" stroke="#6a8a9a" stroke-width="1.5" width="70" x="730" y="135" /><polygon fill="#42586a" points="800,135 816,123 816,173 800,185" stroke="#6a8a9a" stroke-width="1.2" /><rect fill="#1a1a1a" height="46" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="370" x="470" y="210" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="655" y="238">GPU 收到 1 次绘制指令</text><line marker-end="url(#arrowhead)" stroke="#6e6e6e" stroke-width="2.5" x1="440" x2="462" y1="175" y2="175" /><rect fill="#1a1a1a" height="86" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="285" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="85" y="311">合批的前提：材质完全相同</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="335">同一材质 = 同一个着色器 + 同一张贴图 + 同一组参数，连颜色都不能差</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="355">VRChat 里：减少材质种类、共用贴图图集，是省 Draw Call 最有效的手段</text></svg>