<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 900 540" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="540" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">Trigger 触发区：看不见的「感应门」</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">不阻挡移动，玩家一进入就发出事件 —— 配合 Udon 实现开关门、触发玩法</text><rect fill="#2c2c2c" height="10" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="740" x="80" y="330" /><rect fill="#4ea1ff" height="150" opacity="0.1" rx="12" ry="6" stroke="#4ea1ff" stroke-dasharray="[8, 5]" stroke-width="2" width="260" x="420" y="170" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="550" y="235">Trigger 区域</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="550" y="262">（勾选 Is Trigger）</text><ellipse cx="250" cy="250" fill="#4ea1ff" opacity="0.9" rx="24" ry="24" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="250" y="310">玩家</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="282" x2="410" y1="250" y2="250" /><rect fill="#2b2b2b" height="110" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="178" x="61" y="360" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="150" y="386">1. 进入区域</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="150" y="410">玩家走进</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="150" y="429">Trigger 范围</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="241" x2="259" y1="415" y2="415" /><rect fill="#2b2b2b" height="110" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="178" x="261" y="360" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="350" y="386">2. 收到事件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="350" y="410">OnTriggerEnter</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="350" y="429">被调用</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="441" x2="459" y1="415" y2="415" /><rect fill="#2b2b2b" height="110" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="178" x="461" y="360" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="550" y="386">3. 发送信号</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="550" y="410">SignalSender</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="550" y="429">路由给组件</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="641" x2="659" y1="415" y2="415" /><rect fill="#2b2b2b" height="110" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="178" x="661" y="360" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="750" y="386">4. 执行逻辑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="750" y="410">开门 / 播歌</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="750" y="429">开始玩法</text><rect fill="#1a1a1a" height="86" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="500" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="85" y="526">要点</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="550">Trigger 不需要 Collider 参与物理阻挡 —— 玩家是穿过去的，但事件照常触发</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="570">UdonSharp 里写 OnTriggerEnter() 接收事件，再走你项目的 Trigger → SignalSender → Component 架构</text></svg>