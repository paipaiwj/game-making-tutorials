<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">Collider 碰撞体类型</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">碰撞体决定物体的物理边界 —— 不是所有东西都需要精细碰撞</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="90" y="90" /><polygon fill="#3a3a3a" points="142,140 158,128 234,128 218,140" stroke="#4a4a4a" stroke-width="1.2" /><rect fill="#2f2f2f" height="55" rx="6" ry="6" stroke="#4a4a4a" stroke-width="1.5" width="76" x="142" y="140" /><polygon fill="#282828" points="218,140 234,128 234,183 218,195" stroke="#4a4a4a" stroke-width="1.2" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="180" y="238">Box 盒体</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="180" y="262">箱子、地板、墙面</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="180" y="281">一个矩形就够了</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="280" y="90" /><ellipse cx="370" cy="165" fill="#2f2f2f" opacity="1.0" rx="42" ry="38" stroke="#4ea1ff" stroke-width="1.5" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="370" y="238">Sphere 球体</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="370" y="262">球类、果实、小件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="370" y="281">圆形的用圆</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="470" y="90" /><rect fill="#2f2f2f" height="74" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="36" x="542" y="128" /><ellipse cx="560" cy="128" fill="#2f2f2f" opacity="1.0" rx="18" ry="18" stroke="#4ea1ff" stroke-width="1.5" /><ellipse cx="560" cy="202" fill="#2f2f2f" opacity="1.0" rx="18" ry="18" stroke="#4ea1ff" stroke-width="1.5" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="560" y="238">Capsule 胶囊</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="560" y="262">柱子、树干、人形</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="560" y="281">两端圆的柱体</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="660" y="90" /><polygon fill="#2f2f2f" points="715,190 740,130 780,140 795,175 770,205 730,200" stroke="#4ea1ff" stroke-width="1.5" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="750" y="238">Mesh 网格</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="750" y="262">复杂地形、雕塑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="750" y="281">最精确也最贵</text><rect fill="#1a1a1a" height="86" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="320" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="85" y="346">实践建议</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="370">地面 / 墙用 Box 就够，别用 Mesh Collider 精细碰每一块石头</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="390">Collider 在游戏里看不见 —— Scene 视图选中物体看绿色线框检查；Mesh Collider 记得勾 Convex</text></svg>