<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 900 500" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="500" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">露营场景完成示意（俯视）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">入口 → 篝火聚集点 → 营地各处 —— 动线 + 聚集点 + 氛围灯光的综合成品</text><rect fill="#2a2a2a" height="290" rx="14" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="740" x="80" y="90" /><ellipse cx="300" cy="372" fill="#4ea1ff" opacity="0.7" rx="12" ry="12" stroke="none" stroke-width="1.0" /><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-dasharray="[8, 6]" stroke-width="2.5" x1="312" x2="423" y1="368" y2="304" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="300" y="396">入口</text><ellipse cx="450" cy="240" fill="#ff9e4e" opacity="0.1" rx="62" ry="62" stroke="none" stroke-width="1.0" /><ellipse cx="450" cy="240" fill="#3a2f22" opacity="1.0" rx="34" ry="34" stroke="#5a4a30" stroke-width="1.5" /><ellipse cx="450" cy="240" fill="#ff9e4e" opacity="0.9" rx="16" ry="16" stroke="none" stroke-width="1.0" /><ellipse cx="444" cy="236" fill="#ffcc66" opacity="1.0" rx="6" ry="6" stroke="none" stroke-width="1.0" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="522" y="250">篝火 = 聚集点</text><polygon fill="#4a5a8a" points="140,205 195,165 250,205" stroke="#5a6a9a" stroke-width="1.5" /><rect fill="#3a4a7a" height="55" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="80" x="155" y="205" /><rect fill="#26304e" height="30" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="20" x="185" y="230" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="195" y="280">帐篷（休息/换装）</text><ellipse cx="110" cy="140" fill="#6bcf7f" opacity="0.85" rx="26" ry="26" stroke="none" stroke-width="1.0" /><rect fill="#4a3a28" height="16" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="10" x="105" y="156" /><ellipse cx="720" cy="130" fill="#6bcf7f" opacity="0.75" rx="30" ry="30" stroke="none" stroke-width="1.0" /><rect fill="#4a3a28" height="18" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="10" x="715" y="148" /><ellipse cx="690" cy="330" fill="#6bcf7f" opacity="0.8" rx="24" ry="24" stroke="none" stroke-width="1.0" /><rect fill="#4a3a28" height="14" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="8" x="686" y="344" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="200">树 = 围合视野</text><rect fill="#6a5a40" height="34" rx="6" ry="6" stroke="#7a6a4a" stroke-width="1.5" width="90" x="580" y="275" /><text fill="#ddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="625" y="295">桌椅</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="560" y="350">桌椅 = 交谈点</text><ellipse cx="330" cy="150" fill="#ff9e4e" opacity="0.12" rx="26" ry="26" stroke="none" stroke-width="1.0" /><ellipse cx="330" cy="150" fill="#ff9e4e" opacity="1.0" rx="8" ry="8" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="330" y="180">火把</text><ellipse cx="560" cy="140" fill="#ff9e4e" opacity="0.12" rx="26" ry="26" stroke="none" stroke-width="1.0" /><ellipse cx="560" cy="140" fill="#ff9e4e" opacity="1.0" rx="8" ry="8" stroke="none" stroke-width="1.0" /><rect fill="#1a1a1a" height="70" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="408" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="439">设计要点：入口路径直指篝火（玩家一进门就被引导到聚集点）；树围出边界不让视线一眼看穿；火把连线形成光的引导</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="463">地面统一共享材质、光源全烘焙 —— 性能合格的前提下，氛围照样到位</text></svg>