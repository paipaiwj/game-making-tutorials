<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#9aa0a6" /></marker></defs><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">打光三件套：主光 + 补光 + 环境光</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">三层光各管一件事 —— 九成场景靠这三样就能亮起来</text><rect fill="#2c2c2c" height="12" rx="5" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="740" x="80" y="350" /><polygon fill="#3a4a6a" points="370,250 450,320 530,250" stroke="#4a5a8a" stroke-width="1.5" /><rect fill="#2c3a58" height="44" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="64" x="418" y="292" /><rect fill="#4a3a28" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="12" x="200" y="280" /><ellipse cx="206" cy="260" fill="#2f4a35" opacity="1.0" rx="30" ry="32" stroke="#3a5a42" stroke-width="1.5" /><rect fill="#4a3a28" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="12" x="640" y="280" /><ellipse cx="646" cy="260" fill="#2f4a35" opacity="1.0" rx="30" ry="32" stroke="#3a5a42" stroke-width="1.5" /><ellipse cx="680" cy="130" fill="#ff9e4e" opacity="0.9" rx="30" ry="30" stroke="none" stroke-width="1.0" /><line stroke="#ff9e4e" stroke-width="2" x1="720.0" x2="736.0" y1="130.0" y2="130.0" /><line stroke="#ff9e4e" stroke-width="2" x1="708.2842712474619" x2="719.5979797464466" y1="158.2842712474619" y2="169.59797974644667" /><line stroke="#ff9e4e" stroke-width="2" x1="680.0" x2="680.0" y1="170.0" y2="186.0" /><line stroke="#ff9e4e" stroke-width="2" x1="651.7157287525381" x2="640.4020202535534" y1="158.2842712474619" y2="169.59797974644667" /><line stroke="#ff9e4e" stroke-width="2" x1="640.0" x2="624.0" y1="130.0" y2="130.0" /><line stroke="#ff9e4e" stroke-width="2" x1="651.7157287525381" x2="640.4020202535534" y1="101.7157287525381" y2="90.40202025355335" /><line stroke="#ff9e4e" stroke-width="2" x1="680.0" x2="680.0" y1="90.0" y2="74.0" /><line stroke="#ff9e4e" stroke-width="2" x1="708.2842712474619" x2="719.5979797464466" y1="101.7157287525381" y2="90.40202025355333" /><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-dasharray="[6, 5]" stroke-width="2" x1="648" x2="455" y1="152" y2="250" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="end" x="668" y="96">主光 Directional（平行光，定明暗基调）</text><ellipse cx="140" cy="340" fill="#4ea1ff" opacity="0.12" rx="40" ry="40" stroke="none" stroke-width="1.0" /><ellipse cx="140" cy="340" fill="#4ea1ff" opacity="1.0" rx="10" ry="10" stroke="none" stroke-width="1.0" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="140" y="388">补光 Point</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="560" y="156">环境光：由天空盒提供，全局底色</text><line marker-end="url(#arrowhead)" stroke="#9aa0a6" stroke-dasharray="[4, 4]" stroke-width="1.2" x1="560" x2="560" y1="166" y2="342" /><rect fill="#2b2b2b" height="95" rx="10" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="250" x="60" y="410" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="74" y="436">主光 Directional</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="74" y="460">像太阳：一个方向打进来</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="74" y="479">决定影子与体积感</text><rect fill="#2b2b2b" height="95" rx="10" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="250" x="330" y="410" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="344" y="436">补光 Point</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="344" y="460">放在阴影侧：把暗部照亮</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="344" y="479">提升可读性</text><rect fill="#2b2b2b" height="95" rx="10" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="250" x="600" y="410" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="614" y="436">环境光 Skybox</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="614" y="460">天空盒自带的环境照明</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="614" y="479">调强度控制全局亮暗</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="540">实时光源越少越好 —— 每盏实时灯都是成本（见第 4 篇），能烘焙的走烘焙</text></svg>