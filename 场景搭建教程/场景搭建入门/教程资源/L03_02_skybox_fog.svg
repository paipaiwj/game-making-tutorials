<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="470px" version="1.1" viewBox="0 0 900 470" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><linearGradient id="g1" x1="80" x2="80" y1="140" y2="290"><stop offset="0" stop-color="#24344e" stop-opacity="1.0" /><stop offset="0.55" stop-color="#3d5a80" stop-opacity="1.0" /><stop offset="1" stop-color="#8a7a5a" stop-opacity="1.0" /></linearGradient></defs><rect fill="#1e1e1e" height="470" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">天空盒与雾：先定「天」，再定「氛围」</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">天空盒决定白天还是黄昏，雾让远处与天空融合</text><rect fill="#2b2b2b" height="240" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="370" x="60" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="245" y="120">天空盒 Skybox</text><rect fill="url(#g1)" height="130" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="330" x="80" y="140" /><ellipse cx="330" cy="175" fill="#ffcc66" opacity="0.9" rx="22" ry="22" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="245" y="290">Window → Rendering → Lighting → Environment</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="245" y="312">指定 Skybox Material（白天 / 黄昏 / 星空）</text><rect fill="#2b2b2b" height="270" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="370" x="470" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="655" y="120">雾 Fog</text><rect fill="#3d4a5a" height="10" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="330" x="490" y="278" /><rect fill="#6bcf7f" height="46" opacity="0.3" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="60" x="730" y="232" /><rect fill="#6bcf7f" height="61" opacity="0.55" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="70" x="660" y="217" /><rect fill="#6bcf7f" height="76" opacity="0.85" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="80" x="585" y="202" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="655" y="318">近处清晰，远处融入天空</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="655" y="342">Lighting → Fog：勾选后调 Density（越大越浓）</text><rect fill="#1a1a1a" height="86" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="375" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="85" y="401">搭配建议</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="425">白天世界：浅蓝天空盒 + 很轻的雾；黄昏世界：暖色天空盒 + 浓一点的雾，氛围立刻不同</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="445">雾还能掩盖远处物体「突然出现」的加载痕迹 —— 视线尽头记得放个雾墙</text></svg>