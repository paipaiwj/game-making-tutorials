<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">VRChat 世界性能预算（参考值）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="62">目标是评级 Good 以上 —— 数值随 SDK 版本会变，以 Unity 里性能检查器为准</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="60" y="78" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="100">项目</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="150" x="245" y="78" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="320" y="100">参考预算</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="380" x="410" y="78" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="600" y="100">说明</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="112" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="141">共享材质数</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="150" x="245" y="112" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="320" y="141">≤ 30</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="410" y="112" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="422" y="141">同类物体用同一材质，越多越难合批</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="170" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="199">实时光源</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="150" x="245" y="170" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="320" y="199">≤ 1 盏</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="410" y="170" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="422" y="199">其余灯光全部走烘焙，实时灯每盏都贵</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="228" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="257">同时播放的粒子</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="150" x="245" y="228" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="320" y="257">≤ 2 套</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="410" y="228" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="422" y="257">循环粒子用完就停，别让它们挂满场景</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="286" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="315">单张纹理尺寸</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="150" x="245" y="286" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="320" y="315">≤ 1024</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="410" y="286" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="422" y="315">远景 512 就够；2048 以上几乎必踩坑</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="344" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="373">多边形总数</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="150" x="245" y="344" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="320" y="373">≤ 10 万</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="410" y="344" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="422" y="373">靠 LOD 和遮挡剔除控制（见本篇第 4 章）</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="402" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="431">Udon 行为数量</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="150" x="245" y="402" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="320" y="431">≤ 16 个</text><rect fill="#2b2b2b" height="48" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="410" y="402" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="422" y="431">逻辑集中到管理器，别在满场景挂脚本</text><rect fill="#1a1a1a" height="86" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="470" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="85" y="496">怎么看预算？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="520">Build 世界时 VRChat SDK 会自动评级（Poor → Excellent），红了就说明超了</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="540">完整优化方法见《渲染教程》第 4 篇 —— 本篇先把「数清 + 减量」做到位</text></svg>