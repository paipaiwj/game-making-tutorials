<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#c084fc" /></marker></defs><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">实战：搭一个小露营场景</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">五步走完，一个能逛、能聚会、性能合格的场景就出来了</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="156" x="32" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="110" y="118">1. 白盒</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="110" y="146">Cube 搭骨架</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="110" y="166">定大小和位置</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="190" x2="200" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="156" x="202" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="280" y="118">2. 地面材质</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="146">地面+天空定色调</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="166">先铺大色块</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="360" x2="370" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="372" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="450" y="118">3. 灯光天空</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="146">打光三件套</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="166">白天/黄昏二选一</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="530" x2="540" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="156" x="542" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="620" y="118">4. 摆放道具</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="146">树、帐篷、桌椅</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="166">统一材质风格</text><line marker-end="url(#arrowhead)" stroke="#c084fc" stroke-width="2" x1="700" x2="710" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="712" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="790" y="118">5. 烘焙+检查</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="790" y="146">烘焙光照</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="790" y="166">查 Draw Call 数</text><rect fill="#1a1a1a" height="86" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="320" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="85" y="346">每步都检查</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="370">白盒阶段反复 Play 试走动线；之后每一步「只改一个变量」，出问题立刻知道是谁</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="390">第 5 步达标标准：性能评级 Good 以上、无碰撞穿透、视觉完成度 80%</text></svg>