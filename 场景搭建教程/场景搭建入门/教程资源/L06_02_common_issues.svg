<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">常见问题对照表</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="60" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="150" y="92">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="255" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="345" y="92">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="180" x="560" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="650" y="92">解决办法</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="104" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="129">掉帧卡顿</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="255" y="104" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="129">材质太多 / 实时灯太多</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="146">循环粒子泛滥</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="560" y="104" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="129">共享材质 + 烘焙灯光</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="146">关闭闲置粒子，评级 Good</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="174" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="199">碰撞穿透</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="255" y="174" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="199">Collider 比模型小</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="216">薄墙用了 Mesh Collider</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="560" y="174" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="199">调大 Collider</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="216">薄墙用 Box，检查 Layer 矩阵</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="244" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="269">场景太暗</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="255" y="244" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="269">环境光太弱</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="286">天空盒太暗</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="560" y="244" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="269">补齐打光三件套</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="286">调高环境光强度</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="314" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="339">画面过曝</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="255" y="314" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="339">主光太强</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="356">泛光阈值太低</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="560" y="314" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="339">降低主光强度</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="356">后处理里调 Bloom 阈值</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="384" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="409">烘焙太慢</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="255" y="384" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="409">烘焙范围太大</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="426">分辨率太高</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="560" y="384" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="409">缩小范围、降分辨率</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="426">分区域烘焙</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="180" x="60" y="454" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="479">地面塌陷</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="255" y="454" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="479">地面没有 Collider</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="496">地形未生成碰撞</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="560" y="454" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="479">确认地面有 Collider</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="710" y="496">用简化碰撞网格</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="534">调试心法：先看性能评级和 Scene 视图线框，再动手改 —— 八成问题一眼就能定位</text></svg>