<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 900 500" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6e6e6e" /></marker></defs><rect fill="#1e1e1e" height="500" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">场景搭建：先白盒，再美术</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">用 Cube 搭骨架确定布局，验证没问题后再换正式美术资源</text><rect fill="#2b2b2b" height="260" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="370" x="60" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="235" y="120">① 白盒 Blockout</text><polygon fill="#3a3a3a" points="110,170 126,158 196,158 180,170" stroke="#4a4a4a" stroke-width="1.2" /><rect fill="#2f2f2f" height="50" rx="6" ry="6" stroke="#4a4a4a" stroke-width="1.5" width="70" x="110" y="170" /><polygon fill="#282828" points="180,170 196,158 196,208 180,220" stroke="#4a4a4a" stroke-width="1.2" /><polygon fill="#3a3a3a" points="205,155 221,143 281,143 265,155" stroke="#4a4a4a" stroke-width="1.2" /><rect fill="#2f2f2f" height="65" rx="6" ry="6" stroke="#4a4a4a" stroke-width="1.5" width="60" x="205" y="155" /><polygon fill="#282828" points="265,155 281,143 281,208 265,220" stroke="#4a4a4a" stroke-width="1.2" /><polygon fill="#3a3a3a" points="290,180 306,168 386,168 370,180" stroke="#4a4a4a" stroke-width="1.2" /><rect fill="#2f2f2f" height="45" rx="6" ry="6" stroke="#4a4a4a" stroke-width="1.5" width="80" x="290" y="180" /><polygon fill="#282828" points="370,180 386,168 386,213 370,225" stroke="#4a4a4a" stroke-width="1.2" /><polygon fill="#3a3a3a" points="140,240 156,228 246,228 230,240" stroke="#4a4a4a" stroke-width="1.2" /><rect fill="#2f2f2f" height="60" rx="6" ry="6" stroke="#4a4a4a" stroke-width="1.5" width="90" x="140" y="240" /><polygon fill="#282828" points="230,240 246,228 246,288 230,300" stroke="#4a4a4a" stroke-width="1.2" /><polygon fill="#3a3a3a" points="255,245 271,233 371,233 355,245" stroke="#4a4a4a" stroke-width="1.2" /><rect fill="#2f2f2f" height="55" rx="6" ry="6" stroke="#4a4a4a" stroke-width="1.5" width="100" x="255" y="245" /><polygon fill="#282828" points="355,245 371,233 371,288 355,300" stroke="#4a4a4a" stroke-width="1.2" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="235" y="328">全是灰盒子，只关心位置对不对</text><rect fill="#2b2b2b" height="260" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="370" x="470" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="655" y="120">② 美术化</text><polygon fill="#8a6a4a" points="540,180 556,168 646,168 630,180" stroke="#4a4a4a" stroke-width="1.2" /><rect fill="#a07a50" height="70" rx="6" ry="6" stroke="#4a4a4a" stroke-width="1.5" width="90" x="540" y="180" /><polygon fill="#7a5c40" points="630,180 646,168 646,238 630,250" stroke="#4a4a4a" stroke-width="1.2" /><polygon fill="#b0563a" points="535,180 585,140 635,180" stroke="#c06848" stroke-width="1.2" /><rect fill="#6a4a30" height="35" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="14" x="700" y="235" /><ellipse cx="707" cy="210" fill="#4a9a5a" opacity="0.9" rx="26" ry="30" /><ellipse cx="692" cy="222" fill="#55aa66" opacity="0.9" rx="16" ry="18" /><rect fill="#7a6a4a" height="40" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="8" x="490" y="235" /><ellipse cx="494" cy="225" fill="#ff9e4e" opacity="0.35" rx="14" ry="10" stroke="none" stroke-width="1.0" /><ellipse cx="494" cy="226" fill="#ffcc66" opacity="1.0" rx="6" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="655" y="328">树、房子、灯 —— 换成成品资源</text><line marker-end="url(#arrowhead)" stroke="#6e6e6e" stroke-width="2.5" x1="435" x2="462" y1="220" y2="220" /><rect fill="#1a1a1a" height="86" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="380" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="85" y="406">为什么先白盒？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="430">白盒改一个位置只要 1 分钟，成品模型挪一次可能 1 小时 —— 布局问题要趁早发现</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="85" y="450">白盒阶段反复按 Play 试走动线，满意了再进入美术化，能省掉大量返工</text></svg>