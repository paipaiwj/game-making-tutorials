<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 900 520" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="520" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">色彩进阶路线图</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="60">从会用工具，到有自己的风格</text><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="180" x="45" y="92" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="135" y="120">入门 · 会用色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="135" y="150">HSV 三参数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="135" y="169">认得出 12 色环</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="135" y="228">本课完成</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="227" x2="253" y1="167" y2="167" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="180" x="255" y="92" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="345" y="120">熟练 · 会配色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="345" y="150">五大方案随手用</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="345" y="169">能定场景情绪</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="345" y="228">约 1 周</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="437" x2="463" y1="167" y2="167" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="180" x="465" y="92" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="555" y="120">进阶 · 会调光</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="555" y="150">色温/天空盒/环境光</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="555" y="169">后处理全链路</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="555" y="228">约 1 个月</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="647" x2="673" y1="167" y2="167" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="180" x="675" y="92" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="765" y="120">精通 · 有风格</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="765" y="150">自建色板库</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="765" y="169">风格化 Look 调色</text><text fill="#c084fc" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="765" y="228">长期</text><rect fill="#1a1a1a" height="170" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="288" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="90" y="318">练习建议</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="346">① 每个场景先写一句话情绪（温馨/恐怖/科技…），再动手调色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="368">② 收集喜欢游戏的截图，用取色器拆它的色板，模仿配色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="390">③ 一个场景尝试 2 种情绪版本：同样布局，调色后完全不同</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="412">④ 调色后截图对比：把「调色前/后」并排看，进步最快</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="434">⑤ 遵守 6:3:1 面积比，颜色越多越难统一</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="492">色彩是美术的「全局变量」—— 学会它，你的世界立刻有质感</text></svg>