<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="640px" version="1.1" viewBox="0 0 900 640" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="640" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">色彩术语速查表</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="60">12 个高频词，配图对照记忆</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="60" y="84" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="110">色相 Hue</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="132">颜色本身：红/橙/黄/绿…</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="480" y="84" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="110">饱和度 Saturation</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="132">鲜艳程度：0% 灰 → 100% 纯</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="900" y="84" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="916" y="110">明度 Value</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="916" y="132">亮暗程度：0% 黑 → 100% 最亮</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="60" y="166" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="192">色环 Color Wheel</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="214">12 色排列成环，配色的地图</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="480" y="166" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="192">冷暖色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="214">暖=热情危险，冷=平静神秘</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="900" y="166" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="916" y="192">互补色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="916" y="214">色轮相对（180°），对比最强</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="60" y="248" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="274">近似色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="296">色轮相邻，和谐自然</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="480" y="248" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="274">三角配色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="296">120° 间隔三色，活泼均衡</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="900" y="248" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="916" y="274">色温 K 值</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="916" y="296">灯光冷暖：低=暖橙，高=冷蓝</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="60" y="330" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="356">白平衡</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="378">把「白色」调回真正的白</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="480" y="330" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="356">色调映射 Tonemap</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="378">HDR 高光压回可见范围</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="900" y="330" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="916" y="356">色板 Palette</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="916" y="378">固定一组颜色，全局只用它</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="618">记不住没关系 —— 需要时回来查，用多了自然记住</text></svg>