<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600px" version="1.1" viewBox="0 0 900 600" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="600" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">配色方案怎么选？看用途</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">同一个游戏里，不同用途可以用不同方案 —— 先定功能，再定方案</text><rect fill="#2b2b2b" height="74" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="92" /><rect fill="#1a1a1a" height="44" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="96" x="76" y="106" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="124" y="134">单色</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="210" y="122">UI 面板 / 数据界面</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="210" y="144">信息要清楚，不能抢戏</text><rect fill="#2e5fd6" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="620" y="106" /><rect fill="#4ea1ff" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="670" y="106" /><rect fill="#9ecbff" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="720" y="106" /><rect fill="#2b2b2b" height="74" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="176" /><rect fill="#1a1a1a" height="44" rx="6" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="96" x="76" y="190" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="124" y="218">互补</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="210" y="206">按钮 / 血条 / 阵营</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="210" y="228">一眼分出「我方 / 敌方」</text><rect fill="#e74c3c" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="620" y="190" /><rect fill="#4ea1ff" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="670" y="190" /><rect fill="#9ecbff" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="720" y="190" /><rect fill="#2b2b2b" height="74" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="260" /><rect fill="#1a1a1a" height="44" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="96" x="76" y="274" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="124" y="302">近似</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="210" y="290">场景远景 / 植被材质</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="210" y="312">看着自然舒服，不刺眼</text><rect fill="#9acd32" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="620" y="274" /><rect fill="#2e8b57" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="670" y="274" /><rect fill="#26c6da" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="720" y="274" /><rect fill="#2b2b2b" height="74" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="344" /><rect fill="#1a1a1a" height="44" rx="6" ry="6" stroke="#c084fc" stroke-width="1.5" width="96" x="76" y="358" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="124" y="386">三角</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="210" y="374">角色 / 物品区分</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="210" y="396">颜色多但依然均衡</text><rect fill="#e74c3c" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="620" y="358" /><rect fill="#ffd94d" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="670" y="358" /><rect fill="#4d7bff" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="720" y="358" /><rect fill="#2b2b2b" height="74" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="428" /><rect fill="#1a1a1a" height="44" rx="6" ry="6" stroke="#ff88cc" stroke-width="1.5" width="96" x="76" y="442" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="124" y="470">分裂互补</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="210" y="458">氛围场景主色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="210" y="480">有对比但耐看，可久视</text><rect fill="#4d7bff" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="620" y="442" /><rect fill="#ffb04d" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="670" y="442" /><rect fill="#ff7d4d" height="44" rx="6" ry="6" stroke="#000" stroke-width="1" width="40" x="720" y="442" /><rect fill="#1a1a1a" height="60" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="514" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="542">举例：抢答小游戏 = 单色 UI + 互补的「对/错」反馈 + 近似色的场景</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="564">Unity 里取色：右键任意颜色字段 → Copy Color，Ctrl+V 粘贴到别的颜色框</text></svg>