<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="680px" version="1.1" viewBox="0 0 900 680" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="680" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">色彩情绪：同一片场景，三种颜色三种气氛</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">色相定「是什么氛围」，饱和度定「多强烈」，明度定「多暗」</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#ffb74d" stroke-width="1.8" width="780" x="60" y="92" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="90" y="122">温馨 Cozy</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="148">暖色 + 高饱和</text><rect fill="#ff7043" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="90" y="166" /><rect fill="#ffb74d" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="148" y="166" /><rect fill="#ffe0a3" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="206" y="166" /><rect fill="#8d6e63" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="264" y="166" /><text fill="#ffb74d" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="420" y="184">情绪词：温暖、安全、亲切、食欲</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="420" y="208">参考场景：壁炉旁、咖啡店、黄昏村庄</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="420" y="232">暖色 + 高饱和 = 亲切温暖</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="780" x="60" y="280" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="90" y="310">恐怖 Horror</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="336">冷色 + 低饱和</text><rect fill="#3b4a5a" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="90" y="354" /><rect fill="#4a4e69" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="148" y="354" /><rect fill="#2f2f35" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="206" y="354" /><rect fill="#6b6b6b" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="264" y="354" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="420" y="372">情绪词：压抑、不安、孤独、危险</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="420" y="396">参考场景：废弃医院、深夜森林、密室</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="420" y="420">冷色 + 低饱和 + 低明度 = 压抑</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#00e5ff" stroke-width="1.8" width="780" x="60" y="468" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="90" y="498">科技 Tech</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="524">青色 + 霓虹</text><rect fill="#00e5ff" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="90" y="542" /><rect fill="#00b0ff" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="148" y="542" /><rect fill="#7c4dff" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="206" y="542" /><rect fill="#0d1b2a" height="66" rx="6" ry="6" stroke="#000" stroke-width="1" width="48" x="264" y="542" /><text fill="#00e5ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="420" y="560">情绪词：未来、冷静、精密、酷炫</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="420" y="584">参考场景：赛博都市、实验室、数据世界</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="420" y="608">青色 + 高饱和 = 未来感</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="658">VRChat 里最经典的恐怖世界，几乎都是「低饱和蓝绿 + 极低明度」</text></svg>