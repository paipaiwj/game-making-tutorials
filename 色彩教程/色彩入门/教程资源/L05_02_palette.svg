<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">露营场景色板（夜晚 · 篝火）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">情绪：温馨 + 一点神秘 —— 暖色篝火 + 冷色夜空</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="90" y="96">主色（大面积 · 天空/远景/地面）</text><rect fill="#1c2b4a" height="96" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="90" y="108" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="200" y="230">夜空深蓝</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="200" y="250">天空盒/远景</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="200" y="266">大面积底色</text><rect fill="#2f4a3a" height="96" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="340" y="108" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="450" y="230">树影墨绿</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="250">树木/灌木</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="266">植被</text><rect fill="#8a6a4f" height="96" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="590" y="108" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="700" y="230">大地暖棕</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="700" y="250">地面/木台</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="700" y="266">帐篷帆布</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="90" y="292">辅色（中等面积 · 细节材质）</text><rect fill="#5a3e2b" height="60" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="90" y="304" /><text fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="102" y="330">木柴深棕</text><text fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="102" y="352">桌椅/栅栏</text><rect fill="#a88b6a" height="60" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="340" y="304" /><text fill="#2b2b2b" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="352" y="330">原木浅棕</text><text fill="#2b2b2b" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="352" y="352">地板/木桶</text><rect fill="#4a5d46" height="60" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="590" y="304" /><text fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="602" y="330">草绿</text><text fill="#ffffff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="602" y="352">草地小面积</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="90" y="396">强调色（小面积 · 光源和交互物）</text><rect fill="#ff8c42" height="60" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="90" y="408" /><text fill="#1e1e1e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="102" y="434">篝火橙</text><text fill="#333333" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="102" y="456">火焰/火把/交互物</text><rect fill="#ffd166" height="60" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="340" y="408" /><text fill="#1e1e1e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="352" y="434">暖黄</text><text fill="#333333" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="352" y="456">灯光/火苗亮部</text><rect fill="#ffe8d6" height="60" rx="8" ry="6" stroke="#000" stroke-width="1" width="220" x="590" y="408" /><text fill="#1e1e1e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="602" y="434">暖白</text><text fill="#333333" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="602" y="456">高光/最亮处</text><rect fill="#1a1a1a" height="52" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="486" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="516">面积比大约 6:3:1 —— 主色占 60%、辅色 30%、强调色 10%，画面才稳</text></svg>