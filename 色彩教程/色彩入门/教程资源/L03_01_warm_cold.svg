<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">冷暖色：颜色也有「温度」</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">暖色 = 热情 / 危险 / 温暖   冷色 = 平静 / 神秘 / 疏离</text><rect fill="#3a2416" height="300" rx="12" ry="6" stroke="#ff7043" stroke-width="2" width="380" x="60" y="92" /><text fill="#ffb74d" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="250" y="124">暖色 Warm</text><rect fill="#ff5252" height="76" rx="8" ry="6" stroke="#000" stroke-width="1" width="100" x="90" y="150" /><text fill="#ffd0b0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="140" y="254">红 刺激·紧急</text><rect fill="#ff9800" height="76" rx="8" ry="6" stroke="#000" stroke-width="1" width="100" x="208" y="150" /><text fill="#ffd0b0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="258" y="254">橙 活力·食欲</text><rect fill="#ffd740" height="76" rx="8" ry="6" stroke="#000" stroke-width="1" width="100" x="326" y="150" /><text fill="#ffd0b0" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="376" y="254">黄 快乐·注意</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="250" y="292">→ 篝火、夕阳、警告灯、爆炸特效</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="250" y="316">→ 离得近的感觉、紧张感</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="250" y="340">→ 危险区、血量低、热源</text><text fill="#ff8a50" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="250" y="372">暖色向观众「靠近」</text><rect fill="#16233a" height="300" rx="12" ry="6" stroke="#4ea1ff" stroke-width="2" width="380" x="460" y="92" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="650" y="124">冷色 Cool</text><rect fill="#4d7bff" height="76" rx="8" ry="6" stroke="#000" stroke-width="1" width="100" x="490" y="150" /><text fill="#b0d0ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="540" y="254">蓝 平静·理性</text><rect fill="#26c6da" height="76" rx="8" ry="6" stroke="#000" stroke-width="1" width="100" x="608" y="150" /><text fill="#b0d0ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="658" y="254">青 凉爽·科技</text><rect fill="#9575cd" height="76" rx="8" ry="6" stroke="#000" stroke-width="1" width="100" x="726" y="150" /><text fill="#b0d0ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="776" y="254">紫 神秘·梦幻</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="650" y="292">→ 月光、水面、深夜、冰霜</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="650" y="316">→ 安静的感觉、孤独感</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="650" y="340">→ 安全区、血量高、冷静</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="650" y="372">冷色向远处「退去」</text><rect fill="#1a1a1a" height="108" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="416" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="90" y="446">场景里的用法</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="476">① 主光暖、阴影冷 —— 画面立刻有层次  ② 前景暖 / 远景冷 —— 拉开纵深</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="500">③ 用冷暖对比引导视线：最亮最暖的地方，就是玩家该看的地方</text></svg>