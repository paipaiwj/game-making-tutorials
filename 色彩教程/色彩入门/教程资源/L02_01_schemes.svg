<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="700px" version="1.1" viewBox="0 0 900 700" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="700" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">五大配色方案</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">在色轮上取色，按几何关系搭配 —— 先选方案，再挑颜色</text><rect fill="#2b2b2b" height="100" rx="10" ry="6" stroke="#4ea1ff" stroke-width="1.8" width="780" x="60" y="92" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="84" y="120">单色 Monochromatic</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="144">同一色相，只变饱和度和明度</text><rect fill="#1a3a8a" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="279" y="108" /><rect fill="#2e5fd6" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="357" y="108" /><rect fill="#4ea1ff" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="435" y="108" /><rect fill="#9ecbff" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="513" y="108" /><rect fill="#d6e9ff" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="591" y="108" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="180">干净、专业、容易统一，适合 UI 和仪表盘</text><rect fill="#2b2b2b" height="100" rx="10" ry="6" stroke="#ff9e4e" stroke-width="1.8" width="780" x="60" y="204" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="84" y="232">互补 Complementary</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="256">色轮上相对的两个颜色（180°）</text><rect fill="#e74c3c" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="279" y="220" /><rect fill="#ff8a7a" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="357" y="220" /><rect fill="#c0392b" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="435" y="220" /><rect fill="#4ea1ff" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="513" y="220" /><rect fill="#9ecbff" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="591" y="220" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="292">对比最强、最醒目，适合按钮、血条、阵营对立</text><rect fill="#2b2b2b" height="100" rx="10" ry="6" stroke="#6bcf7f" stroke-width="1.8" width="780" x="60" y="316" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="84" y="344">近似 Analogous</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="368">色轮上相邻的几个颜色</text><rect fill="#ffd94d" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="279" y="332" /><rect fill="#9acd32" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="357" y="332" /><rect fill="#2e8b57" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="435" y="332" /><rect fill="#26c6da" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="513" y="332" /><rect fill="#3a7bd5" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="70" x="591" y="332" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="404">和谐自然，适合场景远景、树木草地</text><rect fill="#2b2b2b" height="100" rx="10" ry="6" stroke="#c084fc" stroke-width="1.8" width="780" x="60" y="428" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="84" y="456">三角 Triadic</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="480">色轮上 120° 间隔的三个颜色</text><rect fill="#e74c3c" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="110" x="297" y="444" /><rect fill="#ffd94d" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="110" x="415" y="444" /><rect fill="#4d7bff" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="110" x="533" y="444" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="516">活泼均衡、色彩丰富，适合角色区分、儿童游戏</text><rect fill="#2b2b2b" height="100" rx="10" ry="6" stroke="#ff88cc" stroke-width="1.8" width="780" x="60" y="540" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="84" y="568">分裂互补 Split</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="592">一个主色 + 互补色两侧的两个</text><rect fill="#4d7bff" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="80" x="298" y="556" /><rect fill="#ffb04d" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="80" x="386" y="556" /><rect fill="#ff7d4d" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="80" x="474" y="556" /><rect fill="#2e5fd6" height="54" rx="7" ry="6" stroke="#000" stroke-width="1" width="80" x="562" y="556" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="84" y="628">对比柔和些，既醒目又耐看，适合氛围场景</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="start" x="60" y="676">记住：方案决定「颜色之间的关系」，具体色相由场景情绪决定</text></svg>