<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">色轮 Color Wheel：把颜色排成一个圈</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">12 色环 = 原色 + 二次色 + 三次色，配色方案的起点</text><path d="M250,330 L250.00,160.00 A170,170 0 0 1 335.00,182.78 Z" fill="#f40000" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L335.00,182.78 A170,170 0 0 1 397.22,245.00 Z" fill="#f47a00" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L397.22,245.00 A170,170 0 0 1 420.00,330.00 Z" fill="#f4f400" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L420.00,330.00 A170,170 0 0 1 397.22,415.00 Z" fill="#7af400" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L397.22,415.00 A170,170 0 0 1 335.00,477.22 Z" fill="#00f400" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L335.00,477.22 A170,170 0 0 1 250.00,500.00 Z" fill="#00f47a" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L250.00,500.00 A170,170 0 0 1 165.00,477.22 Z" fill="#00f4f4" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L165.00,477.22 A170,170 0 0 1 102.78,415.00 Z" fill="#007af4" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L102.78,415.00 A170,170 0 0 1 80.00,330.00 Z" fill="#0000f4" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L80.00,330.00 A170,170 0 0 1 102.78,245.00 Z" fill="#7a00f4" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L102.78,245.00 A170,170 0 0 1 165.00,182.78 Z" fill="#f400f4" stroke="#1e1e1e" stroke-width="3" /><path d="M250,330 L165.00,182.78 A170,170 0 0 1 250.00,160.00 Z" fill="#f4007a" stroke="#1e1e1e" stroke-width="3" /><ellipse cx="250" cy="330" fill="#1e1e1e" opacity="1.0" rx="62" ry="62" stroke="#3a3a3a" stroke-width="2" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="250" y="324">12 色环</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="250" y="346">每 30° 一个颜色</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="500" y="96">色环的三个层次</text><rect fill="#2b2b2b" height="98" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="350" x="490" y="124" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="510" y="150">原色 Primary</text><rect fill="#ff4d4d" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="510" y="162" /><rect fill="#ffd94d" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="576" y="162" /><rect fill="#4d7bff" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="642" y="162" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="510" y="212">红 黄 蓝 —— 无法用别的颜色混合出来</text><rect fill="#2b2b2b" height="98" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="350" x="490" y="242" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="510" y="268">二次色 Secondary</text><rect fill="#ff9e4e" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="510" y="280" /><rect fill="#7dff4d" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="576" y="280" /><rect fill="#e14dff" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="642" y="280" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="510" y="330">橙 绿 紫 —— 原色两两混合</text><rect fill="#2b2b2b" height="98" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="350" x="490" y="360" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="510" y="386">三次色 Tertiary</text><rect fill="#ff7d4d" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="510" y="398" /><rect fill="#b4ff4d" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="576" y="398" /><rect fill="#4dffe1" height="34" rx="4" ry="6" stroke="#000" stroke-width="1" width="58" x="642" y="398" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="510" y="448">红橙 黄绿 青蓝 … 原色+二次色混合</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="540">看色轮画彩虹：红 → 橙 → 黄 → 绿 → 青 → 蓝 → 紫，回到红</text></svg>