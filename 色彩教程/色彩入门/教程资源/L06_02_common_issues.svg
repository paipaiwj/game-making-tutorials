<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620px" version="1.1" viewBox="0 0 900 620" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="620" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">常见问题对照表</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="60">看到问题 → 查原因 → 按方法修</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="60" y="84" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="106">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="245" y="84" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="330" y="106">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="550" y="84" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="635" y="106">解决办法</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="118" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="154">颜色发灰、脏</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="245" y="118" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="390" y="154">饱和度低 + 明度太接近</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#ffcc66" stroke-width="1.5" width="320" x="550" y="118" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="710" y="154">提高 S，拉开明度差（亮处更亮暗处更暗）</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="192" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="228">画面过曝发白</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="245" y="192" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="390" y="228">灯光太强 / 后处理曝光过高</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#ffcc66" stroke-width="1.5" width="320" x="550" y="192" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="710" y="228">主光强度降到 0.5~1，曝光 -0.5 起调</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="266" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="302">颜色又脏又土</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="245" y="266" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="390" y="302">色相太多、太杂</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="320" x="550" y="266" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="710" y="302">限定 2~3 个色相，建色板统一取色</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="340" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="376">灯光总是偏色</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="245" y="340" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="390" y="376">色温 K 值没调对</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="320" x="550" y="340" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="710" y="376">白天 5500~6500K，黄昏 3000~3500K</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="414" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="450">整体统一感差</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="245" y="414" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="390" y="450">材质颜色各自为战</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="320" x="550" y="414" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="710" y="450">共用色板 + 最后统一调色节点</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="488" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="524">色盲玩家看不清</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="290" x="245" y="488" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="390" y="524">只用颜色做区分</text><rect fill="#2b2b2b" height="64" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="320" x="550" y="488" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="710" y="524">加形状/亮度/图标辅助信息</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="604">调色心法：先解决「最亮和最暗」，再调中间层次 —— 对比对了，画面就立住了</text></svg>