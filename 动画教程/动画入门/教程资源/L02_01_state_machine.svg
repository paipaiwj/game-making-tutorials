<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 900 500" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="500" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">状态机：状态 + 转换 + 参数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">物体一直处于某个状态；转换决定什么时候切到另一个状态</text><rect fill="#2b2b2b" height="100" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="180" x="60" y="140" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="150" y="192">Idle</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="150" y="216">门关着</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="150" y="234">（待机）</text><rect fill="#2b2b2b" height="100" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="180" x="360" y="140" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="450" y="192">Open</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="216">门开着</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="234">（保持开启）</text><rect fill="#2b2b2b" height="100" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="180" x="660" y="140" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="750" y="192">Close</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="750" y="216">关门过程</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="750" y="234">（过渡动画）</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="245" x2="352" y1="190" y2="190" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="298" y="176">doorOpen = true</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="545" x2="652" y1="190" y2="190" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="598" y="176">doorOpen = false</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-dasharray="[6, 4]" stroke-width="2" x1="660" x2="240" y1="255" y2="258" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="660" y="288">也可以把「开门/关门」做成过渡动画，
写在转换上，切换时自动播放</text><rect fill="#1a1a1a" height="110" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="330" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="360">读法：Idle →（doorOpen=true）→ Open →（doorOpen=false）→ Idle，循环开关</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="386">Close 是可选状态：把关门做成过渡动画，也可以直接播放后回到 Idle</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="412">状态机永远只有「一个当前状态」—— 想改表现，就切换状态</text></svg>