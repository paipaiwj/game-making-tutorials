<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="470px" version="1.1" viewBox="0 0 900 470" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="470" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">关键帧与时间轴：中间的部分自动补</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">你只管定「关键的点」，两点之间 Unity 自动插值（补间）</text><rect fill="#1a1a1a" height="60" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="760" x="70" y="105" /><line stroke="#555" stroke-width="2" x1="150" x2="750" y1="135" y2="135" /><line stroke="#777" stroke-width="2" x1="150" x2="150" y1="130" y2="140" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="150" y="120">0s</text><line stroke="#777" stroke-width="2" x1="300" x2="300" y1="130" y2="140" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="300" y="120">0.5s</text><line stroke="#777" stroke-width="2" x1="450" x2="450" y1="130" y2="140" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="120">1s</text><line stroke="#777" stroke-width="2" x1="600" x2="600" y1="130" y2="140" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="600" y="120">1.5s</text><line stroke="#777" stroke-width="2" x1="750" x2="750" y1="130" y2="140" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="750" y="120">2s</text><rect fill="#4ea1ff" height="8" rx="2" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="12" x="144" y="131" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="150" y="175">0° 门关着</text><rect fill="#ff9e4e" height="8" rx="2" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="12" x="294" y="131" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="300" y="175">45° 半开</text><rect fill="#6bcf7f" height="8" rx="2" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="12" x="444" y="131" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="175">90° 全开</text><rect fill="#6bcf7f" height="8" rx="2" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="12" x="594" y="131" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="600" y="175">90° 停住</text><rect fill="#ff9e4e" height="8" rx="2" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="12" x="744" y="131" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="750" y="175">0° 门关上</text><rect fill="#1a1a1a" height="170" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="360" x="70" y="205" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="100" y="232">曲线面板（Curves）</text><line stroke="#555" stroke-width="1.5" x1="100" x2="400" y1="260" y2="260" /><line stroke="#555" stroke-width="1.5" x1="120" x2="120" y1="240" y2="340" /><line stroke="#4ea1ff" stroke-width="2" x1="120" x2="300" y1="340" y2="260" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="200" y="285">直线 = 匀速</text><ellipse cx="300" cy="260" fill="#4ea1ff" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="200" y="318">关键帧1 → 关键帧2</text><rect fill="#1a1a1a" height="170" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="460" y="205" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="490" y="232">调曲线让动作更好看</text><line stroke="#555" stroke-width="1.5" x1="490" x2="790" y1="260" y2="260" /><line stroke="#555" stroke-width="1.5" x1="500" x2="500" y1="240" y2="340" /><line stroke="#ff9e4e" stroke-width="2" x1="500" x2="580" y1="340" y2="300" /><line stroke="#ff9e4e" stroke-width="2" x1="580" x2="660" y1="300" y2="280" /><line stroke="#ff9e4e" stroke-width="2" x1="660" x2="760" y1="280" y2="262" /><ellipse cx="580" cy="300" fill="#ff9e4e" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="660" cy="280" fill="#ff9e4e" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="650" y="318">曲线越陡 = 动得越快</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="650" y="340">开头缓、结尾缓 = 更自然</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="425">只录关键点（0° → 45° → 90°），中间的过程 Unity 自动补</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="448">修改方法：选中菱形关键帧 → 直接改属性，或拖动微调时间</text></svg>