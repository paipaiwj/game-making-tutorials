<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker></defs><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">游戏动画的三层结构</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">剪辑存动作  →  控制器管规则  →  参数做开关</text><rect fill="#2b2b2b" height="180" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="240" x="50" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="170" y="130">① Animation Clip 剪辑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="170" y="158">存一段动作：旋转、位移、颜色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="170" y="178">例：门从 0° 转到 90°</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="170" y="198">就像一个录像片段</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="296" x2="324" y1="190" y2="190" /><rect fill="#2b2b2b" height="180" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="240" x="330" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="450" y="130">② Animator Controller 状态机</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="158">管理何时播放哪段剪辑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="178">例：doorOpen=true 时</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="198">播放「开门」</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="576" x2="604" y1="190" y2="190" /><rect fill="#2b2b2b" height="180" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="240" x="610" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="730" y="130">③ 参数 Parameters</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="730" y="158">连接逻辑与动画的开关</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="730" y="178">Float / Bool / Trigger</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="730" y="198">供 Udon 设置</text><rect fill="#1a1a1a" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="320" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="130" y="350">一句话理解</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="378">剪辑 = 动作内容 ｜ 控制器 = 播放规则 ｜ 参数 = 外部开关</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="400">VRChat 世界里：门、按钮、传送带、NPC 都是这个套路</text></svg>