<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">动画术语速查表</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="60" y="70" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="94">Clip 剪辑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="116">一段记录的动画：属性 + 关键帧</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="480" y="70" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="94">Animator</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="116">播放动画的组件，挂到物体上</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="60" y="146" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="170">Controller 控制器</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="192">状态机的载体 Asset</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="480" y="146" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="170">状态 State</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="192">物体的一种形态（门关着/开着）</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="60" y="222" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="246">转换 Transition</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="268">状态之间的切换规则 + 过渡动画</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="480" y="222" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="246">Float 参数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="268">带小数点的数字（速度/进度）</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="60" y="298" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="322">Bool 参数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="344">真假开关（doorOpen = true）</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="480" y="298" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="322">Trigger 参数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="344">一次性触发信号（拉一下）</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="60" y="374" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="398">关键帧 Keyframe</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="420">某一时刻的属性快照（菱形）</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="480" y="374" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="398">时间轴 Timeline</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="420">时间刻度，关键帧排在上面</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="60" y="450" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="76" y="474">录制 Record</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="76" y="496">边改属性边自动记关键帧</text><rect fill="#2b2b2b" height="60" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="480" y="450" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="496" y="474">权重 Weight</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="496" y="496">动画层混合比例（0~1）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="540">记不住没关系：遇到问题回来翻这一页</text></svg>