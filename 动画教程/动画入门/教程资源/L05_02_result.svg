<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 900 500" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="500" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">开关门的完整结构</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="120" y="80">场景里的物件</text><rect fill="#2b2b2b" height="70" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="280" x="60" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="80" y="119">门模型 Door</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="80" y="141">带 Animator 组件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="80" y="158">Controller = 门_Controller</text><rect fill="#2b2b2b" height="70" rx="8" ry="6" stroke="#6bcf7f" stroke-width="2" width="280" x="60" y="179" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="80" y="203">两个动画剪辑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="80" y="225">开门.anim / 关门.anim</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="80" y="242">各 1 秒的旋转动画</text><rect fill="#2b2b2b" height="70" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="280" x="60" y="263" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="80" y="287">状态机 Controller</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="80" y="309">Idle / Open 两状态</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="80" y="326">doorOpen Bool 参数</text><rect fill="#2b2b2b" height="70" rx="8" ry="6" stroke="#c084fc" stroke-width="2" width="280" x="60" y="347" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="80" y="371">Udon 组件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="80" y="393">DoorToggleComponent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="80" y="410">持有 Animator 引用</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="500" y="80">触发链路</text><rect fill="#2b2b2b" height="70" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="380" x="460" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="480" y="119">按钮 Trigger</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="480" y="143">VRC_Interactable → Interact 事件</text><rect fill="#2b2b2b" height="70" rx="8" ry="6" stroke="#6bcf7f" stroke-width="2" width="380" x="460" y="179" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="480" y="203">Udon 响应</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="480" y="227">SetBool("doorOpen", !doorOpen)</text><rect fill="#2b2b2b" height="70" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="380" x="460" y="263" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="480" y="287">Animator 参数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="480" y="311">doorOpen 变化 → 转换条件满足</text><rect fill="#2b2b2b" height="70" rx="8" ry="6" stroke="#c084fc" stroke-width="2" width="380" x="460" y="347" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="480" y="371">状态机播放</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="480" y="395">Open 状态 → 播放「开门」剪辑</text><rect fill="#1a1a1a" height="55" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="420" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="452">关键：Udon 只碰参数，动画只归状态机管 —— 各干各的，互不打架</text></svg>