<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="470px" version="1.1" viewBox="0 0 900 470" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#c084fc" /></marker></defs><rect fill="#1e1e1e" height="470" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">实战：做一个「开关门」</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">目标：玩家碰按钮 → 门开，再碰 → 门关</text><rect fill="#2b2b2b" height="180" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="156" x="32" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="110" y="118">1. 录关门动画</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="110" y="146">门从 90° 转到 0°</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="110" y="166">（录制 1 秒）</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="190" x2="200" y1="180" y2="180" /><rect fill="#2b2b2b" height="180" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="156" x="202" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="280" y="118">2. 录开门动画</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="280" y="146">门从 0° 转到 90°</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="280" y="166">（录制 1 秒）</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="360" x2="370" y1="180" y2="180" /><rect fill="#2b2b2b" height="180" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="372" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="450" y="118">3. 搭状态机</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="146">两个状态：Idle/Open</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="166">两条转换 + doorOpen 参数</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="530" x2="540" y1="180" y2="180" /><rect fill="#2b2b2b" height="180" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="156" x="542" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="620" y="118">4. 写 Udon</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="620" y="146">DoorToggleComponent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="620" y="166">Interact 时 SetBool 取反</text><line marker-end="url(#arrowhead)" stroke="#c084fc" stroke-width="2" x1="700" x2="710" y1="180" y2="180" /><rect fill="#2b2b2b" height="180" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="712" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="790" y="118">5. 场景连线</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="790" y="146">按钮 → Udon 脚本</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="790" y="166">Animator 挂门模型上</text><rect fill="#1a1a1a" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="310" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="130" y="340">验收标准：门打开 → 再碰 → 门关上 → 再碰 → 门打开……循环不断</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="366">全程不需要改任何代码：开关逻辑 = 状态机 + 一个 SetBool</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="390">先做到「能动」，再去加音效、粒子、按钮动画</text></svg>