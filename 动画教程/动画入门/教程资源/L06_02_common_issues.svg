<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 900 540" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="540" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">动画常见问题对照表</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="60" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="92">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="245" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="330" y="92">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="530" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="615" y="92">解决办法</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="104" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="138">动画不动</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="270" x="245" y="104" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="380" y="138">参数名写错 / 属性被 Udon 覆盖</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="340" x="530" y="104" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="138">核对参数拼写；一个属性只归一处管</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="170" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="204">两个动画互抢</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="270" x="245" y="170" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="380" y="204">多个地方改同一个属性</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="340" x="530" y="170" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="204">确定唯一控制方（动画 or 代码）</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="236" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="270">参数没生效</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="270" x="245" y="236" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="380" y="270">Animator 里没这个参数</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="340" x="530" y="236" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="270">在 Animator 面板添加并核对名字</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="302" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="336">Udon 改不了动画</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="270" x="245" y="302" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="380" y="336">Animator 引用没连对</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="340" x="530" y="302" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="336">检查引用；Animator 在自身或子物体</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="368" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="402">门开关顺序反了</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="270" x="245" y="368" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="380" y="402">状态转换方向连反</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="340" x="530" y="368" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="402">检查 Idle→Open 用 doorOpen=true</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="434" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="468">开一次就停</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="270" x="245" y="434" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="380" y="468">用 Trigger 做开关没有保持</text><rect fill="#2b2b2b" height="56" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="340" x="530" y="434" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="468">开关用 Bool 做双稳态更稳</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="530">调试心法：先问「参数对不对、谁在改这个属性」，八成问题在这里</text></svg>