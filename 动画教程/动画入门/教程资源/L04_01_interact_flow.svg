<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="470px" version="1.1" viewBox="0 0 900 470" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="470" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">交互触发动画：玩家的手 → 动画</text><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="190" x="31" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="126" y="118">玩家交互</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="126" y="146">按按钮 / 碰门</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="126" y="166">VRC_Interactable</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="126" y="186">触发 Interact 事件</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="223" x2="245" y1="170" y2="170" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="190" x="247" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="342" y="118">Udon 脚本</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="342" y="146">收到事件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="342" y="166">调 SetBool 改参数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="342" y="186">doorOpen = true</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="439" x2="461" y1="170" y2="170" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="190" x="463" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="558" y="118">Animator 参数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="558" y="146">doorOpen 变成 true</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="558" y="166">状态机感知到变化</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2.5" x1="655" x2="677" y1="170" y2="170" /><rect fill="#2b2b2b" height="160" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="190" x="679" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="774" y="118">状态机切换</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="774" y="146">Open 转换条件满足</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="774" y="166">播放「开门」剪辑</text><rect fill="#1a1a1a" height="110" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="290" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="130" y="320">核心代码（Udon 里只需这一句）</text><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="348">animator.SetBool("doorOpen", !doorOpen);   // 开→关、关→开</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="374">Udon 不改动画本身，只改参数 —— 播什么、怎么播，全交给状态机</text></svg>