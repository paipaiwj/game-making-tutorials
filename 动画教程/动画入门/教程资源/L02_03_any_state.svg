<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="440px" version="1.1" viewBox="0 0 900 440" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker></defs><rect fill="#1e1e1e" height="440" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">两个特殊节点：Any State 与 Exit</text><rect fill="#2b2b2b" height="240" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="320" x="60" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="90" y="120">Any State（任意状态）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="90" y="150">从任意状态都能切走</text><rect fill="#1a1a1a" height="30" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="100" x="90" y="168" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="140" y="188">Idle</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="1.8" x1="198" x2="240" y1="183" y2="183" /><rect fill="#1a1a1a" height="30" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="100" x="90" y="204" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="140" y="224">Open</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="1.8" x1="198" x2="240" y1="219" y2="219" /><rect fill="#1a1a1a" height="30" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="100" x="90" y="240" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="140" y="260">Close</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="1.8" x1="198" x2="240" y1="255" y2="255" /><rect fill="#1a1a1a" height="60" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="110" x="248" y="183" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle" x="303" y="205">重置状态</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="303" y="227">条件满足即切换</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="90" y="294">用途：紧急动画（重置回位）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="90" y="312">不管在哪，一触发就切过去</text><rect fill="#2b2b2b" height="270" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="400" x="440" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="470" y="120">Exit（退出）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="470" y="150">播放完就退出状态机，不再播动画</text><rect fill="#1a1a1a" height="45" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="130" x="470" y="175" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="bold" text-anchor="middle" x="535" y="202">开场动画</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="1.8" x1="608" x2="688" y1="197" y2="197" /><rect fill="#1a1a1a" height="60" rx="6" ry="6" stroke="#ff88cc" stroke-width="1.5" width="60" x="696" y="180" /><text fill="#ff88cc" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="726" y="201">Exit</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="726" y="222">播放结束</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="start" x="470" y="280">VRChat 场景里一般不退出，
物体保持动画状态，
新手先用好普通状态</text><rect fill="#1a1a1a" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="370" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="399">先学会普通状态 + 转换，再碰 Any State；Exit 用到再说</text></svg>