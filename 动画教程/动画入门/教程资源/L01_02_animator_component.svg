<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">Animator 组件：把控制器挂到物体上</text><rect fill="#2b2b2b" height="310" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="360" x="60" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="90" y="110">Animator 组件（Inspector）</text><rect fill="#1a1a1a" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="310" x="85" y="130" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="100" y="155">Controller</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="end" x="330" y="155">门_Controller</text><rect fill="#1a1a1a" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="310" x="85" y="180" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="100" y="205">Avatar</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="end" x="330" y="205">None（世界物件不需要）</text><rect fill="#1a1a1a" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="310" x="85" y="230" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="100" y="255">Apply Root Motion</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="end" x="330" y="255">关</text><rect fill="#1a1a1a" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="310" x="85" y="280" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="100" y="305">Update Mode</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="end" x="330" y="305">Normal</text><rect fill="#1a1a1a" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="310" x="85" y="330" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="100" y="355">Culling Mode</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="end" x="330" y="355">Always Animate</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="380" x="460" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="480" y="104">Controller</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="480" y="126">唯一必填项：选择你做好的状态机 Asset</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="380" x="460" y="156" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="480" y="180">Avatar</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="480" y="202">只有角色动画才需要；世界物件不填</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="380" x="460" y="232" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="480" y="256">Apply Root Motion</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="480" y="278">角色的根运动，与物件动画无关</text><rect fill="#2b2b2b" height="64" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="380" x="460" y="308" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="480" y="332">Culling Mode</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="480" y="354">离开视野也在动（持续播放）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="440">一个物体挂一个 Animator；动画对象 = Animator + Controller + 剪辑</text></svg>