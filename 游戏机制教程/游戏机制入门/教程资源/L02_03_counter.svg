<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">计数：游戏里到处是「数」</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="156" x="32" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="110" y="118">分数</text><rect fill="#1a1a1a" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="44" y="132" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="110" y="164">score += 10</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="110" y="228">每次命中加分</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="110" y="250">初始化=0</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="156" x="202" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="280" y="118">生命</text><rect fill="#1a1a1a" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="214" y="132" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="280" y="164">lives -= 1</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="280" y="228">归零即失败</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="280" y="250">初始化=0</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="372" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="450" y="118">时间</text><rect fill="#1a1a1a" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="384" y="132" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="164">timeLeft -= deltaTime</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="228">每秒减少</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="250">初始化=0</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="156" x="542" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="620" y="118">次数</text><rect fill="#1a1a1a" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="554" y="132" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="620" y="164">attempts += 1</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="620" y="228">统计玩家操作</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="620" y="250">初始化=0</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="712" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="790" y="118">开关</text><rect fill="#1a1a1a" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="724" y="132" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="790" y="164">isPlaying = true</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="790" y="228">真假两种状态</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="790" y="250">初始化=0</text><rect fill="#1a1a1a" height="70" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="320" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="350">所有变量在游戏开始（Ready）时归零/复位 —— 否则上一局的数据会带到下一局</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="130" y="374">VRChat 多人时变量要同步，见《网络同步》教程</text></svg>