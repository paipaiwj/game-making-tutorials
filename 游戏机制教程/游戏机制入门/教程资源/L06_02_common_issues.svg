<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 900 540" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="540" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">常见问题对照表</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="60" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="92">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="245" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="330" y="92">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="560" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="645" y="92">解决办法</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="104" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="138">还没开始就能得分</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="104" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="138">没有状态判定</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="104" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="138">加分前检查游戏状态</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="174" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="208">上一局分数带到下一局</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="174" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="208">没有重置逻辑</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="174" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="208">写 ResetAll() 统一清零</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="244" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="278">按钮狂点刷分</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="244" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="278">没做防重复判定</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="244" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="278">每人限一次 / 冷却时间</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="314" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="348">游戏卡在某个状态</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="314" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="348">状态转移条件没写全</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="314" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="348">把转移条件画成状态机图</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="384" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="418">两个人分数不一样</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="384" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="418">变量没同步</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="384" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="418">用 [UdonSynced] 同步</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="454" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="488">时间不走了</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="454" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="488">计时逻辑写在非进行状态</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="454" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="488">只在进行中累加时间</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="532">调试心法：先问「现在是什么状态？」再看代码 —— 八成 bug 是状态不对</text></svg>