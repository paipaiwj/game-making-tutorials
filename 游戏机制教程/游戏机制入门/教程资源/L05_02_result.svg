<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">抢答小游戏的完整结构</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="120" y="80">组件（Component）</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="260" x="60" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="80" y="119">GameManagerComponent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="80" y="141">状态机 + 胜负判定 + 重置</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#6bcf7f" stroke-width="2" width="260" x="60" y="173" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="80" y="197">ScoreComponent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="80" y="219">分数变量 + 加分 + 广播</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="260" x="60" y="251" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="80" y="275">TimerComponent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="80" y="297">倒计时 + 时间到信号</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#c084fc" stroke-width="2" width="260" x="60" y="329" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="80" y="353">ScoreboardComponent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="80" y="375">UI 计分板显示</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="480" y="80">信号流（Signal）</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="420" x="420" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="440" y="119">按钮 Trigger</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="440" y="141">Interact → Execute</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#6bcf7f" stroke-width="2" width="420" x="420" y="173" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="440" y="197">加分信号</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="440" y="219">Signal → ScoreComponent</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="420" x="420" y="251" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="440" y="275">倒计时信号</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="440" y="297">Timer → GameManager</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#c084fc" stroke-width="2" width="420" x="420" y="329" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="440" y="353">胜负信号</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="440" y="375">GameManager → 全部</text><rect fill="#1a1a1a" height="60" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="404" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="440">每个组件只干一件事，信号只走一条路 —— 这就是你项目架构的意义</text></svg>