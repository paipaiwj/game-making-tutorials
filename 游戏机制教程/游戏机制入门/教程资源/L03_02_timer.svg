<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">计时器：让游戏有节奏</text><rect fill="#2b2b2b" height="230" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="start" x="90" y="130">60</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="90" y="155">剩余秒数（每秒 -1）</text><rect fill="#1a1a1a" height="24" rx="12" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="560" x="220" y="110" /><rect fill="#4ea1ff" height="24" opacity="0.85" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="220" y="110" /><rect fill="#4ea1ff" height="24" opacity="0.85" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="360" y="110" /><rect fill="#4ea1ff" height="24" opacity="0.85" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="500" y="110" /><rect fill="#4ea1ff" height="24" opacity="0.85" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="132" x="640" y="110" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="220" y="160">时间条 / 数字，任选一种</text><ellipse cx="100" cy="240" fill="#ff9e4e" opacity="1.0" rx="6" ry="6" stroke="none" stroke-width="1.0" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="118" y="