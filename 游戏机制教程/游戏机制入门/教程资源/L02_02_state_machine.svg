<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">状态机 State Machine</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">状态 + 触发条件 + 转移 = 状态机。游戏逻辑的万能骨架</text><rect fill="#2b2b2b" height="80" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="180" x="50" y="140" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="140" y="186">Ready 准备</text><rect fill="#2b2b2b" height="80" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="180" x="360" y="140" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="450" y="186">Playing 进行</text><rect fill="#2b2b2b" height="80" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="180" x="670" y="140" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="760" y="186">Over 结束</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="235" x2="352" y1="180" y2="180" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="294" y="168">倒计时结束</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="545" x2="662" y1="180" y2="180" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="604" y="168">达成胜负条件</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-dasharray="[6, 4]" stroke-width="2" x1="670" x2="140" y1="235" y2="250" /><rect fill="#222222" height="24" rx="12" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="110" x="330" y="236" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="385" y="253">重新开始</text><rect fill="#1a1a1a" height="100" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="310" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="130" y="340">每个状态只干一件事</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="368">Ready：只管等待和倒计时    Playing：只管核心循环    Over：只管结算和重置</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="392">状态分得越清楚，bug 越少 —— 想不出 bug 在哪？先看状态对不对</text></svg>