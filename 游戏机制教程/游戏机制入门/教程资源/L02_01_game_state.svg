<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="440px" version="1.1" viewBox="0 0 900 440" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker></defs><rect fill="#1e1e1e" height="440" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">游戏状态：一场游戏分几个阶段</text><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="220" x="80" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="190" y="140">准备 Ready</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="190" y="172">玩家入场、倒计时</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="306" x2="334" y1="175" y2="175" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="220" x="340" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="450" y="140">进行 Playing</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="172">核心循环运行中</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="566" x2="594" y1="175" y2="175" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="220" x="600" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="710" y="140">结束 Over</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="710" y="172">胜负已定、结算</text><rect fill="#1a1a1a" height="100" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="290" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="130" y="320">为什么必须分状态？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="350">因为「游戏还没开始时，玩家按按钮不该算分」——所有行为都要先问：现在是什么状态？</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="374">代码里用 enum 或字符串存当前状态，一处判定，处处生效</text></svg>