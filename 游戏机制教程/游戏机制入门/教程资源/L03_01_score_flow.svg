<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">计分流程：事件 → 判定 → 加分 → 显示</text><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="190" x="31" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="126" y="128">1. 事件发生</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="126" y="156">玩家命中目标</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="126" y="176">触发碰撞/交互</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="223" x2="245" y1="175" y2="175" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="190" x="247" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="342" y="128">2. 状态判定</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="342" y="156">游戏在进行中？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="342" y="176">是不是有效目标？</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="439" x2="461" y1="175" y2="175" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="190" x="463" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="558" y="128">3. 修改分数</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="558" y="156">score += 10</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="558" y="176">（变量同步）</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2.5" x1="655" x2="677" y1="175" y2="175" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="190" x="679" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="774" y="128">4. 反馈与显示</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="774" y="156">加分音效+特效</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="774" y="176">UI 文本更新</text><rect fill="#1a1a1a" height="80" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="290" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="130" y="320">最重要的一步是第 2 步（状态判定）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="346">「游戏没开始、已经结束、重复命中」都要在这拦截 —— 这就是防作弊和防 bug 的关键</text></svg>