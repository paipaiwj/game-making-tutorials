<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="400" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">核心循环 Core Loop</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">玩家反复做的最小动作圈，整个游戏的骨架</text><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="180" x="80" y="110" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="170" y="145">行动</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="170" y="175">捡起、投掷、触碰</text><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="180" x="340" y="110" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="430" y="145">反馈</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="430" y="175">得分、音效、变化</text><rect fill="#2b2b2b" height="130" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="180" x="600" y="110" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="690" y="145">推进</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="690" y="175">解锁、升级、下一关</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="268" x2="332" y1="172" y2="172" /><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="528" x2="592" y1="172" y2="172" /><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="690" x2="170" y1="252" y2="252" /><text fill="#bbbbbb" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="430" y="244">循环回到行动</text><rect fill="#1a1a1a" height="80" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="280" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="130" y="310">例：扔飞镖  →  命中+分数+音效  →  解锁新飞镖  →  再扔</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="338">小游戏只用 1 个循环就够；循环越顺，游戏越好玩</text></svg>