<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker></defs><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">同步变量工作原理</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">owner 修改 → 数据发送到网络 → 其他客户端收到并覆盖本地值</text><rect fill="#2b2b2b" height="190" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="240" x="60" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="180" y="125">① owner 修改</text><rect fill="#1a1a1a" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="85" y="140" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="180" y="164">score = 10;</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="180" y="192">只有 owner 有资格写</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="180" y="212">非 owner 改了会丢/被纠正</text><rect fill="#2b2b2b" height="190" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="240" x="330" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="450" y="125">② 网络发送</text><ellipse cx="450" cy="160" fill="#1a1a1a" opacity="1.0" rx="62" ry="34" stroke="#6bcf7f" stroke-width="1.5" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="166">同步网络</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="218">VRChat 服务器转发</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="450" y="240">自动进行，不用写代码</text><rect fill="#2b2b2b" height="190" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="240" x="600" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="720" y="125">③ 其他端接收</text><rect fill="#1a1a1a" height="56" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="190" x="625" y="140" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="720" y="164">score = 10;</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="720" y="192">本地值被新数据覆盖</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="720" y="212">OnDeserialization() 触发</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="308" x2="322" y1="190" y2="190" /><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="578" x2="592" y1="190" y2="190" /><rect fill="#1a1a1a" height="100" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="315" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="130" y="345">关键规则：谁改谁负责</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="372">① 只有 owner 改同步变量，其他人改会被服务器纠正  ② 收到数据后不要马上再改回去，会死循环</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="396">③ 想显示最新值：在 OnDeserialization() 里更新 UI / 播放反馈</text></svg>