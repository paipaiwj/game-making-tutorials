<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">同步计分板完整结构</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">一个 owner 写分，所有端显示，音效全网广播 —— 数据一致，动作一次</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="120" y="92">每个玩家的按钮</text><rect fill="#2b2b2b" height="56" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="200" x="60" y="102" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="160" y="126">玩家1 的按钮 +1</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="160" y="146">Interact → AddScore</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="268" x2="292" y1="130" y2="130" /><rect fill="#2b2b2b" height="56" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="200" x="60" y="172" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="160" y="196">玩家2 的按钮 +1</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="160" y="216">Interact → AddScore</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="268" x2="292" y1="200" y2="200" /><rect fill="#2b2b2b" height="56" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="200" x="60" y="242" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="160" y="266">玩家3 的按钮 +1</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="160" y="286">Interact → AddScore</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="268" x2="292" y1="270" y2="270" /><rect fill="#2b2b2b" height="250" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="300" x="300" y="132" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="450" y="162">GameManagerComponent</text><rect fill="#1a1a1a" height="40" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="250" x="325" y="182" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="207">[UdonSynced] score</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="252">AddScore()：owner 才加分</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="276">OnDeserialization：刷新所有计分板</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="450" y="300">发送 PlayScore 事件全网广播</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="450" y="332">（放在房间中任意一个物体上）</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="450" y="356">是同步的「核心」，其他端都听它的</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="start" x="670" y="92">每个玩家的显示端</text><rect fill="#2b2b2b" height="56" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="230" x="610" y="102" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="725" y="126">计分板 UI</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="725" y="146">读 score 显示 / 收事件播放</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="608" x2="584" y1="130" y2="130" /><rect fill="#2b2b2b" height="56" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="230" x="610" y="172" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="725" y="196">音效播放器</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="725" y="216">读 score 显示 / 收事件播放</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="608" x2="584" y1="200" y2="200" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="585" y="116">变量同步</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="585" y="188">事件广播</text><rect fill="#1a1a1a" height="56" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="400" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="436">原则：分数只在一处算（owner），其他地方只读 —— 这是多人数据一致性的核心</text></svg>