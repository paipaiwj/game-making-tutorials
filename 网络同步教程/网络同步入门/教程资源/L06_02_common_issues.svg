<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620px" version="1.1" viewBox="0 0 900 620" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="620" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">网络同步常见问题对照表</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="60" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="92">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="245" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="330" y="92">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="560" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="645" y="92">解决办法</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="104" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="140">别人看不到我改的分</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="104" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="140">变量没加 [UdonSynced]</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="104" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="140">加 [UdonSynced] 属性</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="180" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="216">非 owner 改了没反应</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="180" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="216">只有 owner 能写</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="180" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="216">先 RequestOwnership 再改</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="256" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="292">新玩家没有分数状态</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="256" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="292">事件不重放</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="256" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="292">用同步变量存状态</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="332" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="368">分数每个人不一样</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="332" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="368">各端各算分数</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="332" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="368">统一由 owner 算分</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="408" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="444">改分后 UI 不刷新</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="408" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="444">没写 OnDeserialization</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="408" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="444">在回调里更新 UI</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="484" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="520">拿东西权限冲突</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="484" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="395" y="520">所有权没转移</text><rect fill="#2b2b2b" height="66" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="484" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="715" y="520">加 VRC_ObjectSync 组件</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="612">调试心法：先问「谁是 owner？」再看「变量加没加 [UdonSynced]」</text></svg>