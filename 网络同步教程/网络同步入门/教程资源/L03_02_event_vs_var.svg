<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="470px" version="1.1" viewBox="0 0 900 470" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="470" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">同步事件 vs 同步变量 —— 怎么选？</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="780" x="60" y="75" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="150" y="97">对比项</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="415" y="97">同步变量 [UdonSynced]</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="700" y="97">同步事件 NetworkEvent</text><rect fill="#1a1a1a" height="46" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="109" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="137">传什么</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="415" y="137">数据（分数/开关/状态）</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="137">一个方法名（通知）</text><rect fill="#1a1a1a" height="46" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="165" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="193">典型用途</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="415" y="193">分数、状态、开关</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="193">音效、特效、动画</text><rect fill="#1a1a1a" height="46" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="221" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="249">谁修改/发起</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="415" y="249">只有 owner 能写</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="249">任何玩家都能发</text><rect fill="#1a1a1a" height="46" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="277" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="305">收端如何感知</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="415" y="305">OnDeserialization 回调</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="305">直接调用该方法</text><rect fill="#1a1a1a" height="46" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="333" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="361">新玩家加入</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="415" y="361">变量会同步给新玩家</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="361">不重放，会漏掉</text><rect fill="#1a1a1a" height="46" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="389" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="150" y="417">能不能带参数</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="415" y="417">天然带数据</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="700" y="417">不能带，靠变量传参</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="452">一句话选择：要「新玩家也能拿到现状」→ 用变量；只想「动作播一次」→ 用事件</text></svg>