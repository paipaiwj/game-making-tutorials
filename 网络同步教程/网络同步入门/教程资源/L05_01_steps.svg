<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#c084fc" /></marker></defs><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">实战：多人同步计分小游戏</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">目标：每端一个按钮 +1，所有人看到同一个分数 —— 覆盖变量同步 + 网络事件</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="156" x="32" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="110" y="118">1. 建组件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="110" y="146">GameManagerComponent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="110" y="166">负责同步变量</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="190" x2="200" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="156" x="202" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="280" y="118">2. 写同步变量</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="146">[UdonSynced] score</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="166">OnDeserialization</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="360" x2="370" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="372" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="450" y="118">3. 写加分逻辑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="146">按钮 → AddScore</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="166">owner 检查</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="530" x2="540" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="156" x="542" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="620" y="118">4. 广播事件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="146">播放音效</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="166">SendCustomNetworkEvent</text><line marker-end="url(#arrowhead)" stroke="#c084fc" stroke-width="2" x1="700" x2="710" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="712" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="790" y="118">5. 联机测试</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="790" y="146">两人进世界</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="790" y="166">比分实时同步</text><rect fill="#1a1a1a" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="320" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="130" y="350">核心思路：一个组件管同步（GameManager），UI 只负责读和显示</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="376">按钮触发 → SignalSender 路由 → GameManager 加分 → OnDeserialization 刷新所有计分板</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="398">所有玩家点自己的按钮，但只有 owner 那个组件真正改分数 —— 别各算各的</text></svg>