<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="440px" version="1.1" viewBox="0 0 900 440" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="440" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">RequestOwnership() 请求所有权流程</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="64">想让别的玩家拥有同步变量？发起请求，等服务器裁决后 OnOwnershipTransferred 通知</text><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="190" x="31" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="126" y="128">1. 请求</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="126" y="156">SendCustomNetworkEvent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="126" y="176">("RequestOwnership")</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="223" x2="245" y1="175" y2="175" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="190" x="247" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="342" y="128">2. 服务器裁决</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="342" y="156">VRChat 服务器判定</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="342" y="176">可否转移</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="439" x2="461" y1="175" y2="175" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="190" x="463" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="558" y="128">3. 所有权转移</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="558" y="156">OnOwnershipTransferred()</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="558" y="176">被调用通知全端</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2.5" x1="655" x2="677" y1="175" y2="175" /><rect fill="#2b2b2b" height="150" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="190" x="679" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="774" y="128">4. 获得权限</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="774" y="156">新 owner 可以修改</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="middle" x="774" y="176">同步变量了</text><rect fill="#1a1a1a" height="100" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="290" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="130" y="320">为什么需要 VRC_ObjectSync？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="348">① 让物体位置/旋转也能同步  ② 物体被拿起时自动把所有权交给拿它的人</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="130" y="372">注意：所有权转移不是立刻生效 —— 等回调确认后才好放心写数据</text></svg>