右</text><rect fill="#2a2a2a" height="60" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="340" x="500" y="380" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="670" y="412">VRChat 里玩家转头，声音会跟着变 → 世界真实感的核心</text></svg>