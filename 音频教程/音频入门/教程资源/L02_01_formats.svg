<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">音频文件格式怎么选</text><rect fill="#2b2b2b" height="230" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="250" x="45" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17px" font-weight="bold" text-anchor="middle" x="170" y="112">WAV</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="170" y="136">无损，巨大</text><line stroke="#3a3a3a" stroke-width="1" x1="65" x2="275" y1="150" y2="150" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="170" y="176">音效、UI 点击</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="170" y="196">（短而精，几十 KB~几 MB）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="170" y="216">Unity 首选</text><rect fill="#2b2b2b" height="230" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="250" x="325" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17px" font-weight="bold" text-anchor="middle" x="450" y="112">MP3</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="136">有损压缩</text><line stroke="#3a3a3a" stroke-width="1" x1="345" x2="555" y1="150" y2="150" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="176">音乐、长对白</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="196">（小，兼容性好）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="216">VRChat 推荐</text><rect fill="#2b2b2b" height="230" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="250" x="605" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17px" font-weight="bold" text-anchor="middle" x="730" y="112">OGG</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="730" y="136">有损压缩</text><line stroke="#3a3a3a" stroke-width="1" x1="625" x2="835" y1="150" y2="150" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="730" y="176">音乐、环境音</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="730" y="196">（小，流式播放友好）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="730" y="216">VRChat 推荐</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="400">音频会先被 Unity 转成 AudioClip（.meta 里记录导入设置），VRChat 上传时还会再转码</text></svg>