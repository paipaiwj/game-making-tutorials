<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">Unity 音频两大组件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="62">AudioListener（耳朵）+ AudioSource（声源）—— 声音从源传到听者</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="330" x="80" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="245" y="128">Audio Source（声源）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="245" y="156">挂在「发声」的物体上</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="245" y="176">AudioClip：要播的音频文件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="245" y="196">Volume / Pitch：音量 / 音高</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="245" y="216">3D：距离越远越小声</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="245" y="236">Loop：循环播放（音乐、环境音）</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="330" x="490" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="655" y="128">Audio Listener（听者）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="655" y="156">全场景只能有一个！</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="655" y="176">挂在玩家 / 相机上</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="655" y="196">负责「听」所有声音</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="655" y="216">VRChat 里挂玩家身上</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="655" y="236">两个 Listener = 报错</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="3" x1="420" x2="480" y1="185" y2="185" /><rect fill="#1a1a1a" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="740" x="80" y="300" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="110" y="328">工作流程</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="110" y="354">声源（篝火）→ 声音按 3D 规则衰减传播 → 玩家身上的听者收到 → 混音器 → 扬声器/耳机</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="110" y="378">世界里有 100 个声源也没关系，没有听者就全都不响（反之亦然）</text></svg>