<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 900 540" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="540" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">常见问题对照表</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="60" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="145" y="92">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="245" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="330" y="92">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="170" x="560" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="645" y="92">解决办法</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="104" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="138">没有声音</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="104" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="128">听者缺失 / 声源音量 0</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="146">/ 没勾 Play On Awake</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="104" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="715" y="128">检查 AudioListener</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="715" y="146">检查音量与 3D 距离</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="174" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="208">两个 Listener 报错</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="174" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="198">场景里挂了两份听者</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="216">（如相机 + 玩家各一个）</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="174" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="715" y="198">只留一个</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="244" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="278">声音太远听不见</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="244" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="268">3D 衰减半径太小</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="244" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="715" y="268">拉大 Min/Max Distance</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="314" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="348">声音发闷/破音</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="314" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="338">音量超过 0dB 爆音</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="356">文件质量太低</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="314" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="715" y="338">调总线音量</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="715" y="356">换高质量音频源</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="384" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="418">只有自己听到</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="384" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="408">用了本地 Play()</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="384" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="715" y="408">改 SendCustomNetworkEvent</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="170" x="60" y="454" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="145" y="488">音乐一直停不下来</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="245" y="454" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="395" y="478">没做 Stop/条件控制</text><rect fill="#2b2b2b" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="310" x="560" y="454" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="715" y="478">Udon 里加 Stop()</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="520">调试：Scene 视图选中声源可看到衰减圈；用 AudioMixer 看各总线是否在响</text></svg>