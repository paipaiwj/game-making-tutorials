 Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="406">音乐作品一般压到 -14 ~ -16 LUFS；0 dBFS 以上会爆音（clipping）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="490">记住：dB 是对数的！「音量滑块」别直接当 dB 用，Unity 里用 AudioMixer 换算</text></svg>