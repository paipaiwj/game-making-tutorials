<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 900 520" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="520" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">Audio Mixer：总线混音</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="62">所有声音先进「总线」，再汇入 Master —— 调分组音量，不一个个调</text><rect fill="#3a3a3a" height="54" rx="8" ry="6" stroke="#ffffff" stroke-width="2" width="200" x="350" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="450" y="124">Master（总输出）</text><rect fill="#2b2b2b" height="120" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="156" x="32" y="230" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="110" y="258">Music 音乐</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="110" y="284">BGM、主题曲</text><line opacity="0.7" stroke="#4ea1ff" stroke-width="2" x1="110" x2="450" y1="210" y2="144" /><rect fill="#2b2b2b" height="120" rx="8" ry="6" stroke="#6bcf7f" stroke-width="2" width="156" x="202" y="230" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="280" y="258">SFX 音效</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="284">点击、交互、技能</text><line opacity="0.7" stroke="#6bcf7f" stroke-width="2" x1="280" x2="450" y1="210" y2="144" /><rect fill="#2b2b2b" height="120" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="372" y="230" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="450" y="258">Ambience 环境</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="284">风、水、鸟鸣</text><line opacity="0.7" stroke="#ff9e4e" stroke-width="2" x1="450" x2="450" y1="210" y2="144" /><rect fill="#2b2b2b" height="120" rx="8" ry="6" stroke="#c084fc" stroke-width="2" width="156" x="542" y="230" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="620" y="258">UI 界面</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="284">按钮、提示音</text><line opacity="0.7" stroke="#c084fc" stroke-width="2" x1="620" x2="450" y1="210" y2="144" /><rect fill="#2b2b2b" height="120" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="712" y="230" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="790" y="258">Voice 语音</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="790" y="284">对白、旁白</text><line opacity="0.7" stroke="#ff9e4e" stroke-width="2" x1="790" x2="450" y1="210" y2="144" /><ellipse cx="450" cy="144" fill="#ffffff" opacity="0.7" rx="5" ry="5" stroke="none" stroke-width="1.0" /><rect fill="#2b2b2b" height="110" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="380" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="90" y="410">为什么用总线？</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="438">① 玩家想「关音乐」→ 一个开关关 Music 总线，不用动几百个音源</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="462">② 音量是 dB 单位：-6dB ≈ 响度减半；总线音量 = 分组音量，永不单独调每个 AudioClip</text></svg>