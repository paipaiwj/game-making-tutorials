<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#c084fc" /></marker></defs><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">动手：做一个篝火环境音</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="156" x="32" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="110" y="118">1. 备音频</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="110" y="146">网上找/自己录</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="110" y="166">篝火噼啪声（短循环）</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="190" x2="200" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="156" x="202" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="280" y="118">2. 导入设置</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="146">Loop 循环勾上</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="280" y="166">Decompress + Vorbis</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="360" x2="370" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="372" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="450" y="118">3. 挂声源</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="146">场景放空物体</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="450" y="166">挂 AudioSource</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="530" x2="540" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="156" x="542" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="620" y="118">4. 3D 衰减</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="146">勾 3D，调曲线</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="620" y="166">半径 10~15m</text><line marker-end="url(#arrowhead)" stroke="#c084fc" stroke-width="2" x1="700" x2="710" y1="190" y2="190" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="156" x="712" y="90" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="790" y="118">5. 接总线</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="790" y="146">Audio Mixer 建</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="790" y="166">Ambience 总线</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="350">同理可以扩展：瀑布（白噪音）、风（低频）、鸟鸣（高频点缀）</text><rect fill="#1a1a1a" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="500" x="200" y="380" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="410">3 层声音叠起来：近处篝火 + 远处瀑布 + 头顶鸟鸣 = 沉浸感</text></svg>