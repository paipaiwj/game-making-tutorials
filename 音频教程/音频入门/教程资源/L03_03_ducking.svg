<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="420px" version="1.1" viewBox="0 0 900 420" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="420" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">Ducking：音乐自动给对白让路</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="62">说话时背景音乐自动压低，说完恢复 —— 用侧链压缩器实现</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="120" y="100">Voice 总线（触发）</text><rect fill="#1a1a1a" height="60" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="780" x="60" y="112" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="110" y="150">对白开始</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="420" y="150">对白进行中</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="730" y="150">对白结束</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="120" y="210">Music 总线（被压）</text><rect fill="#1a1a1a" height="92" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="780" x="60" y="222" /><polyline fill="none" points="80,258 230,258 250,290 560,290 580,258 820,258" stroke="#4ea1ff" stroke-width="3" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="105" y="246">正常音量 0dB</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="400" y="246">压低到 -12dB</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="690" y="246">恢复</text><rect fill="#2b2b2b" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="330" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="358">参数建议：Threshold -30dB（触发线）  Ratio 8:1（压多狠）  Attack 10ms（快速让开）  Release 300~500ms（平滑恢复）</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="394">在 Music 总线挂 Compressor，Sidechain 选 Voice 总线即可</text></svg>