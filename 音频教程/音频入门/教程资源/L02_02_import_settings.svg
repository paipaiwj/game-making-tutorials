<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 900 500" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="500" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">导入设置（Inspector 里选音频文件时）</text><rect fill="#2b2b2b" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="80" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="190" x="75" y="88" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="170" y="111">Load Type</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="290" y="111">Decompress On Load：短音效，加载时解压，占内存小播放快</text><rect fill="#2b2b2b" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="142" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="190" x="75" y="150" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="170" y="173">Load Type</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="290" y="173">Streaming：长音乐/环境音，边播边读，省内存</text><rect fill="#2b2b2b" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="204" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="190" x="75" y="212" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="170" y="235">Compression Format</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="290" y="235">Vorbis（OGG 压缩）：推荐，体积小质量好</text><rect fill="#2b2b2b" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="266" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="190" x="75" y="274" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="170" y="297">Quality</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="290" y="297">音乐 60~80，音效 90+，质量越高文件越大</text><rect fill="#2b2b2b" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="328" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#ffcc66" stroke-width="1.5" width="190" x="75" y="336" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="170" y="359">Sample Rate</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="290" y="359">44100 / 48000 都行，别用 96000（白占体积）</text><rect fill="#2b2b2b" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="390" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#c084fc" stroke-width="1.5" width="190" x="75" y="398" /><text fill="#c084fc" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="170" y="421">Force To Mono</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="290" y="421">3D 音效可勾选，体积减半；音乐不要勾</text><rect fill="#1a1a1a" height="50" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="398" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="middle" x="450" y="429">经验：短音效用 Decompress + 高质量；音乐/环境音用 Streaming + Vorbis 60~80</text></svg>