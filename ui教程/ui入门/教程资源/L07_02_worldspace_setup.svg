<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 900 500" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker></defs><rect fill="#1e1e1e" height="500" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">设置 World Space Canvas — 4 个关键步骤</text><rect fill="#2b2b2b" height="390" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="380" x="40" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="230" y="94">Inspector — Canvas</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="125">Render Mode</text><rect fill="#1a1a2e" height="32" rx="5" ry="6" stroke="#6bcf7f" stroke-width="2" width="348" x="56" y="132" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="68" y="154">World Space  ▼</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="180">Event Camera</text><rect fill="#252530" height="28" rx="4" ry="6" stroke="#ff9e4e" stroke-width="1" width="348" x="56" y="186" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="206">Main Camera（拖入）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="224">Width</text><rect fill="#252530" height="28" rx="4" ry="6" stroke="#4ea1ff" stroke-width="1" width="348" x="56" y="230" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="250">2（世界单位：米）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="268">Height</text><rect fill="#252530" height="28" rx="4" ry="6" stroke="#4ea1ff" stroke-width="1" width="348" x="56" y="274" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="294">1</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="312">Dynamic Pixels Per Unit</text><rect fill="#252530" height="28" rx="4" ry="6" stroke="#6bcf7f" stroke-width="1" width="348" x="56" y="318" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="338">10（清晰度）</text><rect fill="#2b2b2b" height="390" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="410" x="450" y="70" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="655" y="92">Scene 视图 — 3D 世界中的 Canvas</text><line stroke="#3a3a3a" stroke-width="1.5" x1="470" x2="840" y1="400" y2="400" /><line stroke="#3a3a3a" stroke-width="1" x1="480" x2="490" y1="390" y2="400" /><line stroke="#3a3a3a" stroke-width="1" x1="500" x2="510" y1="380" y2="400" /><rect fill="#1a2e1a" height="120" rx="6" ry="6" stroke="#6bcf7f" stroke-width="3" width="200" x="555" y="180" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18px" font-weight="bold" text-anchor="middle" x="655" y="240">Canvas</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="655" y="265">欢迎来到我的世界！</text><rect fill="#4ea1ff" height="20" rx="4" ry="6" stroke="none" stroke-width="1.5" width="80" x="615" y="275" /><text fill="#1e1e1e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="655" y="289">点击我</text><line stroke="#4ea1ff" stroke-width="2" x1="555" x2="755" y1="330" y2="330" /><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="1.5" x1="555" x2="555" y1="330" y2="305" /><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="1.5" x1="755" x2="755" y1="330" y2="305" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="655" y="348">Width = 2 米</text><ellipse cx="805" cy="300" fill="#ff9e4e" opacity="1.0" rx="10" ry="10" stroke="none" stroke-width="1.0" /><line stroke="#ff9e4e" stroke-width="2.5" x1="805" x2="805" y1="310" y2="335" /><line stroke="#ff9e4e" stroke-width="2" x1="805" x2="797" y1="318" y2="328" /><line stroke="#ff9e4e" stroke-width="2" x1="805" x2="813" y1="318" y2="328" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="805" y="348">玩家</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="450" y="475">核心理解：World Space 的 Width/Height 单位是米（世界单位），不是像素</text></svg>