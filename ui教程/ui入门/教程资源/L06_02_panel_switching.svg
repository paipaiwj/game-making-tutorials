<svg baseProfile="full" height="380px" version="1.1" viewBox="0 0 900 380" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="380" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">面板切换机制</text><rect fill="#1a1a2e" height="160" rx="12" ry="6" stroke="#4ea1ff" stroke-width="3" width="260" x="80" y="110" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18px" font-weight="bold" text-anchor="middle" x="210" y="145">LoginPanel</text><rect fill="#6bcf7f" height="30" opacity="0.9" rx="4" ry="6" stroke="none" stroke-width="1.5" width="180" x="120" y="165" /><text fill="#1e1e1e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="210" y="186">SetActive(true)</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="60" x="105" y="210" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="135" y="226">Input</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="55" x="175" y="210" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="202" y="226">Button</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="55" x="240" y="210" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="267" y="226">Text</text><rect fill="#1a1a2e" height="160" opacity="0.6" rx="12" ry="6" stroke="#6bcf7f" stroke-width="3" width="260" x="560" y="110" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18px" font-weight="bold" text-anchor="middle" x="690" y="145">MainPanel</text><rect fill="#6e6e6e" height="30" opacity="0.7" rx="4" ry="6" stroke="none" stroke-width="1.5" width="180" x="600" y="165" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="690" y="186">SetActive(false)</text><rect fill="#252530" height="22" opacity="0.5" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="56" x="610" y="210" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="638" y="226">Text</text><rect fill="#252530" height="22" opacity="0.5" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="56" x="662" y="210" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="690" y="226">Button</text><rect fill="#252530" height="22" opacity="0.5" rx="4" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="56" x="714" y="210" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="742" y="226">Button</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="350" x2="550" y1="190" y2="190" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="450" y="178">登录成功 → SetActive 切换</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2.5" x1="550" x2="350" y1="240" y2="240" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="265">退出登录 → 回到登录面板</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="340">核心原则：同一时间只有 1 个 Panel 的 SetActive 为 true</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="360">Unity 不会自动管理面板显示 — 你需要用脚本控制 GameObject.SetActive(bool)</text></svg>