<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 950 480" width="950px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="480" width="950" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="475" y="34">常见错误排查</text><rect fill="#333" height="36" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="890" x="30" y="70" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="120" y="94">现象</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="335" y="94">可能原因</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="600" y="94">解决方法</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="830" y="94">相关章节</text><rect fill="#252530" height="42" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="890" x="30" y="106" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="120" y="133">按钮点了没反应</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="210" x2="210" y1="112" y2="142" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="335" y="133">没有 EventSystem</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="460" x2="460" y1="112" y2="142" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="470" y="133">创建 Canvas 时自动生成，别删</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="740" x2="740" y1="112" y2="142" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="750" y="133">第3章</text><rect fill="#2a2a38" height="42" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="890" x="30" y="148" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="120" y="175">UI 显示不出来</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="210" x2="210" y1="154" y2="184" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="335" y="175">不在 Canvas 子级下</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="460" x2="460" y1="154" y2="184" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="470" y="175">拖到 Canvas 下面</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="740" x2="740" y1="154" y2="184" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="750" y="175">第1章</text><rect fill="#252530" height="42" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="890" x="30" y="190" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="120" y="217">World Space UI 点不了</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="210" x2="210" y1="196" y2="226" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="335" y="217">没加 VRC Ui Shape</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="460" x2="460" y1="196" y2="226" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="470" y="217">Add Component → VRC Ui Shape</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="740" x2="740" y1="196" y2="226" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="750" y="217">第8章</text><rect fill="#2a2a38" height="42" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="890" x="30" y="232" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="120" y="259">文字模糊</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="210" x2="210" y1="238" y2="268" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="335" y="259">用了 Legacy Text</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="460" x2="460" y1="238" y2="268" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="470" y="259">换成 TextMeshPro</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="740" x2="740" y1="238" y2="268" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="750" y="259">第2章</text><rect fill="#252530" height="42" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="890" x="30" y="274" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="120" y="301">弹窗被挡住</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="210" x2="210" y1="280" y2="310" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="335" y="301">Sort Order 不够高</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="460" x2="460" y1="280" y2="310" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="470" y="301">嵌套 Canvas，设更高 Sort Order</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="740" x2="740" y1="280" y2="310" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="750" y="301">第11章</text><rect fill="#2a2a38" height="42" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="890" x="30" y="316" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="120" y="343">TMP 报错</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="210" x2="210" y1="322" y2="352" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="335" y="343">没导入 TMP Essentials</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="460" x2="460" y1="322" y2="352" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="470" y="343">Window → TextMeshPro → Import</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="740" x2="740" y1="322" y2="352" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="750" y="343">第2章</text><rect fill="#252530" height="42" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="890" x="30" y="358" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="120" y="385">Canvas 太大/太小</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="210" x2="210" y1="364" y2="394" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="335" y="385">World Space 尺寸不对</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="460" x2="460" y1="364" y2="394" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="470" y="385">Width/Height 设米为单位的值</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="740" x2="740" y1="364" y2="394" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="750" y="385">第7章</text></svg>