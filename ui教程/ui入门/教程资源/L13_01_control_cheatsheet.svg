, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="100" y="426">Scroll View</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="170" x2="170" y1="402" y2="438" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="270" y="426">UI → Scroll View</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="370" x2="370" y1="402" y2="438" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="480" y="426">ScrollRect+Mask</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="590" x2="590" y1="402" y2="438" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="426">OnValueChanged(Vector2)</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="770" x2="770" y1="402" y2="438" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="780" y="426">Content &gt; Viewport 才可滚动</text></svg>