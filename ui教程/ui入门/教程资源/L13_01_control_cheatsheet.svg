dth="0.3" x1="770" x2="770" y1="162" y2="198" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="780" y="186">OnClick→SendCustomEvent</text><rect fill="#252530" height="48" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="940" x="30" y="204" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="100" y="234">Image</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="170" x2="170" y1="210" y2="246" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="270" y="234">UI → Image</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="370" x2="370" y1="210" y2="246" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="480" y="234">Image</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="590" x2="590" y1="210" y2="246" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="234">—</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="770" x2="770" y1="210" y2="246" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="780" y="234">做面板背景</text><rect fill="#2a2a38" height="48" rx="0" ry="6" stroke="#3a3a3a" stroke-width="0.5" width="940" x="30" y="252" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="100" y="282">Slider</text><line opacity="0.3" stroke="#3a3a3a" stroke-width="0.3" x1="170" x2="170" y1="258" y2="294" /><text fi