<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">弹窗的标准搭建模板</text><rect fill="#000" height="350" opacity="0.5" rx="10" ry="6" stroke="none" stroke-width="1.5" width="400" x="60" y="70" /><rect fill="#1a1a2e" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="3" width="280" x="120" y="150" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="18px" font-weight="bold" text-anchor="middle" x="260" y="180">提示</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="260" y="220">确定要删除这条记录吗？</text><rect fill="#252530" height="36" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="90" x="150" y="280" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="195" y="304">取消</text><rect fill="#ff9e4e" height="36" rx="6" ry="6" stroke="none" stroke-width="1.5" width="90" x="280" y="280" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="325" y="304">确定</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="670" y="70">搭建步骤</text><rect fill="#252530" height="54" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="360" x="500" y="100" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="516" y="118">① 创建 PopupPanel (Image)</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="516" y="138">半透明黑色遮罩，初始 SetActive(false)</text><rect fill="#252530" height="54" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="360" x="500" y="164" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="516" y="182">② 给 PopupPanel 加 Canvas 组件</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="516" y="202">Sort Order 设 10，盖住主界面</text><rect fill="#252530" height="54" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="360" x="500" y="228" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="516" y="246">③ 在 PopupPanel 下创建 DialogBox</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="516" y="266">弹窗本体，白色/深色背景</text><rect fill="#252530" height="54" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="360" x="500" y="292" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="516" y="310">④ DialogBox 里放内容</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="516" y="330">标题、文字、取消/确定按钮</text><rect fill="#252530" height="54" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="360" x="500" y="356" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="516" y="374">⑤ 按钮 OnClick 控制 SetActive</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="516" y="394">显示/隐藏弹窗</text></svg>