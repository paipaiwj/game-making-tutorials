<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620px" version="1.1" viewBox="0 0 960 620" width="960px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="620" width="960" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="480" y="34">LoginManager.cs 脚本结构</text><rect fill="#2b2b2b" height="200" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="310" x="40" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="195" y="92">public 字段（Inspector 拖拽赋值）</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="0.8" width="286" x="52" y="118" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="58" y="134">GameObject loginPanel</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="260" y="134">登录面板</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="0.8" width="286" x="52" y="144" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="58" y="160">GameObject mainPanel</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="260" y="160">主面板</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="0.8" width="286" x="52" y="170" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="58" y="186">TMP_InputField usernameInput</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="260" y="186">用户名输入</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="0.8" width="286" x="52" y="196" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="58" y="212">TMP_InputField passwordInput</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="260" y="212">密码输入</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="0.8" width="286" x="52" y="222" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="58" y="238">TMP_Text errorText</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="260" y="238">错误提示</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#3a3a3a" stroke-width="0.8" width="286" x="52" y="248" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="58" y="264">TMP_Text welcomeText</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="end" x="260" y="264">欢迎文字</text><rect fill="#2b2b2b" height="510" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="540" x="380" y="70" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="650" y="92">public 方法（Button OnClick 绑定）</text><rect fill="#1a1a2e" height="210" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="510" x="395" y="120" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="410" y="142">OnLoginClicked()</text><rect fill="#252530" height="26" rx="4" ry="6" stroke="#dddddd" stroke-width="1" width="470" x="415" y="165" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="425" y="183">获取输入</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="540" y="183">username / password</text><rect fill="#252530" height="26" rx="4" ry="6" stroke="#ffcc66" stroke-width="1" width="470" x="415" y="195" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="425" y="213">判空检查</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="540" y="213">string.IsNullOrEmpty ?</text><rect fill="#252530" height="26" rx="4" ry="6" stroke="#4ea1ff" stroke-width="1" width="470" x="415" y="225" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="425" y="243">验证账号</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="540" y="243">admin / 123456 ?</text><rect fill="#252530" height="26" rx="4" ry="6" stroke="#6bcf7f" stroke-width="1" width="470" x="415" y="255" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="425" y="273">LoginSuccess</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="540" y="273">切换面板 + 显示欢迎</text><rect fill="#252530" height="26" rx="4" ry="6" stroke="#ff9e4e" stroke-width="1" width="470" x="415" y="285" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="425" y="303">ShowError</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="540" y="303">显示错误提示文字</text><rect fill="#1a2e1a" height="100" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="510" x="395" y="345" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="410" y="367">OnLogoutClicked()</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#6bcf7f" stroke-width="0.8" width="470" x="415" y="388" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="start" x="425" y="404">隐藏 MainPanel</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="540" y="404">SetActive(false)</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#4ea1ff" stroke-width="0.8" width="470" x="415" y="414" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="start" x="425" y="430">显示 LoginPanel</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="540" y="430">SetActive(true)</text><rect fill="#252530" height="22" rx="4" ry="6" stroke="#9aa0a6" stroke-width="0.8" width="470" x="415" y="440" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="start" x="425" y="456">清空输入框</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="540" y="456">usernameInput.text = ""</text><rect fill="#2a2a20" height="90" rx="6" ry="6" stroke="#ffcc66" stroke-width="1" width="510" x="395" y="470" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="410" y="494">💡 public 字段在 Inspector 可见，拖拽 GameObject 即可赋值</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="410" y="516">💡 OnClick 事件绑定 public 方法（无参 void 方法）</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="410" y="538">💡 一个 GameManager 脚本管理所有 UI 逻辑，保持简洁</text></svg>