<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">Sort Order — 渲染层级规则</text><rect fill="#1a1a2e" height="70" opacity="0.9" rx="8" ry="6" stroke="#ff9e4e" stroke-width="2" width="740" x="80" y="80" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="100" y="105">Sort Order: 20+</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="300" y="105">最高优先级</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="100" y="132">用途：加载遮罩、系统弹窗</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="50" y="105">⬆ 前</text><rect fill="#1a1a2e" height="70" opacity="0.75" rx="8" ry="6" stroke="#6bcf7f" stroke-width="2" width="740" x="80" y="158" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="100" y="183">Sort Order: 10-19</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="300" y="183">弹窗/对话框</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="100" y="210">用途：确认框、设置面板</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="50" y="183">⬆ 前</text><rect fill="#1a1a2e" height="70" opacity="0.6" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="740" x="80" y="236" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="100" y="261">Sort Order: 1-9</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="300" y="261">普通弹出层</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="100" y="288">用途：工具提示、下拉菜单</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="50" y="261">⬆ 前</text><rect fill="#1a1a2e" height="70" opacity="0.45" rx="8" ry="6" stroke="#9aa0a6" stroke-width="2" width="740" x="80" y="314" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="100" y="339">Sort Order: 0</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="normal" text-anchor="start" x="300" y="339">主界面</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="100" y="366">用途：默认层级</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="middle" x="50" y="339">⬆ 前</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="435">💡 数值越大越靠前渲染。每个嵌套 Canvas 产生一次额外 Draw Call，只在需要控制层级的容器上加。</text></svg>