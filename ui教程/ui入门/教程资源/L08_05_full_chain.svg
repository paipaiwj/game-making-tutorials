<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 900 520" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="520" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">完整组件链 — 一个可交互 VRC UI 需要的所有组件</text><rect fill="#2b2b2b" height="410" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="280" x="30" y="70" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="170" y="92">Hierarchy</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="46" y="120">Canvas (World Space)</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="62" y="148">  [VRC Ui Shape]</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="62" y="176">  [Udon Behaviour]</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="62" y="204">  [Graphic Raycaster]</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="62" y="232">  ▼ LoginButton</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="78" y="260">    [Image]</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="78" y="288">    [Button]</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="78" y="316">    └ Text</text><rect fill="#2b2b2b" height="410" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="530" x="340" y="70" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="605" y="92">每个组件的作用</text><rect fill="#252530" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="498" x="356" y="120" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="366" y="138">VRC Ui Shape</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="366" y="156">定义可点击的碰撞区域</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="366" y="172">没有它 = VRChat 里 UI 是"装饰画"</text><rect fill="#252530" height="60" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="498" x="356" y="190" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="366" y="208">Udon Behaviour</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="366" y="226">挂载 UdonSharp 脚本</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="366" y="242">public 变量在 Inspector 拖拽赋值</text><rect fill="#252530" height="60" rx="6" ry="6" stroke="#9aa0a6" stroke-width="1.5" width="498" x="356" y="260" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="366" y="278">Graphic Raycaster</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="366" y="296">检测射线命中哪个 UI 元素</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="366" y="312">通常创建 Canvas 时自动添加</text><rect fill="#252530" height="60" rx="6" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="498" x="356" y="330" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="366" y="348">Button</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="366" y="366">Unity 侧的按钮逻辑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="366" y="382">OnClick 事件 → SendCustomEvent</text><rect fill="#252530" height="60" rx="6" ry="6" stroke="#9aa0a6" stroke-width="1.5" width="498" x="356" y="400" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="366" y="418">Image</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="366" y="436">按钮的外观/背景</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="366" y="452">可替换 Source Image 改样式</text></svg>