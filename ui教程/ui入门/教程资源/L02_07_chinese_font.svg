<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 950 520" width="950px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="520" width="950" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="475" y="34">TextMeshPro 中文字体设置</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-style="italic" font-weight="normal" text-anchor="middle" x="475" y="60">默认字体不含中文 → 中文变成 □ → 需要生成中文字体 Atlas</text><rect fill="#2a1a1a" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="400" x="40" y="85" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="240" y="109">❌ 问题：默认字体无中文</text><rect fill="#1e1e1e" height="60" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="320" x="80" y="135" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="240" y="155">Hello World</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="normal" text-anchor="middle" x="240" y="180">你好世界 → □□□</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="240" y="220">LiberationSans 只有英文/数字/符号</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="240" y="240">缺少中文字形(CJK)，显示为方块 □</text><rect fill="#2b2b2b" height="400" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="440" x="470" y="85" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="690" y="107">Font Asset Creator 配置</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="690" y="129">Window → TextMeshPro → Font Asset Creator</text><rect fill="#252530" height="38" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1" width="408" x="486" y="150" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="494" y="166">Font Source</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="670" y="166">C:\Windows\Fonts\msyh.ttc</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="start" x="494" y="182">微软雅黑（系统自带）</text><rect fill="#252530" height="38" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1" width="408" x="486" y="194" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="494" y="210">Sampling Point Size</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="670" y="210">36</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="start" x="494" y="226">字号越大越清晰</text><rect fill="#252530" height="38" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1" width="408" x="486" y="238" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="494" y="254">Padding</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="670" y="254">5</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="start" x="494" y="270">字符间距</text><rect fill="#252530" height="38" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1" width="408" x="486" y="282" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="494" y="298">Packing Method</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="670" y="298">Optimum</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="start" x="494" y="314">最优打包</text><rect fill="#252530" height="38" rx="5" ry="6" stroke="#6bcf7f" stroke-width="1" width="408" x="486" y="326" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="494" y="342">Atlas Resolution</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="670" y="342">4096 × 4096</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="start" x="494" y="358">中文需要大图集</text><rect fill="#252530" height="38" rx="5" ry="6" stroke="#ffcc66" stroke-width="1" width="408" x="486" y="370" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="494" y="386">Character Set</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="670" y="386">Custom Characters</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="9px" font-weight="normal" text-anchor="start" x="494" y="402">粘贴常用中文字</text><rect fill="#6bcf7f" height="38" rx="8" ry="6" stroke="none" stroke-width="1.5" width="280" x="550" y="424" /><text fill="#1e1e1e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="690" y="450">Generate Font Atlas → Save</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="494" y="479">设为默认字体：</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="494" y="501">TMP Settings.asset → Default Font Asset → 拖入新字体</text><rect fill="#2a2a20" height="50" rx="6" ry="6" stroke="#ffcc66" stroke-width="1.5" width="870" x="40" y="450" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="60" y="468">方案 A（推荐）：设为 Default Font Asset → 所有新 Text 自动支持中文</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="60" y="488">方案 B：在 TMP Settings 的 Fallback Font Assets 列表中加入中文字体 → 遇到中文自动回退</text></svg>