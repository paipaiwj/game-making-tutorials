<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 850 480" width="850px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="480" width="850" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="425" y="34">角色菜单 Hierarchy 结构</text><rect fill="#2b2b2b" height="380" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="380" x="40" y="70" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="230" y="92">Hierarchy</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="start" x="56" y="118">MenuCanvas  (World Space + VRC Ui Shape)</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="start" x="72" y="144">  ▼ MenuPanel (Image)  (背景 + Vertical Layout)</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="88" y="170">    TitleText (Text)  (角色名称)</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="88" y="196">    VolumeSlider (Slider)  (音量控制)</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="88" y="222">    MicToggle (Toggle)  (麦克风开关)</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="88" y="248">    EmoteButton (Button)  (切换表情)</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="88" y="274">    TeleportButton (Button)  (传送)</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="start" x="72" y="300">  MenuScript  (UdonBehaviour + 脚本)</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="620" y="70">每个控件的关键设置</text><rect fill="#252530" height="75" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="360" x="450" y="100" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="466" y="120">Slider</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="466" y="140">OnValueChanged → 脚本方法</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="466" y="158">Min=0, Max=1</text><rect fill="#252530" height="75" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="360" x="450" y="190" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="466" y="210">Toggle</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="466" y="230">OnValueChanged → 脚本方法</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="466" y="248">isOn 判断开关</text><rect fill="#252530" height="75" rx="6" ry="6" stroke="#ffcc66" stroke-width="1.5" width="360" x="450" y="280" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="start" x="466" y="300">Button</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="466" y="320">OnClick → SendCustomEvent</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="466" y="338">绑定 UdonBehaviour</text></svg>