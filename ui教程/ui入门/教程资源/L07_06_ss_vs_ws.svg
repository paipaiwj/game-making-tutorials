<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">Screen Space vs World Space — 一图看懂区别</text><rect fill="#1a1a2e" height="370" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="380" x="45" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17px" font-weight="bold" text-anchor="middle" x="235" y="96">Screen Space</text><rect fill="#1e1e1e" height="200" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="300" x="85" y="120" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="235" y="225">屏幕</text><rect fill="#4ea1ff" height="22" opacity="0.7" rx="4" ry="6" stroke="none" stroke-width="1.5" width="100" x="115" y="145" /><rect fill="#ff9e4e" height="18" opacity="0.7" rx="4" ry="6" stroke="none" stroke-width="1.5" width="80" x="115" y="185" /><rect fill="#6bcf7f" height="24" opacity="0.7" rx="4" ry="6" stroke="none" stroke-width="1.5" width="120" x="115" y="220" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="65" y="340">❌ 不能放在 3D 世界中</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="65" y="364">❌ VRChat 玩家无法走近交互</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="65" y="388">❌ 每个玩家看到的都一样</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="65" y="412">✅ 适合普通游戏 HUD</text><rect fill="#1a2e1a" height="370" rx="10" ry="6" stroke="#6bcf7f" stroke-width="3" width="380" x="475" y="70" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="17px" font-weight="bold" text-anchor="middle" x="665" y="96">World Space</text><rect fill="#6bcf7f" height="20" opacity="0.3" rx="4" ry="6" stroke="none" stroke-width="1.5" width="45" x="800" y="80" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="823" y="94">VRC</text><rect fill="#1e1e1e" height="200" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="515" y="120" /><line stroke="#3a3a3a" stroke-width="1.5" x1="535" x2="795" y1="280" y2="280" /><rect fill="#1a2e1a" height="80" rx="6" ry="6" stroke="#6bcf7f" stroke-width="2" width="140" x="565" y="160" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="635" y="205">World UI</text><ellipse cx="545" cy="240" fill="#ff9e4e" opacity="1.0" rx="10" ry="10" stroke="none" stroke-width="1.0" /><line stroke="#ff9e4e" stroke-width="2" x1="545" x2="545" y1="250" y2="275" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="495" y="340">✅ 是场景中的 3D 物体</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="495" y="364">✅ 玩家可走近、用手点击</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="495" y="388">✅ 多玩家看到同一块面板</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="495" y="412">✅ VRChat 开发的唯一选择</text></svg>