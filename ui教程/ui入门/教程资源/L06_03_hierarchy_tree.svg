<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="620px" version="1.1" viewBox="0 0 750 620" width="750px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="620" width="750" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="375" y="34">Hierarchy 层级结构</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-style="italic" font-weight="normal" text-anchor="middle" x="375" y="58">两个 Panel 并列在 Canvas 下，GameManager 独立管理</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1.8" width="520" x="115" y="80" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="125" y="101">📦 Canvas</text><line stroke="#3a3a3a" stroke-width="1.5" x1="375" x2="375" y1="110" y2="130" /><rect fill="#252530" height="30" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1.8" width="240" x="135" y="135" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="145" y="156">🔵 LoginPanel (Image)</text><line stroke="#4ea1ff" stroke-width="1.5" x1="255" x2="255" y1="165" y2="185" /><rect fill="#252530" height="30" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="210" x="150" y="190" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="160" y="211">  └ Title (Text)</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="370" y="211">欢迎登录</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="210" x="150" y="224" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="160" y="245">  └ UsernameInput (InputField)</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="370" y="245">用户名</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="210" x="150" y="258" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="160" y="279">  └ PasswordInput (InputField)</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="370" y="279">密码 (Password)</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="210" x="150" y="292" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="160" y="313">  └ LoginButton (Button)</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="370" y="313">登录</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="210" x="150" y="326" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="160" y="347">  └ ErrorText (Text)</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="370" y="347">错误提示 (初始隐藏)</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#6bcf7f" stroke-width="1.8" width="240" x="390" y="135" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="400" y="156">🟢 MainPanel (Image)</text><line stroke="#6bcf7f" stroke-width="1.5" x1="510" x2="510" y1="165" y2="185" /><rect fill="#6bcf7f" height="22" opacity="0.2" rx="4" ry="6" stroke="none" stroke-width="1.5" width="90" x="530" y="138" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="575" y="154">初始 false</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="210" x="405" y="190" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="415" y="211">  └ WelcomeText (Text)</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="625" y="211">登录成功！</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="210" x="405" y="224" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="415" y="245">  └ SettingsButton (Button)</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="625" y="245">设置</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1.8" width="210" x="405" y="258" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="415" y="279">  └ LogoutButton (Button)</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="625" y="279">退出登录</text><line stroke="#ff9e4e" stroke-width="1.5" x1="375" x2="375" y1="325" y2="360" /><rect fill="#252530" height="30" rx="5" ry="6" stroke="#ff9e4e" stroke-width="1.8" width="320" x="215" y="360" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="225" y="381">🎮 GameManager (Empty + LoginManager.cs)</text><line opacity="0.6" stroke="#ff9e4e" stroke-dasharray="4,4" stroke-width="1.2" x1="375" x2="255" y1="390" y2="165" /><line opacity="0.6" stroke="#ff9e4e" stroke-dasharray="4,4" stroke-width="1.2" x1="375" x2="510" y1="390" y2="165" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="375" y="590">GameManager 通过 public GameObject 引用两个 Panel，在脚本中控制 SetActive</text></svg>