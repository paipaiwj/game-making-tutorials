<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="450px" version="1.1" viewBox="0 0 1000 450" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="450" width="1000" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="500" y="34">Canvas 三种 Render Mode</text><rect fill="#1a1a2e" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="270" x="65" y="80" /><rect fill="#252530" height="90" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1" width="230" x="85" y="95" /><rect fill="#1e1e1e" height="70" rx="4" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="190" x="105" y="105" /><rect fill="#4ea1ff" height="14" rx="3" ry="6" stroke="none" stroke-width="1.5" width="60" x="125" y="120" /><rect fill="#9aa0a6" height="10" rx="3" ry="6" stroke="none" stroke-width="1.5" width="40" x="125" y="145" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="200" y="175">UI</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="200" y="200">贴屏幕</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="200" y="217">Screen Space - Overlay</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="80" y="237">UI 始终贴在屏幕最上层</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="80" y="255">无论相机怎么动都不变</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="80" y="273">适合：普通游戏 HUD、主菜单</text><rect fill="#1a1a2e" height="200" rx="10" ry="6" stroke="#ffcc66" stroke-width="2" width="270" x="365" y="80" /><rect fill="#252530" height="90" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1" width="230" x="385" y="95" /><rect fill="#ffcc66" height="20" rx="3" ry="6" stroke="none" stroke-width="1.5" width="30" x="400" y="110" /><ellipse cx="415" cy="120" fill="#1e1e1e" opacity="1.0" rx="8" ry="6" stroke="none" stroke-width="1.0" /><line stroke="#ffcc66" stroke-dasharray="3,3" stroke-width="1" x1="430" x2="465" y1="120" y2="135" /><rect fill="#252530" height="40" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="60" x="465" y="135" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="495" y="160">UI</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="500" y="200">跟相机</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="500" y="217">Screen Space - Camera</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="380" y="237">UI 跟随指定相机</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="380" y="255">可被 3D 物体遮挡</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="380" y="273">适合：需要深度感的 UI</text><rect fill="#1a1a2e" height="200" rx="10" ry="6" stroke="#6bcf7f" stroke-width="3" width="270" x="665" y="80" /><rect fill="#252530" height="90" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1" width="230" x="685" y="95" /><rect fill="#1a2e1a" height="55" rx="4" ry="6" stroke="#6bcf7f" stroke-width="2" width="170" x="715" y="110" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="800" y="143">UI</text><ellipse cx="705" cy="150" fill="#ff9e4e" opacity="1.0" rx="8" ry="8" stroke="none" stroke-width="1.0" /><line stroke="#ff9e4e" stroke-width="2" x1="705" x2="705" y1="158" y2="173" /><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="1.5" x1="700" x2="720" y1="145" y2="130" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="bold" text-anchor="middle" x="800" y="200">3D世界</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="800" y="217">World Space</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="680" y="237">UI 是场景中的 3D 物体</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="680" y="255">玩家可走近、可绕到背后看</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="680" y="273">适合：VRChat 世界面板</text><rect fill="#6bcf7f" height="20" opacity="0.3" rx="4" ry="6" stroke="none" stroke-width="1.5" width="45" x="880" y="88" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="middle" x="903" y="103">VRC</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="500" y="425">VRChat 开发必须用 World Space — UI 是场景的一部分，不是屏幕贴纸</text></svg>