ily="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="546" y="325">• VRC角色菜单</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="546" y="349">• 完整项目</text><rect fill="#1a1a2e" height="155" rx="10" ry="6" stroke="#9aa0a6" stroke-width="2" width="200" x="760" y="280" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="860" y="302">速查篇 (13)</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="776" y="325">• 控件速查</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="776" y="349">• 错误排查</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="776" y="373">• 知识地图</text><line marker-end="url(#arrowhead)" stroke="#3a3a3a" stroke-width="1.5" x1="250" x2="270" y1="170" y2="170" /><line marker-end="url(#arrowhead)" stroke="#3a3a3a" stroke-width="1.5" x1="470" x2="500" y1="170" y2="170" /><line marker-end="url(#arrowhead)" stroke="#3a3a3a" stroke-width="1.5" x1="250" x2="250" y1="170" y2="280" /><line marker-end="url(#arrowhead)" stroke="#3a3a3a" stroke-width="1.5" x1="470" x2="470" y1="170" y2="280" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="500" y="495">🎉 恭喜完成全部 13 篇！下一步：动手做自己的 VRC 菜单，遇到问题随时回来查速查表。</text></svg>