<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">Vertical Layout Group — 核心属性</text><rect fill="#2b2b2b" height="370" rx="8" ry="6" stroke="#6bcf7f" stroke-width="2" width="330" x="40" y="70" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="205" y="92">Vertical Layout Group</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="120">Padding</text><rect fill="#252530" height="50" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1" width="298" x="56" y="125" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="144">Left/Right/Top/Bottom</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="66" y="162">容器内边距</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="184">Spacing</text><rect fill="#252530" height="50" rx="5" ry="6" stroke="#6bcf7f" stroke-width="1" width="298" x="56" y="189" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="208">子元素之间的间距</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="66" y="226">推荐 5-10</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="248">Child Alignment</text><rect fill="#252530" height="50" rx="5" ry="6" stroke="#ffcc66" stroke-width="1" width="298" x="56" y="253" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="272">Upper/Middle/Lower</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="66" y="290">子元素对齐方式</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="312">Child Force Expand</text><rect fill="#252530" height="50" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1" width="298" x="56" y="317" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="336">Width / Height</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="66" y="354">是否强制填满</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="630" y="70">Spacing 效果对比</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="420" y="105">Spacing = 0</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="550" y="105">挤在一起<