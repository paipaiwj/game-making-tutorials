<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="360px" version="1.1" viewBox="0 0 900 360" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="360" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">Slider / InputField / Toggle 对比</text><rect fill="#2b2b2b" height="218" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="840" x="60" y="70" /><rect fill="#333333" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1" width="140" x="60" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="130" y="95">控件</text><rect fill="#333333" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1" width="240" x="200" y="70" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="320" y="95">用途</text><rect fill="#333333" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1" width="170" x="440" y="70" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="525" y="95">值类型</text><rect fill="#333333" height="38" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1" width="290" x="610" y="70" /><text fill="#a78bfa" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="755" y="95">事件</text><rect fill="#252525" height="60" opacity="0.5" rx="6" ry="6" stroke="none" stroke-width="1.5" width="838" x="61" y="108" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="130" y="143">Slider</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="200" x2="200" y1="108" y2="168" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="212" y="143">在范围内选数值</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="440" x2="440" y1="108" y2="168" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="452" y="143">float</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="610" x2="610" y1="108" y2="168" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="622" y="143">OnValueChanged</text><line opacity="0.4" stroke="#3a3a3a" stroke-width="0.5" x1="60" x2="900" y1="168" y2="168" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="130" y="203">InputField</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="200" x2="200" y1="168" y2="228" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="212" y="203">输入文字</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="440" x2="440" y1="168" y2="228" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="452" y="203">string</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="610" x2="610" y1="168" y2="228" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="622" y="203">OnValueChanged / OnEndEdit</text><line opacity="0.4" stroke="#3a3a3a" stroke-width="0.5" x1="60" x2="900" y1="228" y2="228" /><rect fill="#252525" height="60" opacity="0.5" rx="6" ry="6" stroke="none" stroke-width="1.5" width="838" x="61" y="228" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="130" y="263">Toggle</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="200" x2="200" y1="228" y2="288" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="212" y="263">二选一开关</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="440" x2="440" y1="228" y2="288" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="452" y="263">bool</text><line opacity="0.5" stroke="#3a3a3a" stroke-width="0.5" x1="610" x2="610" y1="228" y2="288" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="622" y="263">OnValueChanged</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="342">Button 用 OnClick（无参），其余三个用 OnValueChanged，参数类型不同</text></svg>