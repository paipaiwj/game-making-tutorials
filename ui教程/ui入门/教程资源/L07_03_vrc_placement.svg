<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker></defs><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">VRChat 场景中 UI 面板的常见放置方式</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="60">俯视图 — 三种经典位置</text><rect fill="#151520" height="340" rx="12" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="90" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="450" y="112">场景地板（俯视）</text><rect fill="#2a2a3a" height="300" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="20" x="80" y="110" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="90" y="270">墙</text><ellipse cx="180" cy="260" fill="#1a2e3a" opacity="1.0" rx="20" ry="20" stroke="#4ea1ff" stroke-width="2" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="16px" font-weight="normal" text-anchor="middle" x="180" y="266">🏠</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="180" y="290">出生点</text><rect fill="#6bcf7f" height="70" rx="2" ry="6" stroke="none" stroke-width="1.5" width="8" x="120" y="170" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="138" y="205">贴墙面板</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="138" y="222">面朝玩家出生方向</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="1" x1="124" x2="135" y1="205" y2="205" /><rect fill="#4ea1ff" height="60" rx="2" ry="6" stroke="none" stroke-width="1.5" width="8" x="440" y="180" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="458" y="200">浮空面板</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="458" y="217">像全息投影</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="458" y="232">科幻感十足</text><rect fill="#3a3020" height="30" rx="4" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="60" x="620" y="215" /><rect fill="#ff9e4e" height="8" rx="2" ry="6" stroke="none" stroke-width="1.5" width="50" x="625" y="210" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="650" y="258">桌面面板</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="650" y="273">平放像平板</text><rect fill="#2a2a20" height="44" rx="6" ry="6" stroke="#ffcc66" stroke-width="1" width="740" x="80" y="400" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="428">💡 用 Move Tool (W) 移动位置，Rotate Tool (E) 调整朝向。面板应该面向玩家来的方向。</text></svg>