<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="400px" version="1.1" viewBox="0 0 900 400" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="400" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">Content Size Fitter — 让容器自动适配内容</text><rect fill="#2a1a1a" height="280" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="380" x="40" y="80" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="230" y="102">❌ 无 Content Size Fitter</text><rect fill="#1e1e1e" height="100" rx="4" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="300" x="80" y="135" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="230" y="155">固定大小容器</text><rect fill="#252530" height="22" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="100" x="100" y="170" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="150" y="186">内容少</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="230" y="225">大量空白浪费空间</text><rect fill="#1a2e1a" height="280" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="380" x="480" y="80" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="670" y="102">✅ 有 Content Size Fitter</text><rect fill="#1e1e1e" height="55" rx="4" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="520" y="135" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="670" y="155">自动缩小适配内容</text><rect fill="#252530" height="22" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="100" x="540" y="155" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="middle" x="590" y="171">内容少</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="670" y="210">容器完美包裹内容！</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="510" y="240">Horizontal Fit / Vertical Fit 可选：</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="510" y="260">  • Unconstrained（不调整）</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="510" y="282">  • Min Size（最小尺寸）</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="510" y="304">  • Preferred Size（推荐尺寸）</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="510" y="326">  • Flexible Size（弹性尺寸）</text></svg>