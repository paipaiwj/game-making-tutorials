-serif" font-size="13px" font-weight="bold" text-anchor="start" x="476" y="332">④ 运行，鼠标滚轮滚动</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-style="italic" font-weight="normal" text-anchor="start" x="476" y="354">Content 比 Viewport 大就能滚动</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="455">💡 Content Size Fitter + Vertical Layout Group = 自动适配内容大小的滚动列表</text></svg>