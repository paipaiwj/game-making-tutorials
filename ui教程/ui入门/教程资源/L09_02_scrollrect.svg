<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">ScrollRect 组件 — 核心属性</text><rect fill="#2b2b2b" height="360" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="380" x="40" y="70" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="230" y="92">Inspector — Scroll Rect</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="120">Content</text><rect fill="#252530" height="34" rx="4" ry="6" stroke="#ff9e4e" stroke-width="1" width="348" x="56" y="126" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="148">拖入 Content 物体（必须）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="170">Horizontal</text><rect fill="#252530" height="34" rx="4" ry="6" stroke="#dddddd" stroke-width="1" width="348" x="56" y="176" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="198">☑ 允许水平滚动</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="220">Vertical</text><rect fill="#252530" height="34" rx="4" ry="6" stroke="#dddddd" stroke-width="1" width="348" x="56" y="226" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="248">☑ 允许垂直滚动</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="270">Movement Type</text><rect fill="#252530" height="34" rx="4" ry="6" stroke="#4ea1ff" stroke-width="1" width="348" x="56" y="276" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="298">Elastic（带回弹）/ Clamped（硬边界）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="56" y="320">Viewport</text><rect fill="#252530" height="34" rx="4" ry="6" stroke="#6bcf7f" stroke-width="1" width="348" x="56" y="326" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="66" y="348">拖入 Viewport 物体</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="640" y="70">Movement Type 效果对比</text><rect fill="#252530" height="50" rx="6" ry="6" stroke="#9aa0a6" stroke-width="1.5" width="410" x="450" y="100" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="466" y="118">Unrestricted</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="118">无限制滚动，可超出边界</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="600" y="134">适合：无限列表</text><rect fill="#252530" height="50" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="410" x="450" y="160" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="466" y="178">Elastic</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="178">超出边界后回弹（推荐）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="600" y="194">适合：大多数场景</text><rect fill="#252530" height="50" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="410" x="450" y="220" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="466" y="238">Clamped</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="238">硬边界，无法超出</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-style="italic" font-weight="normal" text-anchor="start" x="600" y="254">适合：精确分页</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="435">💡 Content 的 RectTransform 大小决定可滚动范围。Content 比 Viewport 大 = 可滚动。</text></svg>