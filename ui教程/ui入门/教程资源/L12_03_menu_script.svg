<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 900 500" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="500" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="22px" font-weight="bold" text-anchor="middle" x="450" y="34">VRCCharacterMenu 脚本交互图</text><rect fill="#252530" height="50" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="300" x="40" y="80" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="56" y="98">TMP_Text titleText</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="118">角色名称显示</text><rect fill="#252530" height="50" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="300" x="40" y="140" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="56" y="158">Slider volumeSlider</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="178">音量滑块</text><rect fill="#252530" height="50" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="300" x="40" y="200" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="56" y="218">Toggle micToggle</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="238">麦克风开关</text><rect fill="#252530" height="36" rx="5" ry="6" stroke="#9aa0a6" stroke-width="1" width="480" x="380" y="80" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="396" y="104">Start()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="104">初始化 → titleText.text = "我的角色"</text><rect fill="#252530" height="36" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1" width="480" x="380" y="124" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="396" y="148">OnVolumeChanged()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="148">Slider 拖动 → Debug.Log 音量值</text><rect fill="#252530" height="36" rx="5" ry="6" stroke="#6bcf7f" stroke-width="1" width="480" x="380" y="168" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="396" y="192">OnMicToggled()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="192">Toggle 切换 → Debug.Log 开关状态</text><rect fill="#252530" height="36" rx="5" ry="6" stroke="#ff9e4e" stroke-width="1" width="480" x="380" y="212" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="396" y="236">OnEmoteClicked()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="236">表情按钮 → Debug.Log 切换表情</text><rect fill="#252530" height="36" rx="5" ry="6" stroke="#ffcc66" stroke-width="1" width="480" x="380" y="256" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="396" y="280">OnTeleportClicked()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="280">传送按钮 → Debug.Log 传送</text><rect fill="#252530" height="36" rx="5" ry="6" stroke="#6bcf7f" stroke-width="1" width="480" x="380" y="300" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="396" y="324">Interact()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="600" y="324">玩家交互 → Debug.Log</text><line opacity="0.4" stroke="#4ea1ff" stroke-dasharray="3,3" stroke-width="1" x1="340" x2="380" y1="105" y2="98" /><line opacity="0.4" stroke="#4ea1ff" stroke-dasharray="3,3" stroke-width="1" x1="340" x2="380" y1="165" y2="142" /><line opacity="0.4" stroke="#6bcf7f" stroke-dasharray="3,3" stroke-width="1" x1="340" x2="380" y1="225" y2="186" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="480">💡 在 VRChat 中 Debug.Log 不会显示。实际项目用 VRC SDK 的 API 做网络同步。</text></svg>