<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="500px" version="1.1" viewBox="0 0 950 500" width="950px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="500" width="950" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="475" y="34">VRChat 中 Button Color Tint 不可靠 — 用 UdonSharp 替代</text><rect fill="#2a1a1a" height="380" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="410" x="40" y="75" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="245" y="99">❌ Unity 内置 Color Tint</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="245" y="119">在 VRChat 中不可靠</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="350" x="70" y="140" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="82" y="161">Normal</text><rect fill="#cccccc" height="18" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="18" x="190" y="146" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="220" y="161">正常</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="350" x="70" y="176" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="82" y="197">Highlighted</text><rect fill="#cccccc" height="18" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="18" x="190" y="182" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="220" y="197">不触发！</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#ffcc66" stroke-width="1.5" width="350" x="70" y="212" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="82" y="233">Pressed</text><rect fill="#cccccc" height="18" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="18" x="190" y="218" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="220" y="233">不触发！</text><rect fill="#252530" height="30" rx="5" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="350" x="70" y="248" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="82" y="269">卡住</text><rect fill="#cccccc" height="18" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="18" x="190" y="254" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="220" y="269">回不去</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="245" y="294">原因：VRChat 自定义射线绕过</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="245" y="312">了 Unity Selectable 状态机</text><rect fill="#1a2e1a" height="380" rx="10" ry="6" stroke="#6bcf7f" stroke-width="3" width="420" x="490" y="75" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="15px" font-weight="bold" text-anchor="middle" x="700" y="99">✅ UdonSharp 手动控制</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="700" y="119">Transition 选 None，用脚本控制颜色</text><rect fill="#252530" height="38" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1" width="380" x="510" y="140" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="520" y="156">OnPointerEnter()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="520" y="172">targetImage.color = hoverColor</text><rect fill="#cccccc" height="18" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="18" x="840" y="150" /><rect fill="#252530" height="38" rx="5" ry="6" stroke="#ffcc66" stroke-width="1" width="380" x="510" y="184" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="520" y="200">OnPointerDown()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="520" y="216">targetImage.color = pressedColor</text><rect fill="#cccccc" height="18" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="18" x="840" y="194" /><rect fill="#252530" height="38" rx="5" ry="6" stroke="#4ea1ff" stroke-width="1" width="380" x="510" y="228" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="520" y="244">OnPointerUp()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="520" y="260">targetImage.color = hoverColor</text><rect fill="#cccccc" height="18" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="18" x="840" y="238" /><rect fill="#252530" height="38" rx="5" ry="6" stroke="#dddddd" stroke-width="1" width="380" x="510" y="272" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="520" y="288">OnPointerExit()</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="520" y="304">targetImage.color = normalColor</text><rect fill="#cccccc" height="18" rx="3" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="18" x="840" y="282" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="start" x="520" y="326">配置步骤：</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="520" y="346">① Button 的 Transition 设为 None</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="520" y="368">② 挂上 VRCButtonColor 脚本</text><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="520" y="390">③ 调整 Normal/Hover/Pressed 颜色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="475" y="480">核心：VRChat 的射线系统不触发 Unity 的 PointerEnter/Exit 事件，必须用 UdonSharp 的 OnPointer 系列方法</text></svg>