33">② 改名 LoginPanel，设 Color + Size</text><rect fill="#252530" height="28" rx="5" ry="6" stroke="#3a3a3a" stroke-width="1" width="158" x="380" y="514" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="388" y="533">③ 逐个添加子控件（右键 LoginPanel）</text><rect fill="#252530" height="28" rx="5" ry="6" stroke="#3a3a3a" stroke-width="1" width="158" x="550" y="514" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="558" y="533">④ PasswordInput → Content Type = Password</text><rect fill="#252530" height="28" rx="5" ry="6" stroke="#3a3a3a" stroke-width="1" width="158" x="720" y="514" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="normal" text-anchor="start" x="728" y="533">⑤ ErrorText → 初始取消勾选 SetActive</text></svg>