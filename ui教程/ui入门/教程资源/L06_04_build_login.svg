t><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="248">  Width: 400  Height: 350</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="56" y="266">  Anchor: middle-center</text><rect fill="#2b2b2b" height="460" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="420" x="440" y="60" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="650" y="84">LoginPanel 子控件布局</text><rect fill="#1a1a2e" height="400" rx="8" ry="6" stroke="#4ea1ff" stroke-width="2" width="340" x="480" y="110" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="650" y="140">欢迎登录</text><line stroke="#ff9e4e" stroke-dasharray="2,2" stroke-width="1" x1="820" x2="835" y1="140" y2="140" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="start" x="839" y="144">Title</text><rect fill="#252530" height="36" rx="5" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="280" x="510" y="177" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="start" x="525" y="200">👤 请输入用户名</text><line stroke="#ff9e4e" stroke-dasharray="2,2" stroke-width="1" x1="820" x2="835" y1="195" y2="195" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10px" font-weight="bold" text-anchor="start" x="839" y="199">UsernameInput</text><rect fill="#252530" height="36" rx="5" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="280" x="510" y="247" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC,