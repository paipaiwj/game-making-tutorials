<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#c084fc" /></marker></defs><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">材质 Material：给模型上色</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="62">完整流程：建模 → 展 UV → 画贴图 → 建材质 → 指定贴图</text><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="155" x="32" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="109" y="122">1 建模</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="109" y="150">做好形状</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="109" y="170">检查面数</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2" x1="189" x2="200" y1="180" y2="180" /><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="155" x="202" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="279" y="122">2 展 UV</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="279" y="150">U → Unwrap</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="279" y="170">摊平表面</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2" x1="359" x2="370" y1="180" y2="180" /><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="155" x="372" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="449" y="122">3 画贴图</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="449" y="150">PS / 在线工具</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="449" y="170">画颜色细节</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2" x1="529" x2="540" y1="180" y2="180" /><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="155" x="542" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="619" y="122">4 建材质</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="619" y="150">材质属性面板</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="619" y="170">(球图标) → New</text><line marker-end="url(#arrowhead)" stroke="#c084fc" stroke-width="2" x1="699" x2="710" y1="180" y2="180" /><rect fill="#2b2b2b" height="170" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="155" x="712" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="789" y="122">5 指定贴图</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="789" y="150">Base Color 选贴图</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="789" y="170">或直接填颜色</text><rect fill="#1a1a1a" height="70" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="290" /><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="318">材质面板操作：选中模型 → 右侧属性面板 → 材质（球图标）→ New → Base Color 选颜色或贴图片</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="90" y="342">只想要纯色？不用画贴图，Base Color 直接选颜色就行</text><rect fill="#1a1a1a" height="70" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="380" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="90" y="408">贴图尺寸：VRChat 常用 1024 / 2048</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="432">贴图越大越清晰也越吃显存 —— 小物件 512/1024 就够，别一上来就 4096；多个小物件共用一张贴图（合图）最省</text></svg>