<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="480px" version="1.1" viewBox="0 0 900 480" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#c084fc" /></marker></defs><rect fill="#1e1e1e" height="480" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">常用修改器 Modifiers（属性面板里的扳手图标）</text><rect fill="#2b2b2b" height="250" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="185" x="60" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="152" y="108">细分 Subdivision</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="152" y="134">让模型变光滑</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="152" y="152">面数会变多</text><ellipse cx="105" cy="195" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="105" cy="237" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="105" cy="279" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="150" cy="195" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="150" cy="237" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="150" cy="279" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="195" cy="195" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="195" cy="237" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><ellipse cx="195" cy="279" fill="#6bcf7f" opacity="1.0" rx="5" ry="5" stroke="none" stroke-width="1.0" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="152" y="325">2 级细分</text><rect fill="#2b2b2b" height="250" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="185" x="260" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="352" y="108">镜像 Mirror</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="352" y="134">只做一半</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="352" y="152">自动对称另一半</text><path d="M320,195 A 45,45 0 0 0 320,285 Z" fill="#4ea1ff" opacity="0.5" stroke="#4ea1ff" stroke-width="1.5" /><line stroke="#6e6e6e" stroke-dasharray="[4, 3]" stroke-width="1.5" x1="365" x2="365" y1="185" y2="295" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="365" y="320">镜像轴</text><rect fill="#2b2b2b" height="250" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="185" x="460" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="552" y="108">布尔 Boolean</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="552" y="134">用 A 减去 B</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="552" y="152">挖洞、开窗</text><rect fill="none" height="55" rx="6" ry="6" stroke="#ff9e4e" stroke-width="2" width="75" x="495" y="185" /><ellipse cx="560" cy="220" fill="#ff9e4e" opacity="0.5" rx="28" ry="28" stroke="#ff9e4e" stroke-width="1.5" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="552" y="320">A 减 B = 挖洞</text><rect fill="#2b2b2b" height="250" rx="10" ry="6" stroke="#c084fc" stroke-width="2" width="185" x="660" y="80" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="752" y="108">实体化 Solidify</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="752" y="134">给薄片加厚度</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="752" y="152">薄墙变厚墙</text><line stroke="#6e6e6e" stroke-width="3" x1="700" x2="800" y1="215" y2="215" /><line marker-end="url(#arrowhead)" stroke="#c084fc" stroke-width="2" x1="760" x2="795" y1="270" y2="270" /><rect fill="#c084fc" height="30" opacity="0.4" rx="6" ry="6" stroke="#c084fc" stroke-width="1.5" width="55" x="695" y="255" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="10.5px" font-weight="normal" text-anchor="middle" x="752" y="320">加厚度</text><rect fill="#1a1a1a" height="90" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="350" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="start" x="90" y="380">修改器不会破坏原始网格，可随时开关、调参数、删除</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="406">但导出到 Unity 前一定要在修改器上点 Apply 应用 —— 否则 Unity 里看不到效果</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="430">注意：细分、布尔会显著增加面数，应用前先想好预算</text></svg>