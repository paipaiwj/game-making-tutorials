<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="540px" version="1.1" viewBox="0 0 900 540" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="540" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">3D 模型三要素：顶点、边、面</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="62">所有 3D 模型，都是由这三样东西拼出来的</text><line stroke="#2f2f2f" stroke-width="1.5" x1="220" x2="400" y1="115" y2="115" /><line stroke="#2f2f2f" stroke-width="1.5" x1="400" x2="400" y1="115" y2="275" /><line stroke="#2f2f2f" stroke-width="1.5" x1="400" x2="220" y1="275" y2="275" /><line stroke="#2f2f2f" stroke-width="1.5" x1="220" x2="220" y1="275" y2="115" /><line stroke="#9aa0a6" stroke-width="1.5" x1="140" x2="320" y1="170" y2="170" /><line stroke="#9aa0a6" stroke-width="1.5" x1="320" x2="320" y1="170" y2="330" /><line stroke="#9aa0a6" stroke-width="1.5" x1="320" x2="140" y1="330" y2="330" /><line stroke="#9aa0a6" stroke-width="1.5" x1="140" x2="140" y1="330" y2="170" /><line stroke="#2f2f2f" stroke-width="1.5" x1="140" x2="220" y1="170" y2="115" /><line stroke="#2f2f2f" stroke-width="1.5" x1="320" x2="400" y1="170" y2="115" /><line stroke="#2f2f2f" stroke-width="1.5" x1="320" x2="400" y1="330" y2="275" /><line stroke="#2f2f2f" stroke-width="1.5" x1="140" x2="220" y1="330" y2="275" /><path d="M140,170 L320,170 L400,115 L220,115 Z" fill="#4ea1ff" opacity="0.22" stroke="none" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="270" y="143">面 Face</text><line stroke="#6bcf7f" stroke-width="3" x1="220" x2="400" y1="115" y2="115" /><line stroke="#6bcf7f" stroke-width="1.5" x1="320" x2="320" y1="105" y2="92" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="320" y="86">边 Edge</text><ellipse cx="140" cy="330" fill="#ff9e4e" opacity="1.0" rx="7" ry="7" stroke="none" stroke-width="1.0" /><line stroke="#ff9e4e" stroke-width="1.5" x1="140" x2="108" y1="330" y2="348" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="40" y="352">顶点 Vertex</text><rect fill="#2b2b2b" height="108" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="440" x="410" y="92" /><ellipse cx="440" cy="118" fill="#4ea1ff" opacity="1.0" rx="7" ry="7" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="462" y="124">顶点 Vertex</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="462" y="154">网格的交点，决定形状轮廓</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="462" y="174">移动顶点 = 改变形状</text><rect fill="#2b2b2b" height="108" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="440" x="410" y="214" /><ellipse cx="440" cy="240" fill="#6bcf7f" opacity="1.0" rx="7" ry="7" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="462" y="246">边 Edge</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="462" y="276">连接两个顶点的线段</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="462" y="296">边围起来才形成面</text><rect fill="#2b2b2b" height="108" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="440" x="410" y="336" /><ellipse cx="440" cy="362" fill="#ff9e4e" opacity="1.0" rx="7" ry="7" stroke="none" stroke-width="1.0" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="462" y="368">面 Face</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="462" y="398">三个以上顶点围成的区域</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="462" y="418">渲染时真正看到的表面</text><rect fill="#1a1a1a" height="56" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="700" x="100" y="456" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="488">网格 Mesh = 顶点 + 边 + 面的集合。VRChat 世界里你看到的每个道具、家具，都是网格</text></svg>