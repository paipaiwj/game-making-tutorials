<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 900 520" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#ff9e4e" /></marker></defs><rect fill="#1e1e1e" height="520" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">挤出 Extrude（E）：建模最常用的操作</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="62">把选中的面「拉长」出一段新网格，造箱子、椅子、墙都靠它</text><rect fill="#2b2b2b" height="300" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="360" x="60" y="90" /><line stroke="#2f2f2f" stroke-width="1.5" x1="195" x2="365" y1="157" y2="157" /><line stroke="#2f2f2f" stroke-width="1.5" x1="365" x2="365" y1="157" y2="307" /><line stroke="#2f2f2f" stroke-width="1.5" x1="365" x2="195" y1="307" y2="307" /><line stroke="#2f2f2f" stroke-width="1.5" x1="195" x2="195" y1="307" y2="157" /><line stroke="#9aa0a6" stroke-width="1.5" x1="140" x2="310" y1="195" y2="195" /><line stroke="#9aa0a6" stroke-width="1.5" x1="310" x2="310" y1="195" y2="345" /><line stroke="#9aa0a6" stroke-width="1.5" x1="310" x2="140" y1="345" y2="345" /><line stroke="#9aa0a6" stroke-width="1.5" x1="140" x2="140" y1="345" y2="195" /><line stroke="#2f2f2f" stroke-width="1.5" x1="140" x2="195" y1="195" y2="157" /><line stroke="#2f2f2f" stroke-width="1.5" x1="310" x2="365" y1="195" y2="157" /><line stroke="#2f2f2f" stroke-width="1.5" x1="310" x2="365" y1="345" y2="307" /><line stroke="#2f2f2f" stroke-width="1.5" x1="140" x2="195" y1="345" y2="307" /><path d="M140,195 L310,195 L365,157 L195,157 Z" fill="#4ea1ff" opacity="0.22" stroke="none" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="245" y="168">选中顶面</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="240" y="372">挤出前</text><line marker-end="url(#arrowhead)" stroke="#ff9e4e" stroke-width="2.5" x1="432" x2="466" y1="290" y2="290" /><rect fill="#2b2b2b" height="300" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="360" x="480" y="90" /><line stroke="#2f2f2f" stroke-width="1.5" x1="595" x2="765" y1="202" y2="202" /><line stroke="#2f2f2f" stroke-width="1.5" x1="765" x2="765" y1="202" y2="352" /><line stroke="#2f2f2f" stroke-width="1.5" x1="765" x2="595" y1="352" y2="352" /><line stroke="#2f2f2f" stroke-width="1.5" x1="595" x2="595" y1="352" y2="202" /><line stroke="#9aa0a6" stroke-width="1.5" x1="540" x2="710" y1="240" y2="240" /><line stroke="#9aa0a6" stroke-width="1.5" x1="710" x2="710" y1="240" y2="390" /><line stroke="#9aa0a6" stroke-width="1.5" x1="710" x2="540" y1="390" y2="390" /><line stroke="#9aa0a6" stroke-width="1.5" x1="540" x2="540" y1="390" y2="240" /><line stroke="#2f2f2f" stroke-width="1.5" x1="540" x2="595" y1="240" y2="202" /><line stroke="#2f2f2f" stroke-width="1.5" x1="710" x2="765" y1="240" y2="202" /><line stroke="#2f2f2f" stroke-width="1.5" x1="710" x2="765" y1="390" y2="352" /><line stroke="#2f2f2f" stroke-width="1.5" x1="540" x2="595" y1="390" y2="352" /><line stroke="#6bcf7f" stroke-width="2" x1="540" x2="710" y1="178" y2="178" /><line stroke="#6bcf7f" stroke-width="2" x1="710" x2="765" y1="178" y2="140" /><line stroke="#6bcf7f" stroke-width="2" x1="765" x2="595" y1="140" y2="140" /><line stroke="#6bcf7f" stroke-width="2" x1="595" x2="540" y1="140" y2="178" /><line stroke="#6bcf7f" stroke-width="2" x1="540" x2="540" y1="240" y2="178" /><line stroke="#6bcf7f" stroke-width="2" x1="710" x2="710" y1="240" y2="178" /><line stroke="#6bcf7f" stroke-width="2" x1="765" x2="765" y1="202" y2="140" /><line stroke="#6bcf7f" stroke-width="2" x1="595" x2="595" y1="202" y2="140" /><path d="M540,178 L710,178 L765,140 L595,140 Z" fill="#6bcf7f" opacity="0.2" stroke="none" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="620" y="218">按 E 后向上拖动</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="660" y="372">挤出后（高亮=新长出的一段）</text><rect fill="#1a1a1a" height="80" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="410" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="90" y="438">操作步骤</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="462">① Tab 进入编辑模式  ② 选中顶面（右键）  ③ 按 E  ④ 向上拖动鼠标  ⑤ 左键确认</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="484">配合 Ctrl+R 环切加分段，可以继续拉伸、压扁，做出椅子腿、桌面等形状</text></svg>