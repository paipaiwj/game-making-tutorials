<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">Blender 快捷键速查表</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="60" y="68" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="92" x="74" y="82" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="120" y="105">Tab</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="186" y="105">编辑模式 / 对象模式 切换</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="480" y="68" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="92" x="494" y="82" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="540" y="105">G</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="606" y="105">移动 Move（G+X 沿 X 轴）</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="60" y="144" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="92" x="74" y="158" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="120" y="181">R</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="186" y="181">旋转 Rotate（R+X 绕 X 轴）</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="390" x="480" y="144" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="92" x="494" y="158" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="540" y="181">S</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="606" y="181">缩放 Scale（S+数字 输入比例）</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="60" y="220" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="92" x="74" y="234" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="120" y="257">E</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="186" y="257">挤出 Extrude（编辑模式）</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="480" y="220" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="92" x="494" y="234" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="540" y="257">Ctrl+R</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="606" y="257">环切 Loop Cut（加分段）</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="60" y="296" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="92" x="74" y="310" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="120" y="333">A</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="186" y="333">全选 / Alt+A 取消全选</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="390" x="480" y="296" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="92" x="494" y="310" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="540" y="333">Z</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="606" y="333">切换线框 / 实体显示</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="60" y="372" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="92" x="74" y="386" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="120" y="409">Shift+右键</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="186" y="409">设置 3D 游标位置</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="480" y="372" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="92" x="494" y="386" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="540" y="409">Ctrl+Z</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="606" y="409">撤销 Undo</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="60" y="448" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="92" x="74" y="462" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="120" y="485">X</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="186" y="485">删除所选（Del）</text><rect fill="#2b2b2b" height="62" rx="8" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="390" x="480" y="448" /><rect fill="#1a1a1a" height="34" rx="6" ry="6" stroke="#ff9e4e" stroke-width="1.5" width="92" x="494" y="462" /><text fill="#9ecbff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="540" y="485">Ctrl+A</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="start" x="606" y="485">应用变换 Apply（导出前必做）</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="542">记不住没关系：多用就熟了。建模时手边放这张表，一周后就能记住八成</text></svg>