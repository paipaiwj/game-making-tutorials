<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="520px" version="1.1" viewBox="0 0 900 520" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker></defs><rect fill="#1e1e1e" height="520" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">展 UV：把 3D 表面摊平成 2D 地图</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="62">给立方体每个面编号 —— 展开后贴图才能准确贴到每个面上</text><rect fill="#2b2b2b" height="300" rx="10" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="300" x="60" y="90" /><line stroke="#2f2f2f" stroke-width="1.5" x1="170" x2="340" y1="167" y2="167" /><line stroke="#2f2f2f" stroke-width="1.5" x1="340" x2="340" y1="167" y2="317" /><line stroke="#2f2f2f" stroke-width="1.5" x1="340" x2="170" y1="317" y2="317" /><line stroke="#2f2f2f" stroke-width="1.5" x1="170" x2="170" y1="317" y2="167" /><line stroke="#9aa0a6" stroke-width="1.5" x1="115" x2="285" y1="205" y2="205" /><line stroke="#9aa0a6" stroke-width="1.5" x1="285" x2="285" y1="205" y2="355" /><line stroke="#9aa0a6" stroke-width="1.5" x1="285" x2="115" y1="355" y2="355" /><line stroke="#9aa0a6" stroke-width="1.5" x1="115" x2="115" y1="355" y2="205" /><line stroke="#2f2f2f" stroke-width="1.5" x1="115" x2="170" y1="205" y2="167" /><line stroke="#2f2f2f" stroke-width="1.5" x1="285" x2="340" y1="205" y2="167" /><line stroke="#2f2f2f" stroke-width="1.5" x1="285" x2="340" y1="355" y2="317" /><line stroke="#2f2f2f" stroke-width="1.5" x1="115" x2="170" y1="355" y2="317" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="242" y="152">1</text><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="112" y="280">5</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="200" y="330">3</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="210" y="375">3D 立方体</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="372" x2="410" y1="250" y2="250" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="380" y="214">U 菜单</text><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="bold" text-anchor="middle" x="380" y="236">→ Unwrap</text><rect fill="#2b2b2b" height="300" rx="10" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="420" x="430" y="90" /><rect fill="#1a1a1a" height="44" rx="4" ry="6" stroke="#4ea1ff" stroke-width="2" width="44" x="598" y="90" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="620" y="118">1</text><rect fill="#1a1a1a" height="44" rx="4" ry="6" stroke="#6bcf7f" stroke-width="2" width="44" x="548" y="140" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="570" y="168">3</text><rect fill="#1a1a1a" height="44" rx="4" ry="6" stroke="#ff9e4e" stroke-width="2" width="44" x="598" y="140" /><text fill="#ff9e4e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="620" y="168">5</text><rect fill="#1a1a1a" height="44" rx="4" ry="6" stroke="#c084fc" stroke-width="2" width="44" x="648" y="140" /><text fill="#c084fc" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="670" y="168">4</text><rect fill="#1a1a1a" height="44" rx="4" ry="6" stroke="#ffcc66" stroke-width="2" width="44" x="698" y="140" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="720" y="168">6</text><rect fill="#1a1a1a" height="44" rx="4" ry="6" stroke="#6e6e6e" stroke-width="2" width="44" x="598" y="190" /><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="middle" x="620" y="218">2</text><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="middle" x="640" y="295">UV 编辑器：六个面摊平成十字</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="middle" x="760" y="120">贴图图片</text><rect fill="#1a1a1a" height="80" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="410" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="bold" text-anchor="start" x="90" y="438">操作：编辑模式 → A 全选 → U 菜单 → Unwrap</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="462">UV 坐标告诉贴图「这个面的颜色从图片的哪一块取」—— 展得越平整，贴图越不拉伸变形</text><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="90" y="482">简单物体（箱子/墙）自动 Unwrap 就够；复杂物体要手动切缝（Mark Seam）</text></svg>