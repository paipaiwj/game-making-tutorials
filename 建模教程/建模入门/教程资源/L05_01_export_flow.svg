<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="460px" version="1.1" viewBox="0 0 900 460" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#4ea1ff" /></marker><marker id="arrowhead" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path d="M0,0 L0,10 L10,5 z" fill="#6bcf7f" /></marker></defs><rect fill="#1e1e1e" height="460" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="34">导出流程：Blender → FBX → Unity</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="normal" text-anchor="middle" x="450" y="62">FBX 是 Unity 与 Blender 之间的「通用语言」，VRChat 世界资产都用它</text><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#4ea1ff" stroke-width="2" width="245" x="60" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="182" y="124">Blender 建模</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="78" y="152">· 建模完成</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="78" y="174">· 检查法线：编辑模式全选</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="78" y="196">· Shift+N 重算法线</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="78" y="218">· Ctrl+A 应用全部变换</text><line marker-end="url(#arrowhead)" stroke="#4ea1ff" stroke-width="2.5" x1="310" x2="318" y1="195" y2="195" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#6bcf7f" stroke-width="2" width="245" x="325" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="447" y="124">导出 FBX</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="343" y="152">· File → Export → FBX</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="343" y="174">· 勾选 Apply Transforms</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="343" y="196">· 勾选 Mesh / 材质</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="343" y="218">· 路径别用中文</text><line marker-end="url(#arrowhead)" stroke="#6bcf7f" stroke-width="2.5" x1="575" x2="583" y1="195" y2="195" /><rect fill="#2b2b2b" height="200" rx="10" ry="6" stroke="#ff9e4e" stroke-width="2" width="245" x="590" y="95" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13.5px" font-weight="bold" text-anchor="middle" x="712" y="124">Unity 导入</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="608" y="152">· FBX 拖进 Assets</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="608" y="174">· Scale Factor 保持 1</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="608" y="196">· 材质若丢失重新指定</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11.5px" font-weight="normal" text-anchor="start" x="608" y="218">· 给物体加 Collider</text><rect fill="#1a1a1a" height="110" rx="8" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="780" x="60" y="320" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="14px" font-weight="bold" text-anchor="start" x="90" y="350">关于缩放（重要，别被老教程带偏）</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="378">Blender 默认单位是米，Unity 也是米 —— 正常 1:1 导入即可，不要乘 0.01</text><text fill="#9aa0a6" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="402">只有当你发现模型巨大/微小、或导出前单位被改成厘米/英尺时，才需要检查 Scale</text><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12.5px" font-weight="normal" text-anchor="start" x="90" y="424">标准做法：Blender 单位确认是米 + 导出勾 Apply Transforms + Unity Scale Factor = 1</text></svg>