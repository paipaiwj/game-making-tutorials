<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560px" version="1.1" viewBox="0 0 900 560" width="900px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#1e1e1e" height="560" width="900" x="0" y="0" /><text fill="#dddddd" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="20px" font-weight="bold" text-anchor="middle" x="450" y="32">常见问题对照表</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="160" x="60" y="66" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="140" y="88">问题现象</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="160" x="230" y="66" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="310" y="88">常见原因</text><rect fill="#2b2b2b" height="34" rx="6" ry="6" stroke="#4ea1ff" stroke-width="1.5" width="160" x="490" y="66" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="13px" font-weight="bold" text-anchor="middle" x="570" y="88">解决办法</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="160" x="60" y="100" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="140" y="136">模型是黑的 / 半透明</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="250" x="230" y="100" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="355" y="136">法线方向反了</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="370" x="490" y="100" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="506" y="136">编辑模式全选 → Shift+N 重算法线；必要时 Flip Normals 再导出</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="160" x="60" y="170" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="140" y="206">导入后巨大或微小</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="250" x="230" y="170" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="355" y="206">单位或 Scale 不对</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="370" x="490" y="170" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="506" y="206">确认 Blender 单位是米，导出勾 Apply Transforms，Scale Factor=1</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="160" x="60" y="240" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="140" y="276">导出后发白没贴图</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="250" x="230" y="240" /><text fill="#ffcc66" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="355" y="276">材质 / 贴图没带上</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="370" x="490" y="240" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="506" y="276">FBX 勾选嵌入贴图，或贴图放 Assets 重新指定</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="160" x="60" y="310" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="140" y="346">面数爆炸、进世界卡</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="250" x="230" y="310" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="355" y="346">细分 / 网格太密</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="370" x="490" y="310" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="506" y="346">看三角面数统计，降细分等级，用减面修改器或 LOD</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="160" x="60" y="380" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="140" y="416">位置 / 朝向不对</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="250" x="230" y="380" /><text fill="#4ea1ff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="355" y="416">没应用变换</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="370" x="490" y="380" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="506" y="416">导出前 Ctrl+A 应用全部变换，再重新导出</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="160" x="60" y="450" /><text fill="#fff" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="bold" text-anchor="middle" x="140" y="486">布尔后破面烂边</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#3a3a3a" stroke-width="1.5" width="250" x="230" y="450" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-weight="normal" text-anchor="middle" x="355" y="486">布尔网格质量差</text><rect fill="#2b2b2b" height="62" rx="6" ry="6" stroke="#6bcf7f" stroke-width="1.5" width="370" x="490" y="450" /><text fill="#6bcf7f" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="11px" font-weight="normal" text-anchor="start" x="506" y="486">布尔前先 Ctrl+A 并检查法线；必要时手动补面</text><text fill="#6e6e6e" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif" font-size="12px" font-style="italic" font-weight="normal" text-anchor="middle" x="450" y="548">调试心法：先检查法线，再检查单位 —— 模型 80% 的怪问题出在这两处</text></svg>